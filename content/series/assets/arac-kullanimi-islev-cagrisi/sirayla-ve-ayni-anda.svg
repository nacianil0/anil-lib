<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Aynı sorunun iki çözüm hattı: sırayla çalışan düşün–eyle–gözle döngüsü ile bağımsız aramaları aynı anda çalıştıran planlayıcı–çalıştırıcı düzeni; sağda ölçülen gecikme ve token sayıları.">
  <defs>
    <marker id="ok-47-sira" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)" />
    </marker>
    <marker id="ok-47-paralel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="20" y="26" font-size="13" font-weight="bold" fill="var(--text)">sırayla — düşün–eyle–gözle</text>

  <rect x="20" y="52" width="66" height="30" rx="5" fill="var(--surface)" stroke="var(--border)" />
  <text x="53" y="71" font-size="13" text-anchor="middle" fill="var(--text)">model</text>
  <line x1="88" y1="67" x2="98" y2="67" stroke="var(--text-muted)" marker-end="url(#ok-47-sira)" />
  <rect x="100" y="52" width="66" height="30" rx="5" fill="var(--cool-soft)" stroke="var(--cool)" />
  <text x="133" y="71" font-size="13" text-anchor="middle" fill="var(--text)">ara A</text>
  <line x1="168" y1="67" x2="178" y2="67" stroke="var(--text-muted)" marker-end="url(#ok-47-sira)" />
  <rect x="180" y="52" width="66" height="30" rx="5" fill="var(--surface)" stroke="var(--border)" />
  <text x="213" y="71" font-size="13" text-anchor="middle" fill="var(--text)">model</text>
  <line x1="248" y1="67" x2="258" y2="67" stroke="var(--text-muted)" marker-end="url(#ok-47-sira)" />
  <rect x="260" y="52" width="66" height="30" rx="5" fill="var(--cool-soft)" stroke="var(--cool)" />
  <text x="293" y="71" font-size="13" text-anchor="middle" fill="var(--text)">ara B</text>
  <line x1="328" y1="67" x2="338" y2="67" stroke="var(--text-muted)" marker-end="url(#ok-47-sira)" />
  <rect x="340" y="52" width="66" height="30" rx="5" fill="var(--surface)" stroke="var(--border)" />
  <text x="373" y="71" font-size="13" text-anchor="middle" fill="var(--text)">model</text>
  <line x1="408" y1="67" x2="418" y2="67" stroke="var(--text-muted)" marker-end="url(#ok-47-sira)" />
  <rect x="420" y="52" width="56" height="30" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="448" y="71" font-size="13" text-anchor="middle" fill="var(--text)">cevap</text>

  <line x1="20" y1="98" x2="476" y2="98" stroke="var(--text-faint)" marker-end="url(#ok-47-sira)" />
  <text x="20" y="118" font-size="13" fill="var(--text-muted)">zaman → her model çağrısı bir öncekinin bitmesini bekler</text>

  <text x="20" y="160" font-size="13" font-weight="bold" fill="var(--text)">aynı anda — planlayıcı + çalıştırıcı</text>

  <rect x="20" y="196" width="90" height="30" rx="5" fill="var(--surface)" stroke="var(--border)" />
  <text x="65" y="215" font-size="13" text-anchor="middle" fill="var(--text)">planlayıcı</text>
  <rect x="150" y="176" width="66" height="26" rx="5" fill="var(--cool-soft)" stroke="var(--cool)" />
  <text x="183" y="193" font-size="13" text-anchor="middle" fill="var(--text)">ara A</text>
  <rect x="150" y="220" width="66" height="26" rx="5" fill="var(--cool-soft)" stroke="var(--cool)" />
  <text x="183" y="237" font-size="13" text-anchor="middle" fill="var(--text)">ara B</text>
  <line x1="112" y1="205" x2="148" y2="190" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ok-47-paralel)" />
  <line x1="112" y1="217" x2="148" y2="232" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ok-47-paralel)" />
  <rect x="256" y="196" width="66" height="30" rx="5" fill="var(--surface)" stroke="var(--border)" />
  <text x="289" y="215" font-size="13" text-anchor="middle" fill="var(--text)">model</text>
  <line x1="218" y1="190" x2="254" y2="206" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ok-47-paralel)" />
  <line x1="218" y1="232" x2="254" y2="216" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ok-47-paralel)" />
  <line x1="324" y1="211" x2="334" y2="211" stroke="var(--text-muted)" marker-end="url(#ok-47-sira)" />
  <rect x="336" y="196" width="56" height="30" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="364" y="215" font-size="13" text-anchor="middle" fill="var(--text)">cevap</text>

  <line x1="20" y1="262" x2="392" y2="262" stroke="var(--text-faint)" marker-end="url(#ok-47-sira)" />
  <text x="20" y="282" font-size="13" fill="var(--text-muted)">zaman → bağımsız aramalar aynı anda; bekleyen yalnızca bağımlı çağrı</text>

  <line x1="478" y1="14" x2="478" y2="290" stroke="var(--border)" />

  <text x="492" y="26" font-size="13" font-weight="bold" fill="var(--text)">ölçülen (aynı model, aynı araç)</text>
  <text x="492" y="58" font-size="13" fill="var(--text)">2 bağımsız arama:</text>
  <text x="492" y="78" font-size="13" fill="var(--accent)">7,12 → 3,95 sn, 1,80 kat</text>
  <text x="492" y="98" font-size="13" fill="var(--text-muted)">girdi 2.900 → 1.300 token</text>
  <text x="492" y="130" font-size="13" fill="var(--text)">8 bağımsız arama:</text>
  <text x="492" y="150" font-size="13" fill="var(--accent)">20,47 → 5,47 sn, 3,74 kat</text>
  <text x="492" y="170" font-size="13" fill="var(--text-muted)">girdi 20.000 → 2.800 token</text>
  <text x="492" y="202" font-size="13" fill="var(--text)">doğruluk:</text>
  <text x="492" y="222" font-size="13" fill="var(--text-muted)">62,47 → 62,00 ve</text>
  <text x="492" y="242" font-size="13" fill="var(--text-muted)">72,47 → 77,13</text>

  <text x="20" y="312" font-size="13" fill="var(--text-muted)">Kutu uzunlukları şematiktir; ölçülmüş olan sağdaki sayılardır (Kim ve ark., ICML 2024).</text>
</svg>
