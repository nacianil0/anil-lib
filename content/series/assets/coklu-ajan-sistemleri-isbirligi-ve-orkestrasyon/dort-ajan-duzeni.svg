<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Dört çoklu ajan düzeni: ikili rol oyunu, standart işlem hattı ve mesaj havuzu, orkestra şefi ile işçiler, tartışma halkası; altında her düzenin yaslandığı gerekçe.">
  <defs>
    <marker id="ok-53-akis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)" />
    </marker>
    <marker id="ok-53-cift" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="16" y="30" font-size="13" font-weight="bold" fill="var(--text)">ikili rol oyunu</text>
  <rect x="24" y="60" width="76" height="30" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="62" y="79" font-size="13" text-anchor="middle" fill="var(--text)">kullanıcı</text>
  <rect x="24" y="150" width="76" height="30" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="62" y="169" font-size="13" text-anchor="middle" fill="var(--text)">asistan</text>
  <line x1="50" y1="92" x2="50" y2="148" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#ok-53-cift)" />
  <line x1="74" y1="148" x2="74" y2="92" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#ok-53-cift)" />
  <text x="112" y="112" font-size="13" fill="var(--text-muted)">talimat</text>
  <text x="112" y="132" font-size="13" fill="var(--text-muted)">çözüm</text>
  <text x="16" y="216" font-size="13" fill="var(--text-muted)">bitiş sözcüğü;</text>
  <text x="16" y="234" font-size="13" fill="var(--text-muted)">en çok 40 mesaj</text>
  <text x="16" y="268" font-size="13" fill="var(--accent)">pencere ayrımı</text>

  <line x1="176" y1="16" x2="176" y2="290" stroke="var(--border)" stroke-dasharray="3 3" />

  <text x="188" y="30" font-size="13" font-weight="bold" fill="var(--text)">standart işlem hattı</text>
