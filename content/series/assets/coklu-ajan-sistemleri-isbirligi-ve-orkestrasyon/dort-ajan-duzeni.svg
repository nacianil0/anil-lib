  <text x="364" y="252" font-size="13" fill="var(--text-muted)">birbirini görmez</text>
  <text x="364" y="286" font-size="13" fill="var(--accent)">pencere ayrımı</text>

  <line x1="548" y1="16" x2="548" y2="290" stroke="var(--border)" stroke-dasharray="3 3" />

  <text x="560" y="30" font-size="13" font-weight="bold" fill="var(--text)">tartışma halkası</text>
  <rect x="606" y="56" width="54" height="28" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="633" y="74" font-size="13" text-anchor="middle" fill="var(--text)">ajan</text>
  <rect x="562" y="150" width="54" height="28" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="589" y="168" font-size="13" text-anchor="middle" fill="var(--text)">ajan</text>
  <rect x="650" y="150" width="54" height="28" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="677" y="168" font-size="13" text-anchor="middle" fill="var(--text)">ajan</text>
  <line x1="620" y1="86" x2="598" y2="148" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#ok-53-cift)" marker-start="url(#ok-53-cift)" />
  <line x1="646" y1="86" x2="668" y2="148" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#ok-53-cift)" marker-start="url(#ok-53-cift)" />
  <line x1="618" y1="164" x2="648" y2="164" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#ok-53-cift)" marker-start="url(#ok-53-cift)" />
  <text x="560" y="216" font-size="13" fill="var(--text-muted)">herkes herkesin</text>
  <text x="560" y="234" font-size="13" fill="var(--text-muted)">cevabını görür;</text>
  <text x="560" y="252" font-size="13" fill="var(--text-muted)">tur sayısı: 2–4</text>
  <text x="560" y="286" font-size="13" fill="var(--accent)">bağımsız örnek (?)</text>

  <line x1="16" y1="306" x2="704" y2="306" stroke="var(--border)" />
  <text x="16" y="330" font-size="13" fill="var(--text-muted)">Her düzenin altında yaslandığı gerekçe; soru işareti: oylamaya karşı ölçülmeden okunamaz.</text>
