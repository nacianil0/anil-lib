  <line x1="440" y1="92" x2="447" y2="148" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#ok-53-cift)" marker-start="url(#ok-53-cift)" />
  <line x1="454" y1="92" x2="504" y2="148" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#ok-53-cift)" marker-start="url(#ok-53-cift)" />
  <text x="364" y="216" font-size="13" fill="var(--text-muted)">şef böler, dağıtır,</text>
