  <text x="222" y="77" font-size="13" text-anchor="middle" fill="var(--text)">ürün</text>
  <rect x="190" y="104" width="64" height="26" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="222" y="121" font-size="13" text-anchor="middle" fill="var(--text)">mimar</text>
  <rect x="190" y="148" width="64" height="26" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="222" y="165" font-size="13" text-anchor="middle" fill="var(--text)">mühendis</text>
  <rect x="190" y="192" width="64" height="26" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="222" y="209" font-size="13" text-anchor="middle" fill="var(--text)">test</text>
  <line x1="222" y1="86" x2="222" y2="102" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-53-akis)" />
  <line x1="222" y1="130" x2="222" y2="146" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-53-akis)" />
  <line x1="222" y1="174" x2="222" y2="190" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-53-akis)" />
