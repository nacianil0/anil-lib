  <line x1="254" y1="73" x2="270" y2="73" stroke="var(--cool)" stroke-width="1.2" marker-end="url(#ok-53-akis)" />
  <line x1="254" y1="117" x2="270" y2="117" stroke="var(--cool)" stroke-width="1.2" marker-end="url(#ok-53-akis)" />
  <line x1="254" y1="161" x2="270" y2="161" stroke="var(--cool)" stroke-width="1.2" marker-end="url(#ok-53-akis)" />
  <line x1="254" y1="205" x2="270" y2="205" stroke="var(--cool)" stroke-width="1.2" marker-end="url(#ok-53-akis)" />
  <text x="188" y="244" font-size="13" fill="var(--text-muted)">belge yazar,</text>
