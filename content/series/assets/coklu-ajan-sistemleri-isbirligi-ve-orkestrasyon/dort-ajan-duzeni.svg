  <rect x="366" y="150" width="50" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="391" y="168" font-size="13" text-anchor="middle" fill="var(--text)">işçi</text>
  <rect x="426" y="150" width="50" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="451" y="168" font-size="13" text-anchor="middle" fill="var(--text)">işçi</text>
  <rect x="486" y="150" width="50" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="511" y="168" font-size="13" text-anchor="middle" fill="var(--text)">işçi</text>
