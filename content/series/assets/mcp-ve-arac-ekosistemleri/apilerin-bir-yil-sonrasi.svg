<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="ToolBench'teki API'lerin bir yıl sonraki durumu: yüzde 44,4 çalışıyor; kalanı ayrıştırma hatası, bağlantı sorunu, yetki, parametre değişikliği ya da kaybolma.">
  <text x="20" y="48" font-size="13" fill="var(--text)">başarıyla çalışıyor</text>
  <rect x="250" y="35" width="266.4" height="16" fill="var(--accent)" />
  <text x="640" y="48" font-size="13" font-weight="bold" fill="var(--text)">%44,4</text>

  <text x="20" y="80" font-size="13" fill="var(--text)">belgeden ayrıştırma hatası</text>
  <rect x="250" y="67" width="155.4" height="16" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" stroke-dasharray="3 2" />
  <text x="640" y="80" font-size="13" fill="var(--text-muted)">%25,9</text>

  <text x="20" y="112" font-size="13" fill="var(--text)">bağlanılamıyor</text>
  <rect x="250" y="99" width="88.8" height="16" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="0.8" />
  <text x="640" y="112" font-size="13" fill="var(--text-muted)">%14,8</text>

  <text x="20" y="144" font-size="13" fill="var(--text)">yetki gerekiyor</text>
  <rect x="250" y="131" width="38.4" height="16" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="0.8" />
  <text x="640" y="144" font-size="13" fill="var(--text-muted)">%6,4</text>

  <text x="20" y="176" font-size="13" fill="var(--text)">parametreleri değişmiş</text>
  <rect x="250" y="163" width="21.6" height="16" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="0.8" />
  <text x="640" y="176" font-size="13" fill="var(--text-muted)">%3,6</text>

  <text x="20" y="208" font-size="13" fill="var(--text)">bulunamıyor</text>
  <rect x="250" y="195" width="21" height="16" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="0.8" />
  <text x="640" y="208" font-size="13" fill="var(--text-muted)">%3,5</text>

  <text x="20" y="240" font-size="13" fill="var(--text)">diğer</text>
  <rect x="250" y="227" width="8.4" height="16" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="0.8" />
  <text x="640" y="240" font-size="13" fill="var(--text-muted)">%1,4</text>

  <text x="20" y="272" font-size="13" fill="var(--text-muted)">ToolBench API'lerinin bir yıl sonraki durumu; çubuklar aynı ölçekte (6 birim = yüzde 1).</text>
  <text x="20" y="290" font-size="13" fill="var(--text-muted)">Kesikli çubuk: yerel belgelendirmeden kaynaklanan, düzeltilebilir ayrıştırma hataları.</text>
</svg>
