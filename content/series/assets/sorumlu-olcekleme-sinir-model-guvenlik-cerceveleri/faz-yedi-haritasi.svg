<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" role="img" aria-label="On kutuluk zincir, iki satır hâlinde. Üst satır soldan sağa: 61 hizalama, vekil kırılır ve hedef yanlış genellenir; 62 ret, öğrenilir, sığdır, on örnekle silinir; 63 saldırı, altı aile ve üç erişim düzeyi, her savunmanın bedeli var; 64 denetim, ilkeler yazılır ve denetim ölçeklenir; 65 güven, ölçülür, tercih eğitimi bozar, sıcaklık düzeltir. Alt satır soldan sağa: 66 karakter, hoşa gideni ölçen sinyal onu üretir; 67 aldatma, arka kapı eğitimden geçer ve sınavı tanıyan sınav değişir; 68 kötüye kullanım, marjinal risk tabanla sorulur; 69 yönetişim, eşik, yükümlülük, muafiyet ve denetim erişimi; 70 çerçeve, eşik, koşullu taahhüt ve savunma belgesi. Altta zincirin iki ucu ve açık kalan üç halka yazılıdır.">
  <rect x="20" y="20" width="128" height="86" fill="var(--surface-muted)" />
  <text x="28" y="40" font-size="13" font-weight="bold" fill="var(--text)">61 hizalama</text>
  <text x="28" y="60" font-size="13" fill="var(--text)">vekil kırılır,</text>
  <text x="28" y="78" font-size="13" fill="var(--text)">hedef yanlış</text>
  <text x="28" y="96" font-size="13" fill="var(--text)">genellenir</text>

  <rect x="156" y="20" width="128" height="86" fill="var(--surface-muted)" />
  <text x="164" y="40" font-size="13" font-weight="bold" fill="var(--text)">62 ret</text>
  <text x="164" y="60" font-size="13" fill="var(--text)">öğrenilir, sığ</text>
  <text x="164" y="78" font-size="13" fill="var(--text)">on örnekle</text>
  <text x="164" y="96" font-size="13" fill="var(--text)">silinir</text>

  <rect x="292" y="20" width="128" height="86" fill="var(--surface-muted)" />
  <text x="300" y="40" font-size="13" font-weight="bold" fill="var(--text)">63 saldırı</text>
  <text x="300" y="60" font-size="13" fill="var(--text)">altı aile, üç</text>
  <text x="300" y="78" font-size="13" fill="var(--text)">erişim; her</text>
  <text x="300" y="96" font-size="13" fill="var(--text)">savunma bedelli</text>

  <rect x="428" y="20" width="128" height="86" fill="var(--surface-muted)" />
  <text x="436" y="40" font-size="13" font-weight="bold" fill="var(--text)">64 denetim</text>
  <text x="436" y="60" font-size="13" fill="var(--text)">ilkeler yazılır,</text>
  <text x="436" y="78" font-size="13" fill="var(--text)">denetim</text>
  <text x="436" y="96" font-size="13" fill="var(--text)">ölçeklenir</text>

  <rect x="564" y="20" width="128" height="86" fill="var(--surface-muted)" />
  <text x="572" y="40" font-size="13" font-weight="bold" fill="var(--text)">65 güven</text>
  <text x="572" y="60" font-size="13" fill="var(--text)">ölçülür; tercih</text>
  <text x="572" y="78" font-size="13" fill="var(--text)">bozar, sıcaklık</text>
  <text x="572" y="96" font-size="13" fill="var(--text)">düzeltir</text>

  <line x1="628" y1="106" x2="628" y2="124" stroke="var(--text-muted)" />
  <line x1="628" y1="124" x2="84" y2="124" stroke="var(--text-muted)" />
  <line x1="84" y1="124" x2="84" y2="142" stroke="var(--text-muted)" />

  <rect x="20" y="142" width="128" height="86" fill="var(--surface-muted)" />
  <text x="28" y="162" font-size="13" font-weight="bold" fill="var(--text)">66 karakter</text>
  <text x="28" y="182" font-size="13" fill="var(--text)">hoşa gideni</text>
  <text x="28" y="200" font-size="13" fill="var(--text)">ölçen sinyal</text>
  <text x="28" y="218" font-size="13" fill="var(--text)">onu üretir</text>

  <rect x="156" y="142" width="128" height="86" fill="var(--accent-soft)" />
  <text x="164" y="162" font-size="13" font-weight="bold" fill="var(--text)">67 aldatma</text>
  <text x="164" y="182" font-size="13" fill="var(--text)">arka kapı geçer;</text>
  <text x="164" y="200" font-size="13" fill="var(--text)">sınavı tanıyan</text>
  <text x="164" y="218" font-size="13" fill="var(--text)">sınavı değiştirir</text>

  <rect x="292" y="142" width="128" height="86" fill="var(--accent-soft)" />
  <text x="300" y="162" font-size="13" font-weight="bold" fill="var(--text)">68 kötüye</text>
  <text x="300" y="180" font-size="13" font-weight="bold" fill="var(--text)">kullanım</text>
  <text x="300" y="200" font-size="13" fill="var(--text)">marjinal risk</text>
  <text x="300" y="218" font-size="13" fill="var(--text)">tabanla sorulur</text>

  <rect x="428" y="142" width="128" height="86" fill="var(--accent-soft)" />
  <text x="436" y="162" font-size="13" font-weight="bold" fill="var(--text)">69 yönetişim</text>
  <text x="436" y="182" font-size="13" fill="var(--text)">eşik, yükümlülük,</text>
  <text x="436" y="200" font-size="13" fill="var(--text)">muafiyet;</text>
  <text x="436" y="218" font-size="13" fill="var(--text)">denetim erişimi</text>

  <rect x="564" y="142" width="128" height="86" fill="var(--accent-soft)" />
  <text x="572" y="162" font-size="13" font-weight="bold" fill="var(--text)">70 çerçeve</text>
  <text x="572" y="182" font-size="13" fill="var(--text)">eşik, koşullu</text>
  <text x="572" y="200" font-size="13" fill="var(--text)">taahhüt ve</text>
  <text x="572" y="218" font-size="13" fill="var(--text)">savunma belgesi</text>

  <line x1="20" y1="250" x2="700" y2="250" stroke="var(--border)" />
  <text x="20" y="272" font-size="13" fill="var(--text)">Zincirin iki ucu: soru hizalama sorunuyla açıldı;</text>
  <text x="20" y="290" font-size="13" fill="var(--text)">cevabın bugünkü biçimi ölçüm + önlem + belge.</text>
  <text x="20" y="316" font-size="13" font-weight="bold" fill="var(--text)">Açık kalan üç halka</text>
  <text x="20" y="336" font-size="13" fill="var(--text)">· eşiği geliştirici koyar</text>
  <text x="20" y="354" font-size="13" fill="var(--text)">· ölçüm, sınavı tanıyan modele karşı yapılır</text>
  <text x="20" y="372" font-size="13" fill="var(--text)">· doğrulama büyük ölçüde kurum içidir</text>

  <line x1="20" y1="384" x2="700" y2="384" stroke="var(--border)" />
  <text x="20" y="400" font-size="13" fill="var(--text-muted)">Vurgulu dört kutu bu kohortun makaleleri.</text>
</svg>
