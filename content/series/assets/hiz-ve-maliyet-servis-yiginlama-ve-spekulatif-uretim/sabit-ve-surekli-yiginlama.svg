<svg viewBox="0 0 720 344" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Aynı dört istek, iki çizelgeleme düzeni</text>

  <text x="16" y="52" font-size="13" text-anchor="start" fill="var(--text)">sabit yığın — yığın bitene kadar ne çıkış ne giriş var</text>

  <text x="16" y="74" font-size="13" text-anchor="start" fill="var(--text-muted)">istek 1</text>
