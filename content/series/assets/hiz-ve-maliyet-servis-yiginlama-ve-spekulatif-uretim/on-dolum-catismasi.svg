<svg viewBox="0 0 720 336" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Ön dolum ile üretimin çatışmasına üç cevap</text>

  <text x="16" y="52" font-size="13" text-anchor="start" fill="var(--text)">tek yığın: ön dolum devam eden üretimi durdurur</text>
  <rect x="16" y="62" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="42" y="62" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="68" y="62" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="94" y="62" width="240" height="18" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="214" y="76" font-size="13" text-anchor="middle" fill="var(--accent)">ön dolum</text>
  <rect x="338" y="62" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="364" y="62" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="390" y="62" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="416" y="62" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="16" y="102" font-size="13" text-anchor="start" fill="var(--text-muted)">bu aralıkta hiçbir istek token üretmez — akışta duraklama</text>

  <line x1="16" y1="120" x2="704" y2="120" stroke="var(--border)" stroke-width="1"/>

  <text x="16" y="144" font-size="13" text-anchor="start" fill="var(--text)">parçalı ön dolum: istem parçalanır, üretim hiç durmaz</text>
  <rect x="16" y="154" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="42" y="154" width="60" height="18" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <rect x="106" y="154" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="132" y="154" width="60" height="18" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <rect x="196" y="154" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="222" y="154" width="60" height="18" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <rect x="286" y="154" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="312" y="154" width="60" height="18" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <rect x="376" y="154" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="402" y="154" width="22" height="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="16" y="194" font-size="13" text-anchor="start" fill="var(--text-muted)">her yineleme benzer büyüklükte; ön dolum parçaları araya girer</text>

  <line x1="16" y1="212" x2="704" y2="212" stroke="var(--border)" stroke-width="1"/>

  <text x="16" y="236" font-size="13" text-anchor="start" fill="var(--text)">ayrıştırma: iki aşama ayrı kartlarda</text>

  <rect x="120" y="248" width="200" height="46" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="220" y="276" font-size="13" text-anchor="middle" fill="var(--accent)">yalnızca ön dolum</text>
  <line x1="324" y1="271" x2="396" y2="271" stroke="var(--text-muted)" stroke-width="1"/>
  <rect x="400" y="248" width="200" height="46" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="500" y="276" font-size="13" text-anchor="middle" fill="var(--cool)">yalnızca üretim</text>

  <text x="360" y="316" font-size="13" text-anchor="middle" fill="var(--text-muted)">anahtar-değer önbelleği aktarılır; her aşama kendi planıyla ayarlanır</text>
</svg>
