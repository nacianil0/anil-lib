<svg viewBox="0 0 720 334" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Aynı bit bütçesinde hassasiyet ile model boyunun değiş tokuşu</text>
  <text x="16" y="52" font-size="13" text-anchor="start" fill="var(--text-muted)">↑ ölçülen ortalama başarı</text>

  <line x1="80" y1="60" x2="80" y2="252" stroke="var(--border)" stroke-width="1"/>
  <line x1="80" y1="252" x2="560" y2="252" stroke="var(--border)" stroke-width="1"/>

  <polyline points="100,238 175,218 250,202 325,188 400,176 540,158" fill="none" stroke="var(--text-faint)" stroke-width="2"/>
  <polyline points="180,225 250,202 320,180 390,158 460,138 540,120" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <polyline points="145,222 215,196 285,170 355,146 425,124 540,100" fill="none" stroke="var(--cool)" stroke-width="2"/>
  <polyline points="110,220 180,190 250,162 320,136 390,114 540,84" fill="none" stroke="var(--accent)" stroke-width="2"/>

  <text x="548" y="163" font-size="13" text-anchor="start" fill="var(--text-faint)">3 bit</text>
  <text x="548" y="125" font-size="13" text-anchor="start" fill="var(--text-muted)">16 bit</text>
  <text x="548" y="105" font-size="13" text-anchor="start" fill="var(--cool)">8 bit</text>
  <text x="548" y="89" font-size="13" text-anchor="start" fill="var(--accent)">4 bit</text>

  <line x1="390" y1="104" x2="390" y2="252" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="390" cy="114" r="5" fill="var(--accent)"/>
  <circle cx="390" cy="135" r="5" fill="var(--cool)"/>
  <text x="390" y="98" font-size="13" text-anchor="middle" fill="var(--text)">aynı toplam bit</text>

  <text x="320" y="272" font-size="13" text-anchor="start" fill="var(--text-muted)">toplam model biti →</text>

  <text x="16" y="296" font-size="13" text-anchor="start" fill="var(--text-muted)">4 bitte saklanan iki kat büyük model, 8 bitteki küçük modelin üstündedir</text>
  <text x="16" y="318" font-size="13" text-anchor="start" fill="var(--text-faint)">3 bitte ilişki tersine döner</text>
