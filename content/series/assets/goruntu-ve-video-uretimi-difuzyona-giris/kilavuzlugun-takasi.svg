<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Üç satırlı tablo; satırlar kılavuzluk katsayısı yok, 1,25 ve 1,50. Sütunlar FID, Inception puanı, kesinlik ve kapsama. Değerler sırasıyla: kılavuzluksuz 9,62 ve 121,50 ve 0,67 ve 0,67; katsayı 1,25 ile 3,22 ve 201,77 ve 0,76 ve 0,62; katsayı 1,50 ile 2,27 ve 278,24 ve 0,83 ve 0,57. Tablonun altında üç kayıt: üç satır aynı eğitilmiş modeldir, ölçüm ImageNet 256 çarpı 256 üzerindedir; kesinlik sadakati, kapsama çeşitliliği ölçer ve ikisi ters yönde hareket eder; FID ikisini birden içerdiği için ortada bir en küçük değeri vardır. En altta ikinci bir çalışmadan, sınıflandırıcı kılavuzluğuyla gelen uç örnek: ölçek ona çıkarıldığında kesinlik 0,88'e yükselirken kapsama 0,32'ye iniyor ve FID 4,59'dan 9,11'e geri kötüleşiyor.">
  <text x="30" y="24" font-size="13" font-weight="bold" fill="var(--text)">kılavuzluk</text>
  <text x="200" y="24" font-size="13" font-weight="bold" fill="var(--text)">FID</text>
  <text x="310" y="24" font-size="13" font-weight="bold" fill="var(--text)">Inception</text>
  <text x="450" y="24" font-size="13" font-weight="bold" fill="var(--text)">kesinlik</text>
  <text x="580" y="24" font-size="13" font-weight="bold" fill="var(--text)">kapsama</text>
  <text x="200" y="42" font-size="13" fill="var(--text-muted)">düşük iyi</text>
  <text x="310" y="42" font-size="13" fill="var(--text-muted)">yüksek iyi</text>
  <text x="450" y="42" font-size="13" fill="var(--text-muted)">sadakat</text>
  <text x="580" y="42" font-size="13" fill="var(--text-muted)">çeşitlilik</text>
  <line x1="20" y1="52" x2="700" y2="52" stroke="var(--border)" />

  <rect x="20" y="60" width="680" height="30" fill="var(--surface-muted)" />
  <text x="30" y="80" font-size="13" fill="var(--text)">yok</text>
  <text x="200" y="80" font-size="13" fill="var(--text)">9,62</text>
  <text x="310" y="80" font-size="13" fill="var(--text)">121,50</text>
  <text x="450" y="80" font-size="13" fill="var(--text)">0,67</text>
  <text x="580" y="80" font-size="13" fill="var(--text)">0,67</text>

  <text x="30" y="112" font-size="13" fill="var(--text)">katsayı 1,25</text>
  <text x="200" y="112" font-size="13" fill="var(--text)">3,22</text>
  <text x="310" y="112" font-size="13" fill="var(--text)">201,77</text>
  <text x="450" y="112" font-size="13" fill="var(--accent)">0,76</text>
  <text x="580" y="112" font-size="13" fill="var(--cool)">0,62</text>

  <rect x="20" y="124" width="680" height="30" fill="var(--surface-muted)" />
  <text x="30" y="144" font-size="13" fill="var(--text)">katsayı 1,50</text>
  <text x="200" y="144" font-size="13" fill="var(--text)">2,27</text>
  <text x="310" y="144" font-size="13" fill="var(--text)">278,24</text>
  <text x="450" y="144" font-size="13" fill="var(--accent)">0,83</text>
  <text x="580" y="144" font-size="13" fill="var(--cool)">0,57</text>

  <line x1="20" y1="164" x2="700" y2="164" stroke="var(--border)" />
  <text x="20" y="188" font-size="13" fill="var(--text-muted)">Üç satır aynı eğitilmiş modeldir; ölçüm ImageNet 256×256 üzerinde.</text>
  <text x="20" y="206" font-size="13" fill="var(--text-muted)">Kesinlik yukarı giderken kapsama aşağı gidiyor.</text>
  <text x="20" y="224" font-size="13" fill="var(--text-muted)">FID ikisini birden içerdiği için ortada bir en küçük değeri var.</text>

  <line x1="20" y1="240" x2="700" y2="240" stroke="var(--border)" />
  <text x="20" y="264" font-size="13" fill="var(--accent)">Uç örnek (başka çalışma, sınıflandırıcı kılavuzluğu): ölçek ona çıkınca kesinlik</text>
  <text x="20" y="282" font-size="13" fill="var(--accent)">0,88'e yükseliyor, kapsama 0,32'ye iniyor, FID 4,59'dan 9,11'e dönüyor.</text>
</svg>
