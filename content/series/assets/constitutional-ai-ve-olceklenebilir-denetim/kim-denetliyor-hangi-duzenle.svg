<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="İki panelli tablo. Üst panel, sandviçleme: satırlar bilgi sınavı ve uzun okuma soruları; sütunlar tek başına katılımcı, tek başına model, katılımcı artı model, ağırlıklı oy, uzman tahmini. Bilgi sınavı: 57,2, 65,6, 75,4, 78,0, 90. Uzun okuma: 48,6, 66,9, 76,8, 86,0, 93,5. Alt panel, tartışma ile danışmanlık: satırlar insan hakem ve insan tartışmacı, insan hakem ve yapay tartışmacı, dil modeli hakem, insan hakem; sütunlar yalnız hakem, danışmanlık, tartışma. Michael ve arkadaşları insan tartışmacı: tire, 74, 84; yapay tartışmacı: tire, 80, 78. Khan ve arkadaşları dil modeli hakem: 48, tire, 76; insan hakem: 60, tire, 88. Altta bütün değerlerin yüzde doğruluk olduğu, sandviçlemede modelin 52 milyarlık bir asistan olduğu, tartışmalarda hakemin metni görmediği ve değerlerin Bowman, Michael ve Khan ve arkadaşlarının çalışmalarından geldiği yazılıdır.">
  <text x="20" y="24" font-size="13" font-weight="bold" fill="var(--accent)">sandviçleme: sıradan katılımcı, model, uzman (Bowman ve ark.)</text>
  <text x="20" y="50" font-size="13" font-weight="bold" fill="var(--text)">görev</text>
  <text x="330" y="50" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">katılımcı</text>
  <text x="402" y="50" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">model</text>
  <text x="530" y="50" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">katılımcı + model</text>
  <text x="615" y="50" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">ağırlıklı oy</text>
  <text x="700" y="50" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">uzman</text>
  <line x1="20" y1="60" x2="700" y2="60" stroke="var(--border)" />

  <text x="20" y="84" font-size="13" fill="var(--text)">bilgi sınavı (16'daki)</text>
  <text x="330" y="84" font-size="13" text-anchor="end" fill="var(--text-muted)">57,2</text>
  <text x="402" y="84" font-size="13" text-anchor="end" fill="var(--text-muted)">65,6</text>
  <text x="530" y="84" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">75,4</text>
  <text x="615" y="84" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">78,0</text>
  <text x="700" y="84" font-size="13" text-anchor="end" fill="var(--text-muted)">90</text>

  <text x="20" y="112" font-size="13" fill="var(--text)">uzun okuma soruları</text>
  <text x="330" y="112" font-size="13" text-anchor="end" fill="var(--text-muted)">48,6</text>
  <text x="402" y="112" font-size="13" text-anchor="end" fill="var(--text-muted)">66,9</text>
  <text x="530" y="112" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">76,8</text>
  <text x="615" y="112" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">86,0</text>
  <text x="700" y="112" font-size="13" text-anchor="end" fill="var(--text-muted)">93,5</text>

  <line x1="20" y1="134" x2="700" y2="134" stroke="var(--border)" />

  <text x="20" y="160" font-size="13" font-weight="bold" fill="var(--cool)">tartışma ile danışmanlık: hakem metni görmez</text>
  <text x="20" y="186" font-size="13" font-weight="bold" fill="var(--text)">hakem ve tartışmacı</text>
  <text x="450" y="186" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">yalnız hakem</text>
  <text x="575" y="186" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">danışmanlık</text>
  <text x="700" y="186" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">tartışma</text>
  <line x1="20" y1="196" x2="700" y2="196" stroke="var(--border)" />

  <text x="20" y="220" font-size="13" fill="var(--text)">insan hakem, insan tartışmacı (Michael ve ark.)</text>
  <text x="450" y="220" font-size="13" text-anchor="end" fill="var(--text-faint)">—</text>
  <text x="575" y="220" font-size="13" text-anchor="end" fill="var(--text-muted)">74</text>
  <text x="700" y="220" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">84</text>

  <text x="20" y="248" font-size="13" fill="var(--text)">insan hakem, yapay tartışmacı (Michael ve ark.)</text>
  <text x="450" y="248" font-size="13" text-anchor="end" fill="var(--text-faint)">—</text>
  <text x="575" y="248" font-size="13" text-anchor="end" fill="var(--text-muted)">80</text>
  <text x="700" y="248" font-size="13" text-anchor="end" fill="var(--text)">78</text>

  <text x="20" y="276" font-size="13" fill="var(--text)">dil modeli hakem, yapay tartışmacı (Khan ve ark.)</text>
  <text x="450" y="276" font-size="13" text-anchor="end" fill="var(--text-muted)">48</text>
  <text x="575" y="276" font-size="13" text-anchor="end" fill="var(--text-faint)">—</text>
  <text x="700" y="276" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">76</text>

  <text x="20" y="304" font-size="13" fill="var(--text)">insan hakem, yapay tartışmacı (Khan ve ark.)</text>
  <text x="450" y="304" font-size="13" text-anchor="end" fill="var(--text-muted)">60</text>
  <text x="575" y="304" font-size="13" text-anchor="end" fill="var(--text-faint)">—</text>
  <text x="700" y="304" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">88</text>

  <line x1="20" y1="322" x2="700" y2="322" stroke="var(--border)" />
  <text x="20" y="346" font-size="13" fill="var(--text-muted)">Bütün değerler yüzde doğruluk. Sandviçlemede model 52 milyarlık bir asistan; katılımcı onunla</text>
  <text x="20" y="364" font-size="13" fill="var(--text-muted)">sohbet ederek cevaplar. Tartışmalarda hakem hikâyeyi görmez, tartışmacılar alıntı yapar; Khan'da</text>
  <text x="20" y="382" font-size="13" fill="var(--text-muted)">danışmanlık ayrıca ölçüldü ve tartışmanın altında kaldı. Değerler üç çalışmanın tablolarından.</text>
</svg>
