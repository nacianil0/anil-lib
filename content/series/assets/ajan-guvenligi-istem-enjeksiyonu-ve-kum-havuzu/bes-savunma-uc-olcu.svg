<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Beş savunma grubu, her grupta üç yatay çubuk: saldırısız yarar, saldırı altında yarar, hedefli saldırı başarısı. Savunma yok 69,0, 50,0, 57,7; ayraç 72,7, 55,6, 41,7; enjeksiyon dedektörü 41,5, 21,1, 8,0; istemi tekrarlama 85,5, 67,3, 27,8; araç süzgeci 73,1, 56,3, 6,8.">
  <rect x="220" y="14" width="12" height="12" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="238" y="24" font-size="13" fill="var(--text-muted)">saldırısız yarar</text>
  <rect x="340" y="14" width="12" height="12" fill="var(--cool)" />
  <text x="358" y="24" font-size="13" fill="var(--text-muted)">saldırı altında yarar</text>
  <rect x="490" y="14" width="12" height="12" fill="var(--accent)" />
  <text x="508" y="24" font-size="13" fill="var(--text-muted)">hedefli saldırı başarısı</text>

  <text x="20" y="52" font-size="13" font-weight="bold" fill="var(--text)">savunma yok</text>
