  <text x="600" y="276" font-size="13" text-anchor="end" fill="var(--text-muted)">73,1</text>
  <rect x="250" y="280" width="168.9" height="10" fill="var(--cool)" />
  <text x="600" y="290" font-size="13" text-anchor="end" fill="var(--text-muted)">56,3</text>
  <rect x="250" y="294" width="20.4" height="10" fill="var(--accent)" />
  <text x="600" y="304" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">6,8</text>

  <line x1="20" y1="330" x2="700" y2="330" stroke="var(--border)" />
  <text x="20" y="354" font-size="13" fill="var(--text-muted)">Aynı model (GPT-4o); 97 görev ve 629 saldırı durumu; 100 = 300 birim.</text>
  <text x="20" y="372" font-size="13" fill="var(--text-muted)">Yararda yüksek iyidir; hedefli saldırı başarısında düşük iyidir.</text>
  <text x="20" y="390" font-size="13" fill="var(--text-muted)">Dedektör saldırıyı en çok düşüren ikinci savunma, ama yararı da yarıya indiriyor;</text>
  <text x="20" y="408" font-size="13" fill="var(--text-muted)">araç süzgeci hem saldırıyı en çok düşürüyor hem yararı koruyor.</text>
  <text x="20" y="432" font-size="13" fill="var(--text-muted)">Değerler Debenedetti ve arkadaşlarının tablosundan.</text>
</svg>
