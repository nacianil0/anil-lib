  <text x="600" y="52" font-size="13" text-anchor="end" fill="var(--text-muted)">69,0</text>
  <rect x="250" y="56" width="150" height="10" fill="var(--cool)" />
  <text x="600" y="66" font-size="13" text-anchor="end" fill="var(--text-muted)">50,0</text>
  <rect x="250" y="70" width="173.1" height="10" fill="var(--accent)" />
  <text x="600" y="80" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">57,7</text>

  <text x="20" y="108" font-size="13" font-weight="bold" fill="var(--text)">ayraçla işaretleme</text>
  <rect x="250" y="98" width="218.1" height="10" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="600" y="108" font-size="13" text-anchor="end" fill="var(--text-muted)">72,7</text>
  <rect x="250" y="112" width="166.8" height="10" fill="var(--cool)" />
  <text x="600" y="122" font-size="13" text-anchor="end" fill="var(--text-muted)">55,6</text>
  <rect x="250" y="126" width="125.1" height="10" fill="var(--accent)" />
  <text x="600" y="136" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">41,7</text>

  <text x="20" y="164" font-size="13" font-weight="bold" fill="var(--text)">enjeksiyon dedektörü</text>
  <rect x="250" y="154" width="124.5" height="10" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="600" y="164" font-size="13" text-anchor="end" fill="var(--text-muted)">41,5</text>
  <rect x="250" y="168" width="63.3" height="10" fill="var(--cool)" />
  <text x="600" y="178" font-size="13" text-anchor="end" fill="var(--text-muted)">21,1</text>
  <rect x="250" y="182" width="24" height="10" fill="var(--accent)" />
  <text x="600" y="192" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">8,0</text>

  <text x="20" y="220" font-size="13" font-weight="bold" fill="var(--text)">istemi tekrarlama</text>
  <rect x="250" y="210" width="256.5" height="10" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="600" y="220" font-size="13" text-anchor="end" fill="var(--text-muted)">85,5</text>
  <rect x="250" y="224" width="201.9" height="10" fill="var(--cool)" />
  <text x="600" y="234" font-size="13" text-anchor="end" fill="var(--text-muted)">67,3</text>
  <rect x="250" y="238" width="83.4" height="10" fill="var(--accent)" />
  <text x="600" y="248" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">27,8</text>

  <text x="20" y="276" font-size="13" font-weight="bold" fill="var(--text)">araç süzgeci</text>
