<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Modelin hiç görmediği 910 soruda doğruluk</text>

  <line x1="260" y1="52" x2="260" y2="266" stroke="var(--border)" stroke-width="1"/>

  <text x="250" y="84" font-size="13" text-anchor="end" fill="var(--text-muted)">taban model</text>
  <rect x="260" y="68" width="192" height="24" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="462" y="86" font-size="13" text-anchor="start" fill="var(--text-muted)">0,481</text>

  <text x="250" y="134" font-size="13" text-anchor="end" fill="var(--text-muted)">ince ayarla ağırlığa yazmak</text>
  <rect x="260" y="118" width="202" height="24" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="472" y="136" font-size="13" text-anchor="start" fill="var(--accent)">0,504</text>

  <text x="250" y="184" font-size="13" text-anchor="end" fill="var(--text-muted)">on yeniden yazımla ince ayar</text>
  <rect x="260" y="168" width="235" height="24" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="505" y="186" font-size="13" text-anchor="start" fill="var(--accent)">0,588</text>

  <text x="250" y="234" font-size="13" text-anchor="end" fill="var(--text-muted)">üretim anında önüne koymak</text>
  <rect x="260" y="218" width="350" height="24" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="620" y="236" font-size="13" text-anchor="start" fill="var(--cool)">0,875</text>

  <text x="260" y="286" font-size="13" text-anchor="start" fill="var(--text-faint)">0,0</text>
  <text x="660" y="286" font-size="13" text-anchor="end" fill="var(--text-faint)">1,0</text>

  <text x="16" y="312" font-size="13" text-anchor="start" fill="var(--text-faint)">aynı olgu, iki ayrı kanal: ağırlığa yazmak zor taşır, önüne koymak kolay</text>
</svg>
