<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" role="img" aria-label="Üç sütunlu akış şeması; her sütun görüntüyü dil modeline bağlamanın bir yolu. Birinci sütun doğrudan izdüşüm: görüntü kodlayıcısı, izdüşüm katmanı, sonra uzun bir dizi, 576 görsel token artı metin, sonra dil modeli; altında dizi yama sayısı kadar uzar. İkinci sütun yeniden örnekleme: görüntü kodlayıcısı, öğrenilebilir sorgular 64 ya da 32, sonra kısa bir dizi, 64 görsel token artı metin, sonra dil modeli; altında dizi sabit miktarda uzar. Üçüncü sütun kapılı çapraz dikkat: dizide yalnızca metin token'ları var; görüntü kodlayıcısından çıkan ok diziye değil, sağdan dolaşıp doğrudan dil modelinin katmanlarındaki çapraz dikkat bloklarına girer; altında görüntü katmanlardan okunur. En altta kayıt: üç yol aynı işi yapar; fark, görsel bilginin dil modeline nereden girdiği ve pencerede ne kadar yer kapladığıdır.">
