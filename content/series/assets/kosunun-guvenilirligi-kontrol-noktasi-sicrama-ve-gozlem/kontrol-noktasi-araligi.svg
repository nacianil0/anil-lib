  <text x="20.0" y="402.0" font-size="13" fill="var(--text)">Sık kaydedersen birinci kayıp, seyrek kaydedersen ikinci kayıp büyür. Toplam, ikisinin</text>
  <text x="20.0" y="422.0" font-size="13" fill="var(--text)">eşitlendiği yerde en küçüktür: δ/T = T/(2M) → T* = √(2δM), toplam kayıp √(2δ/M).</text>
  <text x="20.0" y="452.0" font-size="13" fill="var(--text-faint)">δ = 2 dakika, M = 185,6 dakika. Eğriler formülden çizildi, ölçüm değildir; M bizim hesabımızdır.</text>
