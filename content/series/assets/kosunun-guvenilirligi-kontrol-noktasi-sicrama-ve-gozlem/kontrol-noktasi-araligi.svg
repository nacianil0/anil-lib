<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" role="img" aria-label="Bir çizgi grafiği. Yatay eksen kayıt aralığı T, 0'dan 120 dakikaya; dikey eksen kaybedilen süre, yüzde 0'dan 60'a. Kesikli iki eğri: kaydın maliyeti δ bölü T soldan hızla inen bir eğri, arızanın sildiği iş T bölü 2M sıfırdan yükselen bir doğru. Kalın üçüncü eğri toplam kayıptır ve U biçimindedir. İki kesikli eğrinin kesiştiği yerde ikisi de yüzde 7,3'tür; toplamın en küçük noktası aynı aralıkta durur: T yıldız 27,2 dakika, kayıp yüzde 14,7. Altta: toplam, iki kaybın eşitlendiği yerde en küçüktür; δ bölü T eşittir T bölü 2M, buradan T yıldız eşittir karekök 2δM ve toplam kayıp karekök 2δ bölü M. Kayıt: δ 2 dakika, M 185,6 dakika; eğriler formülden çizilmiştir, ölçüm değildir.">
