<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" role="img" aria-label="Üç veri kümesi için ikişer yatay çubuk: koyu çubuk öğrenilmiş ödül modeliyle standart pekiştirmeli öğrenme, açık çubuk yalnızca uzunluğu ödüllendiren eğitim; değer, denetimli ince ayar modeline karşı kazanma oranı, sağda ortalama çıktı uzunluğu. WebGPT: standart yüzde 58 ve 230 token, yalnızca uzunluk yüzde 56 ve 118 token. Stack: 58 ve 257, 59 ve 252. RLCD: 63 ve 94, 64 ve 98. Kesikli çizgi yüzde 50 yani başlangıç modeliyle başa baş. Altta değerlerin Singhal ve arkadaşlarının tablosundan olduğu, kazanma oranının benzetilmiş tercihle ölçüldüğü ve yıldızlı değerlerin istatistiksel olarak anlamlı olduğu yazılıdır.">
  <text x="20" y="28" font-size="13" font-weight="bold" fill="var(--text)">veri kümesi</text>
  <text x="200" y="28" font-size="13" font-weight="bold" fill="var(--text)">SFT'ye karşı kazanma oranı</text>
  <text x="700" y="28" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">uzunluk</text>
  <line x1="20" y1="38" x2="700" y2="38" stroke="var(--border)" />
  <line x1="350" y1="44" x2="350" y2="286" stroke="var(--text-faint)" stroke-dasharray="3 3" />
  <text x="350" y="304" font-size="13" text-anchor="middle" fill="var(--text-muted)">%50 = SFT ile başa baş</text>

  <text x="20" y="70" font-size="13" font-weight="bold" fill="var(--text)">WebGPT</text>
  <text x="20" y="88" font-size="13" fill="var(--text-muted)">soru cevaplama</text>
  <rect x="200" y="58" width="174" height="10" fill="var(--accent)" />
  <text x="384" y="68" font-size="13" fill="var(--text)">58*</text>
  <text x="700" y="68" font-size="13" text-anchor="end" fill="var(--text-muted)">230 token</text>
  <rect x="200" y="74" width="168" height="10" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="378" y="84" font-size="13" fill="var(--text)">56*</text>
  <text x="700" y="84" font-size="13" text-anchor="end" fill="var(--text-muted)">118 token</text>

  <text x="20" y="150" font-size="13" font-weight="bold" fill="var(--text)">Stack</text>
  <text x="20" y="168" font-size="13" fill="var(--text-muted)">teknik soru cevaplama</text>
  <rect x="200" y="138" width="174" height="10" fill="var(--accent)" />
  <text x="384" y="148" font-size="13" fill="var(--text)">58*</text>
  <text x="700" y="148" font-size="13" text-anchor="end" fill="var(--text-muted)">257 token</text>
  <rect x="200" y="154" width="177" height="10" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="387" y="164" font-size="13" fill="var(--text)">59*</text>
  <text x="700" y="164" font-size="13" text-anchor="end" fill="var(--text-muted)">252 token</text>

  <text x="20" y="230" font-size="13" font-weight="bold" fill="var(--text)">RLCD</text>
  <text x="20" y="248" font-size="13" fill="var(--text-muted)">çok turlu sohbet</text>
  <rect x="200" y="218" width="189" height="10" fill="var(--accent)" />
  <text x="399" y="228" font-size="13" fill="var(--text)">63*</text>
  <text x="700" y="228" font-size="13" text-anchor="end" fill="var(--text-muted)">94 token</text>
  <rect x="200" y="234" width="192" height="10" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="402" y="244" font-size="13" fill="var(--text)">64*</text>
  <text x="700" y="244" font-size="13" text-anchor="end" fill="var(--text-muted)">98 token</text>

  <line x1="20" y1="316" x2="700" y2="316" stroke="var(--border)" />
  <rect x="20" y="330" width="12" height="12" fill="var(--accent)" />
  <text x="38" y="340" font-size="13" fill="var(--text-muted)">öğrenilmiş ödül modeliyle eğitim</text>
  <rect x="290" y="330" width="12" height="12" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="308" y="340" font-size="13" fill="var(--text-muted)">yalnızca uzunluğu ödüllendiren eğitim</text>
  <text x="20" y="362" font-size="13" fill="var(--text-muted)">Kazanma oranı, başlangıçtaki denetimli ince ayar modeline karşı benzetilmiş tercihle ölçülür;</text>
  <text x="20" y="380" font-size="13" fill="var(--text-muted)">yıldız, farkın anlamlı olduğunu gösterir. Değerler Singhal ve arkadaşlarının tablosundan.</text>
  <text x="20" y="398" font-size="13" fill="var(--text-muted)">Çubuk: 100 = 300 birim; uzunluk, ortalama çıktı token'ı.</text>
</svg>
