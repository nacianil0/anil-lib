<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Ana bağlam kutusunda sistem talimatları, çalışma bağlamı ve mesaj kuyruğu üst üste; kuyruğun yanında yüzde 70'te uyarı ve yüzde 100'de boşaltma işaretleri. Dış bağlam kutusunda mesaj deposu ve arşiv. Kuyruktan depoya atılan mesajlar oku, depodan kuyruğa arama sonucu oku, çalışma bağlamı ile arşiv arasında yaz ve ara okları.">
  <defs>
    <marker id="ok-56-bellek" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cool)" />
    </marker>
  </defs>

  <rect x="20" y="40" width="360" height="268" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="200" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">ana bağlam: pencere</text>

  <rect x="36" y="56" width="328" height="36" rx="5" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="200" y="78" font-size="13" text-anchor="middle" fill="var(--text)">sistem talimatları · salt okunur</text>

  <rect x="36" y="104" width="328" height="52" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="200" y="125" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">çalışma bağlamı</text>
  <text x="200" y="144" font-size="13" text-anchor="middle" fill="var(--text-muted)">sabit boyutlu; yalnızca işlev çağrısıyla yazılır</text>

  <rect x="36" y="168" width="328" height="124" rx="5" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.2" />
  <text x="200" y="189" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">kuyruk: mesajlar, sırayla</text>
  <text x="200" y="208" font-size="13" text-anchor="middle" fill="var(--text-muted)">en başta atılanların özyinelemeli özeti</text>
  <line x1="52" y1="230" x2="348" y2="230" stroke="var(--border)" />
  <line x1="259" y1="222" x2="259" y2="238" stroke="var(--text)" stroke-width="1.4" />
  <text x="259" y="254" font-size="13" text-anchor="middle" fill="var(--text)">%70: uyarı</text>
  <line x1="348" y1="222" x2="348" y2="238" stroke="var(--text)" stroke-width="1.4" />
  <text x="318" y="278" font-size="13" text-anchor="middle" fill="var(--text)">%100: boşalt</text>
  <text x="130" y="278" font-size="13" text-anchor="middle" fill="var(--text-muted)">yarısı atılır, özetlenir</text>

  <rect x="440" y="40" width="260" height="268" rx="8" fill="var(--surface)" stroke="var(--cool)" stroke-width="1.5" />
  <text x="570" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">dış bağlam: pencere dışı</text>

  <rect x="456" y="56" width="228" height="100" rx="5" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="570" y="80" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">mesaj deposu</text>
  <text x="570" y="100" font-size="13" text-anchor="middle" fill="var(--text-muted)">bütün mesajlar, tarihli</text>
  <text x="570" y="120" font-size="13" text-anchor="middle" fill="var(--text-muted)">atılanlar da burada kalır</text>
  <text x="570" y="140" font-size="13" text-anchor="middle" fill="var(--text-muted)">aramayla geri gelir</text>

  <rect x="456" y="184" width="228" height="108" rx="5" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="0.8" />
  <text x="570" y="208" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">arşiv</text>
  <text x="570" y="228" font-size="13" text-anchor="middle" fill="var(--text-muted)">uzun metinler, belgeler</text>
  <text x="570" y="248" font-size="13" text-anchor="middle" fill="var(--text-muted)">modelin kendi yazdığı notlar</text>
  <text x="570" y="268" font-size="13" text-anchor="middle" fill="var(--text-muted)">okunur ve yazılır</text>

  <line x1="364" y1="200" x2="454" y2="120" stroke="var(--cool)" stroke-width="1.3" marker-end="url(#ok-56-bellek)" />
  <line x1="454" y1="140" x2="366" y2="250" stroke="var(--cool)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ok-56-bellek)" />
  <line x1="364" y1="130" x2="454" y2="230" stroke="var(--cool)" stroke-width="1.3" marker-end="url(#ok-56-bellek)" />
  <line x1="454" y1="250" x2="366" y2="150" stroke="var(--cool)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ok-56-bellek)" />

  <text x="20" y="336" font-size="13" fill="var(--text-muted)">Düz ok: yazma — atılan mesajlar depoya, notlar arşive. Kesik ok: arama sonucu geri döner.</text>
  <text x="20" y="354" font-size="13" fill="var(--text-muted)">Bütün taşımalar modelin kendi işlev çağrılarıdır; eşikler örnek değerlerdir.</text>
  <text x="20" y="372" font-size="13" fill="var(--text-muted)">Tasarım Packer ve arkadaşlarının hakemli olmayan çalışmasından.</text>
</svg>
