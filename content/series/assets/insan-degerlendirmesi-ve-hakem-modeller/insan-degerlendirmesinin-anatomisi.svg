<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" role="img" aria-label="Beş satırlı tablo; sütunlar karar, ölçülmüş kırılma ve düzeltme. Kim: kitle işçileri model metnini insan metninden ayıramıyor, öğretmenler ayırıyor; işçilerin yüzde 42'si görev başına 40 saniyeden az; uzman çevirmenler kitle sıralamasını baştan yazıyor; düzeltme uzman ve belge bağlamı. Ölçek: göreli ve sürekli ölçek uzlaşmayı artırıyor; kendinden emin üslup olgusallık algısını çarpıtıyor; düzeltme yan yana çıktı ve ayrı ölçütler. Kaç: üç etiketleyici ve yüz örnek küçük farkı göremiyor; düzeltme güç hesabı. Uzlaşma: yüzde 80 ham uzlaşma 10 ile 20 puanlık sapmayı gizleyebiliyor; ikili tercihte insan uzlaşması yüzde 63 ile 66; düzeltme şansa göre düzeltilmiş katsayı. Maliyet: sohbet modeli kitle işçisini yaklaşık 25 puan geçiyor, etiket başına 0,003 dolardan ucuz, yaklaşık otuz kat; düzeltme ucuz olanı insanla doğrulamak. Altta insan değerlendirmesinin bir protokol olduğu ve her satırın raporlanması gerektiği yazılıdır.">
  <text x="20" y="28" font-size="13" font-weight="bold" fill="var(--text)">karar</text>
  <text x="130" y="28" font-size="13" font-weight="bold" fill="var(--text)">ölçülmüş kırılma</text>
  <text x="500" y="28" font-size="13" font-weight="bold" fill="var(--text)">düzeltme</text>
  <line x1="20" y1="38" x2="700" y2="38" stroke="var(--border)" />

  <rect x="20" y="46" width="680" height="76" fill="var(--surface-muted)" />
  <text x="30" y="68" font-size="13" font-weight="bold" fill="var(--text)">kim puanlıyor</text>
  <text x="130" y="68" font-size="13" fill="var(--text)">kitle işçisi model metnini insandan ayıramıyor,</text>
  <text x="130" y="86" font-size="13" fill="var(--text)">öğretmen ayırıyor; işçilerin %42'si &lt; 40 sn;</text>
  <text x="130" y="104" font-size="13" fill="var(--text)">uzman çevirmen kitle sıralamasını baştan yazıyor</text>
  <text x="500" y="68" font-size="13" fill="var(--text)">uzman etiketleyici,</text>
  <text x="500" y="86" font-size="13" fill="var(--text)">belge bağlamı, açık</text>
  <text x="500" y="104" font-size="13" fill="var(--text)">hata sınıflandırması</text>

  <rect x="20" y="130" width="680" height="76" fill="var(--accent-soft)" />
  <text x="30" y="152" font-size="13" font-weight="bold" fill="var(--text)">hangi ölçek</text>
  <text x="130" y="152" font-size="13" fill="var(--text)">göreli ve sürekli ölçek uzlaşmayı artırıyor;</text>
  <text x="130" y="170" font-size="13" fill="var(--text)">kendinden emin üslup olgusallık algısını</text>
  <text x="130" y="188" font-size="13" fill="var(--text)">çarpıtıyor; tek tercih puanı olguyu az temsil ediyor</text>
  <text x="500" y="152" font-size="13" fill="var(--text)">çıktıları yan yana</text>
  <text x="500" y="170" font-size="13" fill="var(--text)">göstermek; ölçütleri</text>
  <text x="500" y="188" font-size="13" fill="var(--text)">ayrı ayrı puanlamak</text>

  <rect x="20" y="214" width="680" height="58" fill="var(--surface-muted)" />
  <text x="30" y="236" font-size="13" font-weight="bold" fill="var(--text)">kaç kişi</text>
  <text x="130" y="236" font-size="13" fill="var(--text)">en yaygın düzen, 3 etiketleyici × 100 örnek,</text>
  <text x="130" y="254" font-size="13" fill="var(--text)">büyük olmayan farkı göremiyor</text>
  <text x="500" y="236" font-size="13" fill="var(--text)">deneyden önce</text>
  <text x="500" y="254" font-size="13" fill="var(--text)">güç hesabı</text>

  <rect x="20" y="280" width="680" height="76" fill="var(--surface-muted)" />
  <text x="30" y="302" font-size="13" font-weight="bold" fill="var(--text)">uzlaşma</text>
  <text x="130" y="302" font-size="13" fill="var(--text)">ham %80 uzlaşma 10–20 puanlık sapmayı</text>
  <text x="130" y="320" font-size="13" fill="var(--text)">gizleyebiliyor; ikili tercihte insan–insan</text>
  <text x="130" y="338" font-size="13" fill="var(--text)">uzlaşması %63–66, rastgele taban %50</text>
  <text x="500" y="302" font-size="13" fill="var(--text)">şansa göre düzeltilmiş</text>
  <text x="500" y="320" font-size="13" fill="var(--text)">katsayı: kappa, alfa, pi;</text>
  <text x="500" y="338" font-size="13" fill="var(--text)">neye uzlaşıldığı yazılır</text>

  <rect x="20" y="364" width="680" height="76" fill="var(--surface-muted)" />
  <text x="30" y="386" font-size="13" font-weight="bold" fill="var(--text)">maliyet</text>
  <text x="130" y="386" font-size="13" fill="var(--text)">sohbet modeli dört etiketleme görevinde kitle</text>
  <text x="130" y="404" font-size="13" fill="var(--text)">işçisini ≈ 25 puan geçiyor; etiket başına</text>
  <text x="130" y="422" font-size="13" fill="var(--text)">&lt; 0,003 dolar, yaklaşık otuz kat ucuz</text>
  <text x="500" y="386" font-size="13" fill="var(--text)">ucuz etiketi küçük bir</text>
  <text x="500" y="404" font-size="13" fill="var(--text)">insan kümesiyle</text>
  <text x="500" y="422" font-size="13" fill="var(--text)">doğrulamak</text>

  <text x="20" y="470" font-size="13" fill="var(--text-muted)">İnsan değerlendirmesi bir protokoldür; beş satırın her biri raporlanır. Sayılar metinden.</text>
</svg>
