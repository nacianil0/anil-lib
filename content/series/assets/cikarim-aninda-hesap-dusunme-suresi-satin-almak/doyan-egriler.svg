<svg viewBox="0 0 720 362" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Her eğrinin bir tabanı var</text>

  <line x1="70" y1="56" x2="70" y2="240" stroke="var(--border)" stroke-width="1"/>
  <line x1="70" y1="240" x2="660" y2="240" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="66" font-size="13" text-anchor="start" fill="var(--text-faint)">çok hata</text>
  <text x="16" y="236" font-size="13" text-anchor="start" fill="var(--text-faint)">az hata</text>

  <path d="M 84 92 C 140 130, 190 148, 250 152 L 648 155" fill="none" stroke="var(--cool)" stroke-width="2"/>
  <path d="M 114 104 C 170 136, 240 162, 320 172 L 648 176" fill="none" stroke="var(--cool)" stroke-width="2"/>
  <path d="M 154 112 C 230 145, 300 175, 400 190 L 648 196" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <path d="M 204 118 C 290 150, 370 185, 480 205 L 648 212" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <path d="M 254 122 C 350 155, 440 195, 560 220 L 648 228" fill="none" stroke="var(--accent)" stroke-width="2"/>

  <text x="664" y="159" font-size="13" text-anchor="start" fill="var(--cool)">410M</text>
  <text x="664" y="180" font-size="13" text-anchor="start" fill="var(--cool)">1,4B</text>
  <text x="664" y="200" font-size="13" text-anchor="start" fill="var(--accent)">2,8B</text>
  <text x="664" y="216" font-size="13" text-anchor="start" fill="var(--accent)">6,9B</text>
  <text x="664" y="232" font-size="13" text-anchor="start" fill="var(--accent)">12B</text>

  <polygon points="166,129 172,135 166,141 160,135" fill="var(--text)"/>
  <polygon points="380,181 386,187 380,193 374,187" fill="var(--text)"/>
  <polygon points="600,216 606,222 600,228 594,222" fill="var(--text)"/>

  <text x="70" y="258" font-size="13" text-anchor="start" fill="var(--text-muted)">az</text>
  <text x="360" y="258" font-size="13" text-anchor="middle" fill="var(--text-muted)">soru başına çıkarım işlemi</text>
  <text x="660" y="258" font-size="13" text-anchor="end" fill="var(--text-muted)">çok</text>

  <line x1="16" y1="274" x2="704" y2="274" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="296" font-size="13" text-anchor="start" fill="var(--text-muted)">her eğri önce düzenli olarak iner, sonra kendi tabanında doyar</text>
  <text x="16" y="318" font-size="13" text-anchor="start" fill="var(--text-muted)">işaretler o bütçedeki en iyi boyu gösterir: düşük bütçede küçük, yüksek bütçede büyük model</text>
  <text x="16" y="340" font-size="13" text-anchor="start" fill="var(--text-faint)">eğrilerin biçimi şematiktir; ölçülmüş olan, kesişmelerin ve doymanın yönüdür</text>
</svg>
