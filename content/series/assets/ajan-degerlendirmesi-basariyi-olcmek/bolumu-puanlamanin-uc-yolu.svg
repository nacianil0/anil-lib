<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 384" role="img" aria-label="Üstte bir bölümün bıraktığı üç şey: iz, dünyanın son durumu ve söylenen cevap ya da yama; izden son duruma ve cevaba oklar gider. Altta üç puanlama yolu, her biri baktığı parçanın altında: hakem model izin altında, durum karşılaştırması son durumun altında, çıktı eşleşmesi cevabın altında; her birinin altında neyi gördüğü, neyi kaçırdığı ve nerede kullanıldığı yazılıdır.">
  <defs>
    <marker id="puanlama-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)" />
    </marker>
  </defs>

  <text x="16" y="20" font-size="13" font-weight="bold" fill="var(--text)">bölüm bitince ortada kalan üç şey</text>

  <rect x="16" y="46" width="216" height="50" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="124" y="66" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">iz (izlenen yol)</text>
  <text x="124" y="86" font-size="13" text-anchor="middle" fill="var(--text)">düşün → eyle → gözle, n kez</text>

  <rect x="256" y="46" width="216" height="50" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="364" y="66" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">dünyanın son durumu</text>
  <text x="364" y="86" font-size="13" text-anchor="middle" fill="var(--text)">veritabanı, dosyalar, sepet</text>

  <rect x="496" y="46" width="216" height="50" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="604" y="66" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">söylenen cevap ya da yama</text>
  <text x="604" y="86" font-size="13" text-anchor="middle" fill="var(--text)">mesaj, kısa cevap, kod</text>

  <line x1="232" y1="71" x2="252" y2="71" stroke="var(--text-muted)" stroke-width="1.3" marker-end="url(#puanlama-ok)" />
  <path d="M124,46 L124,32 L604,32 L604,42" fill="none" stroke="var(--text-muted)" stroke-width="1.3" marker-end="url(#puanlama-ok)" />

  <rect x="16" y="132" width="216" height="52" rx="6" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="1.2" />
  <text x="124" y="153" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">hakem model</text>
  <text x="124" y="173" font-size="13" text-anchor="middle" fill="var(--text)">iz ve çıktıyı puanlar</text>

  <rect x="256" y="132" width="216" height="52" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="364" y="153" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">durum karşılaştırması</text>
  <text x="364" y="173" font-size="13" text-anchor="middle" fill="var(--text)">beklenen durumla kıyaslar</text>

  <rect x="496" y="132" width="216" height="52" rx="6" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.5" />
  <text x="604" y="153" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">çıktı eşleşmesi</text>
  <text x="604" y="173" font-size="13" text-anchor="middle" fill="var(--text)">anahtar ya da gizli test</text>

  <line x1="124" y1="132" x2="124" y2="101" stroke="var(--text-muted)" stroke-width="1.3" marker-end="url(#puanlama-ok)" />
  <line x1="364" y1="132" x2="364" y2="101" stroke="var(--text-muted)" stroke-width="1.3" marker-end="url(#puanlama-ok)" />
  <line x1="604" y1="132" x2="604" y2="101" stroke="var(--text-muted)" stroke-width="1.3" marker-end="url(#puanlama-ok)" />

  <text x="24" y="212" font-size="13" fill="var(--text-muted)">görür</text>
  <text x="24" y="230" font-size="13" fill="var(--text)">yolu ve kısmi ilerlemeyi;</text>
  <text x="24" y="248" font-size="13" fill="var(--text)">insanla uyum %85–90</text>
  <text x="24" y="274" font-size="13" fill="var(--text-muted)">kaçırır</text>
  <text x="24" y="292" font-size="13" fill="var(--text)">kendi yanlılıklarını</text>
  <text x="24" y="318" font-size="13" fill="var(--text-muted)">nerede</text>
  <text x="24" y="336" font-size="13" fill="var(--text)">canlı siteler, hakem ajan</text>

  <text x="264" y="212" font-size="13" fill="var(--text-muted)">görür</text>
  <text x="264" y="230" font-size="13" fill="var(--text)">dünyaya gerçekten ne oldu;</text>
  <text x="264" y="248" font-size="13" fill="var(--text)">belirlenimci, ucuz</text>
  <text x="264" y="274" font-size="13" fill="var(--text-muted)">kaçırır</text>
  <text x="264" y="292" font-size="13" fill="var(--text)">yolu ve söyleneni</text>
  <text x="264" y="318" font-size="13" fill="var(--text-muted)">nerede</text>
  <text x="264" y="336" font-size="13" fill="var(--text)">τ-bench, ara hedefler</text>

  <text x="504" y="212" font-size="13" fill="var(--text-muted)">görür</text>
  <text x="504" y="230" font-size="13" fill="var(--text)">sonucu; oynanması zor</text>
  <text x="504" y="274" font-size="13" fill="var(--text-muted)">kaçırır</text>
  <text x="504" y="292" font-size="13" fill="var(--text)">yolu; testin sormadığını</text>
  <text x="504" y="318" font-size="13" fill="var(--text-muted)">nerede</text>
  <text x="504" y="336" font-size="13" fill="var(--text)">GAIA, SWE-bench</text>

  <line x1="16" y1="352" x2="712" y2="352" stroke="var(--border)" />
  <text x="16" y="372" font-size="13" fill="var(--text-muted)">Her yol bölümün başka bir parçasına bakar; biri öbürünün yerine geçmez.</text>
</svg>
