<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-label="Altı model için dört sütun: tam başarı ve kısmi puan çubukları, görev başına ortalama adım ve dolar maliyeti. Gemini 2.5 Pro 30,3 ve 39,3, 27,2 adım, 4,2 dolar; Claude 3.7 Sonnet 26,3 ve 36,4, 27,8 adım, 4,1 dolar; Gemini 2.0 Flash 11,4 ve 19,0, 39,9 adım, 0,6 dolar; GPT-4o 8,6 ve 16,7, 14,6 adım, 1,3 dolar; Llama 3.3 70B 6,9 ve 12,8, 20,9 adım, 0,9 dolar; Qwen 2.5 72B 5,7 ve 11,8, 24,0 adım, 1,5 dolar.">
