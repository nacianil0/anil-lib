  <text x="20" y="346" font-size="13" fill="var(--text-muted)">175 görev, aynı iskelet; koyu çubuk bütün ara hedefleri geçen görevler, açık çubuk kısmi puan.</text>
  <text x="20" y="364" font-size="13" fill="var(--text-muted)">Adım ve dolar görev başına ortalama; 40 = 200 birim. Vurgulu satır: en çok adım, en az para.</text>
