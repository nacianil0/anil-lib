<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" role="img" aria-label="Altı satır ve beş sayı sütunluk tablo; sütunlar özgün sıra ve doğru cevabın A, B, C ya da D şıkkına taşınmış hâli, hücrelerde zero-shot MMLU doğruluğu. llama-30B: 53,1; 68,2; 54,1; 50,1; 41,2. vicuna-33B: 57,0; 59,5; 58,6; 65,8; 44,8. falcon-40B: 51,8; 46,3; 45,2; 64,8; 47,9. falcon-instruct-40B: 51,5; 38,3; 38,9; 55,7; 69,1. llama-2-70B: 64,0; 61,5; 68,6; 64,1; 62,0. gpt-3.5-turbo: 67,2; 65,3; 68,5; 74,2; 60,9. llama-30B'nin A hücresi ve gpt-3.5-turbo'nun A hücresi vurguludur; altta A'ya taşınınca llama-30B'nin 68,2 ile gpt-3.5-turbo'nun 65,3'ünü geçtiği, özgün sırada ise 53,1'e karşı 67,2 olduğu yazılıdır. En altta değerlerin Zheng ve arkadaşlarının tablosundan alındığı ve şık harflerini kaldırmanın seçim yanlılığı ölçüsünü 5,5'ten 1,0'a indirdiği yazılıdır.">
