<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="sa-gy-ileri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)"/>
    </marker>
    <marker id="sa-gy-geri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text x="20" y="32" font-size="14" fill="var(--text-muted)">ileri geçiş: değerler soldan sağa</text>

  <rect x="20" y="80" width="90" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="65" y="105" font-size="15" text-anchor="middle" fill="var(--text)">x = 2</text>
  <rect x="170" y="80" width="90" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="215" y="105" font-size="15" text-anchor="middle" fill="var(--text)">z = 1</text>
  <rect x="320" y="80" width="90" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="365" y="105" font-size="15" text-anchor="middle" fill="var(--text)">h = 1</text>
  <rect x="470" y="80" width="90" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="515" y="105" font-size="15" text-anchor="middle" fill="var(--text)">ŷ = 3</text>
  <rect x="620" y="80" width="90" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="665" y="105" font-size="15" text-anchor="middle" fill="var(--text)">kayıp = 1</text>

  <line x1="112" y1="100" x2="165" y2="100" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#sa-gy-ileri)"/>
  <line x1="262" y1="100" x2="315" y2="100" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#sa-gy-ileri)"/>
  <line x1="412" y1="100" x2="465" y2="100" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#sa-gy-ileri)"/>
  <line x1="562" y1="100" x2="615" y2="100" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#sa-gy-ileri)"/>
  <text x="140" y="68" font-size="13" text-anchor="middle" fill="var(--text-muted)">× w₁ (0,5)</text>
  <text x="290" y="68" font-size="13" text-anchor="middle" fill="var(--text-muted)">ReLU</text>
  <text x="440" y="68" font-size="13" text-anchor="middle" fill="var(--text-muted)">× w₂ (3)</text>
  <text x="590" y="68" font-size="13" text-anchor="middle" fill="var(--text-muted)">(ŷ − 2)²</text>

  <text x="20" y="166" font-size="14" fill="var(--accent)">geri geçiş: duyarlılıklar sağdan sola</text>

  <rect x="470" y="180" width="90" height="40" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="515" y="205" font-size="15" text-anchor="middle" fill="var(--text)">ŷ: 2</text>
  <rect x="320" y="180" width="90" height="40" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="365" y="205" font-size="15" text-anchor="middle" fill="var(--text)">h: 6</text>
  <rect x="170" y="180" width="90" height="40" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="215" y="205" font-size="15" text-anchor="middle" fill="var(--text)">z: 6</text>

  <line x1="655" y1="123" x2="566" y2="186" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#sa-gy-geri)"/>
  <text x="704" y="170" font-size="13" text-anchor="end" fill="var(--accent)">2 × (ŷ − 2)</text>
  <line x1="468" y1="200" x2="415" y2="200" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#sa-gy-geri)"/>
  <line x1="318" y1="200" x2="265" y2="200" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#sa-gy-geri)"/>
  <text x="440" y="238" font-size="13" text-anchor="middle" fill="var(--accent)">× w₂ = 3</text>
  <text x="290" y="238" font-size="13" text-anchor="middle" fill="var(--accent)">× 1 (ReLU)</text>

  <line x1="215" y1="222" x2="215" y2="247" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#sa-gy-geri)"/>
  <line x1="515" y1="222" x2="515" y2="247" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#sa-gy-geri)"/>
  <rect x="117" y="250" width="196" height="38" rx="6" fill="var(--surface-muted)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="215" y="274" font-size="14" text-anchor="middle" fill="var(--text)">w₁'in payı: 6 × x = 12</text>
  <rect x="417" y="250" width="196" height="38" rx="6" fill="var(--surface-muted)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="515" y="274" font-size="14" text-anchor="middle" fill="var(--text)">w₂'nin payı: 2 × h = 2</text>
</svg>
