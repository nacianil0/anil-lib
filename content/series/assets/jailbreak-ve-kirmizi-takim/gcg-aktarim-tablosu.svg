<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" role="img" aria-label="Altı satır beş sütunlu tablo: satırlar saldırı düzeni, sütunlar GPT-3.5, GPT-4, Claude 1, Claude 2 ve PaLM-2 için yüzde saldırı başarısı. Yalnızca davranış: 1,8, 8,0, 0,0, 0,0, 0,0. Davranış artı elbette işte: 5,7, 13,1, 0,0, 0,0, 0,0. Davranış artı Vicuna'da bulunan GCG soneği: 34,3, 34,5, 2,6, 0,0, 31,7. Vicuna ve Guanaco'da bulunan sonek: 47,4, 29,1, 37,6, 1,8, 36,1. Birkaç soneğin art arda eklenmesi: 79,6, 24,2, 38,4, 1,3, 14,4. Vurgulu son satır, soneklerin topluluğu yani herhangi biri tutarsa: 86,6, 46,9, 47,9, 2,1, 66,0. Altta değerlerin 388 davranış üzerinden ortalama olduğu, soneklerin yalnızca açık ağırlıklı modellerde eniyilendiği ve değerlerin Zou ve arkadaşlarının hakemli olmayan çalışmasından geldiği yazılıdır.">
