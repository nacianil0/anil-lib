  <line x1="20" y1="226" x2="700" y2="226" stroke="var(--border)" />
  <text x="20" y="250" font-size="13" fill="var(--text-muted)">Yüzde saldırı başarısı, 388 zararlı davranış üzerinden ortalama. Sonekler yalnızca açık</text>
  <text x="20" y="268" font-size="13" fill="var(--text-muted)">ağırlıklı modellerde eniyilendi; sütunlardaki modellerin ağırlıkları görülmedi. Topluluk:</text>
  <text x="20" y="286" font-size="13" fill="var(--text-muted)">soneklerden herhangi biri tutarsa başarılı sayılır. Değerler Zou ve arkadaşlarının hakemli</text>
  <text x="20" y="304" font-size="13" fill="var(--text-muted)">olmayan çalışmasının tablosundan.</text>
