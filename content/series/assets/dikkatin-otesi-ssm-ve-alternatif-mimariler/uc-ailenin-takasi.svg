<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-label="Üç satırlı karşılaştırma tablosu; satırlar seyrek dikkat, doğrusal dikkat ve durum uzayı modelleri. Sütunlar neyin yerine geçtiği, maliyet yapısı ve neyin feda edildiği. Seyrek dikkat bütün ikilileri hesaplamanın yerine seçilmiş bir alt kümeyi koyar, maliyeti uzunlukla doğrusaldır ve aynı donanımda sekiz kata kadar uzun dizi işlenebilir, feda edilen şey her konumun her konuma doğrudan erişimidir çünkü bağlantı ancak birkaç katman üzerinden kurulur. Doğrusal dikkat softmax'ın yerine çekirdek biçiminde bir benzerlik koyar, toplam birikimli tutulabildiği için model matris durumlu bir yinelemeye dönüşür ve çok uzun dizilerde dört bin kata varan hızlanma bildirilmiştir, feda edilen şey softmax'ın keskin seçiciliğidir. Durum uzayı modelleri dikkatin yerine sabit boyutlu bir durum koyar, eğitimde evrişim olarak paralel çıkarımda yineleme olarak sabit maliyetlidir, feda edilen şey geri çağırmadır ve durum takibi kazanılmaz. En altta bir kayıt: üçünün de bugünkü pratik hâli melezdir, çünkü kaybedilen yetenek küçük bir dikkat payıyla geri alınabiliyor.">
  <text x="30" y="24" font-size="13" font-weight="bold" fill="var(--text)">aile</text>
  <text x="180" y="24" font-size="13" font-weight="bold" fill="var(--text)">neyin yerine geçiyor</text>
  <text x="380" y="24" font-size="13" font-weight="bold" fill="var(--text)">maliyet yapısı</text>
  <text x="550" y="24" font-size="13" font-weight="bold" fill="var(--text)">ne feda ediliyor</text>
  <line x1="20" y1="34" x2="700" y2="34" stroke="var(--border)" />

  <rect x="20" y="42" width="680" height="78" fill="var(--surface-muted)" />
  <text x="30" y="66" font-size="13" font-weight="bold" fill="var(--text)">seyrek</text>
  <text x="30" y="84" font-size="13" font-weight="bold" fill="var(--text)">dikkat</text>
  <text x="180" y="66" font-size="13" fill="var(--text)">bütün ikililer yerine</text>
  <text x="180" y="84" font-size="13" fill="var(--text)">seçilmiş alt küme</text>
  <text x="380" y="66" font-size="13" fill="var(--text)">uzunlukla doğrusal;</text>
  <text x="380" y="84" font-size="13" fill="var(--text)">8 kata kadar uzun</text>
  <text x="380" y="102" font-size="13" fill="var(--text)">dizi işlenebiliyor</text>
  <text x="550" y="66" font-size="13" fill="var(--accent)">doğrudan erişim;</text>
  <text x="550" y="84" font-size="13" fill="var(--accent)">bağlantı katmanlar</text>
  <text x="550" y="102" font-size="13" fill="var(--accent)">üzerinden kurulur</text>

  <rect x="20" y="128" width="680" height="78" fill="var(--bg)" stroke="var(--border)" />
  <text x="30" y="152" font-size="13" font-weight="bold" fill="var(--text)">doğrusal</text>
  <text x="30" y="170" font-size="13" font-weight="bold" fill="var(--text)">dikkat</text>
  <text x="180" y="152" font-size="13" fill="var(--text)">softmax yerine çekirdek</text>
  <text x="180" y="170" font-size="13" fill="var(--text)">biçiminde benzerlik</text>
  <text x="380" y="152" font-size="13" fill="var(--text)">matris durumlu</text>
  <text x="380" y="170" font-size="13" fill="var(--text)">yineleme; 4000 kata</text>
  <text x="380" y="188" font-size="13" fill="var(--text)">varan hızlanma</text>
  <text x="550" y="152" font-size="13" fill="var(--accent)">softmax'ın keskin</text>
  <text x="550" y="170" font-size="13" fill="var(--accent)">seçiciliği</text>

  <rect x="20" y="214" width="680" height="78" fill="var(--surface-muted)" />
  <text x="30" y="238" font-size="13" font-weight="bold" fill="var(--text)">durum uzayı</text>
  <text x="30" y="256" font-size="13" font-weight="bold" fill="var(--text)">modelleri</text>
  <text x="180" y="238" font-size="13" fill="var(--text)">dikkat yerine sabit</text>
  <text x="180" y="256" font-size="13" fill="var(--text)">boyutlu durum</text>
  <text x="380" y="238" font-size="13" fill="var(--text)">eğitimde evrişim,</text>
  <text x="380" y="256" font-size="13" fill="var(--text)">çıkarımda yineleme</text>
  <text x="550" y="238" font-size="13" fill="var(--accent)">geri çağırma;</text>
  <text x="550" y="256" font-size="13" fill="var(--accent)">durum takibi de</text>
  <text x="550" y="274" font-size="13" fill="var(--accent)">kazanılmıyor</text>

  <line x1="20" y1="300" x2="700" y2="300" stroke="var(--border)" />
  <text x="20" y="324" font-size="13" fill="var(--cool)">Üçünün de bugünkü pratik hâli melez: kaybedilen yetenek küçük bir dikkat</text>
  <text x="20" y="342" font-size="13" fill="var(--cool)">payıyla geri alınabiliyor.</text>
</svg>
