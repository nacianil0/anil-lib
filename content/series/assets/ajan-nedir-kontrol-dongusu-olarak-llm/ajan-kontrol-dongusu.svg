<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Ajan kontrol döngüsü: pencere dil modeline girer; model her turda çağrı, mesaj ya da dur kararı verir; çağrı çalıştırıcı üzerinden çevreye gider ve gözlem olarak pencereye döner; mesaj kullanıcıya gider ve cevap olarak döner; dur döngüden çıkar.">
  <defs>
    <marker id="ok-51-akis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)" />
    </marker>
    <marker id="ok-51-donus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cool)" />
    </marker>
  </defs>

  <line x1="700" y1="40" x2="95" y2="40" stroke="var(--cool)" stroke-width="1.2" />
  <line x1="95" y1="40" x2="95" y2="116" stroke="var(--cool)" stroke-width="1.2" marker-end="url(#ok-51-donus)" />
  <line x1="640" y1="100" x2="640" y2="40" stroke="var(--cool)" stroke-width="1.2" />
  <line x1="580" y1="172" x2="700" y2="172" stroke="var(--cool)" stroke-width="1.2" />
  <line x1="700" y1="172" x2="700" y2="40" stroke="var(--cool)" stroke-width="1.2" />
  <text x="380" y="34" font-size="13" text-anchor="middle" fill="var(--cool)">gözlem</text>
  <text x="694" y="164" font-size="13" text-anchor="end" fill="var(--cool)">cevap</text>

  <text x="230" y="80" font-size="13" fill="var(--text-muted)">her turda üç karar: hangi eylem · çağrı mı, mesaj mı · dur mu</text>

  <rect x="20" y="120" width="150" height="130" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="95" y="146" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">pencere</text>
  <text x="95" y="172" font-size="13" text-anchor="middle" fill="var(--text)">istem</text>
  <text x="95" y="194" font-size="13" text-anchor="middle" fill="var(--text)">geçmiş</text>
  <text x="95" y="216" font-size="13" text-anchor="middle" fill="var(--text)">son gözlem</text>

  <line x1="170" y1="185" x2="228" y2="185" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-51-akis)" />

  <rect x="230" y="100" width="190" height="150" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="325" y="126" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">dil modeli · karar</text>
  <text x="325" y="160" font-size="13" text-anchor="middle" fill="var(--text-muted)">iç eylemler:</text>
  <text x="325" y="180" font-size="13" text-anchor="middle" fill="var(--text)">düşünce</text>
  <text x="325" y="200" font-size="13" text-anchor="middle" fill="var(--text)">getirme</text>
  <text x="325" y="220" font-size="13" text-anchor="middle" fill="var(--text)">belleğe yazma</text>

  <line x1="420" y1="122" x2="478" y2="122" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-51-akis)" />
  <text x="449" y="114" font-size="13" text-anchor="middle" fill="var(--text-muted)">çağrı</text>
  <line x1="420" y1="172" x2="478" y2="172" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-51-akis)" />
  <text x="449" y="164" font-size="13" text-anchor="middle" fill="var(--text-muted)">mesaj</text>
  <line x1="420" y1="222" x2="478" y2="222" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-51-akis)" />
  <text x="449" y="214" font-size="13" text-anchor="middle" fill="var(--text-muted)">dur</text>

  <rect x="480" y="100" width="100" height="44" rx="6" fill="var(--surface)" stroke="var(--border)" />
  <text x="530" y="126" font-size="13" text-anchor="middle" fill="var(--text)">çalıştırıcı</text>
  <line x1="580" y1="122" x2="598" y2="122" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-51-akis)" />
  <rect x="600" y="100" width="80" height="44" rx="6" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.5" />
  <text x="640" y="126" font-size="13" text-anchor="middle" fill="var(--text)">çevre</text>

  <rect x="480" y="150" width="100" height="44" rx="6" fill="var(--surface)" stroke="var(--border)" />
  <text x="530" y="176" font-size="13" text-anchor="middle" fill="var(--text)">kullanıcı</text>

  <rect x="480" y="200" width="100" height="44" rx="6" fill="var(--surface-muted)" stroke="var(--border)" stroke-dasharray="5 4" />
  <text x="530" y="226" font-size="13" text-anchor="middle" fill="var(--text-muted)">bölüm sonu</text>

  <line x1="20" y1="276" x2="700" y2="276" stroke="var(--border)" />
  <text x="20" y="300" font-size="13" fill="var(--text-muted)">Model dünyayı yalnızca pencereden görür; çevreye yalnızca çalıştırıcı dokunur.</text>
  <text x="20" y="320" font-size="13" fill="var(--text-muted)">Döngüyü kapatan şey modelin ürettiği metindir: çağrı, mesaj ya da dur.</text>
</svg>
