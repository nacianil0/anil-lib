<svg viewBox="0 0 720 394" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ok-43-katman" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)"/>
    </marker>
  </defs>
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Dizin, veritabanı ve uygulama: hangi düğme neyi değiştirir</text>
  <text x="16" y="46" font-size="13" text-anchor="start" fill="var(--text-faint)">üç katman; oklar bir katmanın bir üsttekine hizmet ettiğini gösterir</text>

  <rect x="16" y="60" width="484" height="50" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="24" y="75" font-size="13" text-anchor="start" fill="var(--text-faint)">uygulama</text>
  <rect x="150" y="66" width="216" height="36" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="258" y="89" font-size="13" text-anchor="middle" fill="var(--text)">getirme hattı</text>

  <line x1="258" y1="140" x2="258" y2="113" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-43-katman)"/>

  <rect x="16" y="140" width="484" height="72" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="24" y="155" font-size="13" text-anchor="start" fill="var(--text-faint)">veritabanı işleri</text>
  <rect x="24" y="162" width="108" height="42" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="78" y="187" font-size="13" text-anchor="middle" fill="var(--text)">etiketle süzme</text>
  <rect x="144" y="162" width="108" height="42" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="198" y="180" font-size="13" text-anchor="middle" fill="var(--text)">ekleme</text>
  <text x="198" y="196" font-size="13" text-anchor="middle" fill="var(--text)">ve silme</text>
  <rect x="264" y="162" width="108" height="42" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="318" y="180" font-size="13" text-anchor="middle" fill="var(--text)">makinelere</text>
  <text x="318" y="196" font-size="13" text-anchor="middle" fill="var(--text)">bölme</text>
  <rect x="384" y="162" width="108" height="42" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="438" y="187" font-size="13" text-anchor="middle" fill="var(--text)">melez sorgu</text>

  <line x1="258" y1="230" x2="258" y2="215" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-43-katman)"/>

  <rect x="16" y="230" width="484" height="78" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="24" y="245" font-size="13" text-anchor="start" fill="var(--text-faint)">dizin yapısı</text>
  <rect x="24" y="252" width="146" height="30" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="97" y="271" font-size="13" text-anchor="middle" fill="var(--text)">ters dosya</text>
  <text x="97" y="300" font-size="13" text-anchor="middle" fill="var(--text-muted)">yoklanan küme sayısı</text>
  <rect x="184" y="252" width="146" height="30" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="257" y="271" font-size="13" text-anchor="middle" fill="var(--text)">ürün kuantizasyonu</text>
  <text x="257" y="300" font-size="13" text-anchor="middle" fill="var(--text-muted)">kod uzunluğu</text>
  <rect x="344" y="252" width="146" height="30" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="417" y="271" font-size="13" text-anchor="middle" fill="var(--text)">yakınlık çizgesi</text>
  <text x="417" y="300" font-size="13" text-anchor="middle" fill="var(--text-muted)">sorgu genişliği</text>

  <text x="520" y="80" font-size="13" text-anchor="start" fill="var(--text-muted)">hat, iki katmanı</text>
  <text x="520" y="98" font-size="13" text-anchor="start" fill="var(--text-muted)">birden kullanır</text>
  <text x="520" y="180" font-size="13" text-anchor="start" fill="var(--text-muted)">bu işler sonucun doğruluğunu</text>
  <text x="520" y="198" font-size="13" text-anchor="start" fill="var(--text-muted)">ve tazeliğini belirler</text>
  <text x="520" y="266" font-size="13" text-anchor="start" fill="var(--text-muted)">bu düğmeler bulma oranı</text>
  <text x="520" y="284" font-size="13" text-anchor="start" fill="var(--text-muted)">ile hızı birlikte değiştirir</text>

  <line x1="16" y1="330" x2="704" y2="330" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="354" font-size="13" text-anchor="start" fill="var(--text-muted)">bir vektör veritabanı: alt katmandan bir dizin artı orta katmanın işleri</text>
  <text x="16" y="376" font-size="13" text-anchor="start" fill="var(--text-faint)">hangi ürünün hangi dizini kullandığı değişir; hangi katmanın neyi belirlediği değişmez</text>
</svg>
