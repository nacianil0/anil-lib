<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ok-ol-notr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)"/>
    </marker>
  </defs>

  <!-- Sol panel: sürekli metrik -->
  <line x1="70" y1="250" x2="340" y2="250" stroke="var(--border)" stroke-width="1"/>
  <line x1="70" y1="60" x2="70" y2="250" stroke="var(--border)" stroke-width="1"/>

  <polyline points="70,155 124,117 178,98 232,79 286,69.5 340,63.8" fill="none" stroke="var(--cool)" stroke-width="2.5"/>
  <circle cx="70" cy="155" r="4" fill="var(--cool)"/>
  <circle cx="124" cy="117" r="4" fill="var(--cool)"/>
  <circle cx="178" cy="98" r="4" fill="var(--cool)"/>
  <circle cx="232" cy="79" r="4" fill="var(--cool)"/>
  <circle cx="286" cy="69.5" r="4" fill="var(--cool)"/>
  <circle cx="340" cy="63.8" r="4" fill="var(--cool)"/>

  <text x="10" y="24" font-size="13" text-anchor="start" fill="var(--text-muted)">p — token başına doğruluk</text>
  <text x="205" y="44" font-size="14" text-anchor="middle" fill="var(--cool)">sürekli metrik</text>
  <text x="232" y="70" font-size="13" text-anchor="middle" fill="var(--text-muted)">0,90</text>
  <text x="286" y="60" font-size="13" text-anchor="middle" fill="var(--text-muted)">0,95</text>
  <text x="205" y="278" font-size="13" text-anchor="middle" fill="var(--text-muted)">ölçek (log)</text>

  <!-- Bağlantı: üs alma işlemi -->
  <line x1="352" y1="160" x2="438" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ok-ol-notr)"/>
  <text x="395" y="150" font-size="13" text-anchor="middle" fill="var(--text-muted)">yirminci kuvvet</text>

  <!-- Sağ panel: ya-hep-ya-hiç metrik -->
  <line x1="450" y1="250" x2="700" y2="250" stroke="var(--border)" stroke-width="1"/>
  <line x1="450" y1="60" x2="450" y2="250" stroke="var(--border)" stroke-width="1"/>

  <polyline points="450,250 500,249.8 550,247.7 600,226.8 650,182 700,123.1" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="450" cy="250" r="4" fill="var(--accent)"/>
  <circle cx="500" cy="249.8" r="4" fill="var(--accent)"/>
  <circle cx="550" cy="247.7" r="4" fill="var(--accent)"/>
  <circle cx="600" cy="226.8" r="4" fill="var(--accent)"/>
  <circle cx="650" cy="182" r="4" fill="var(--accent)"/>
  <circle cx="700" cy="123.1" r="4" fill="var(--accent)"/>

  <text x="450" y="24" font-size="13" text-anchor="start" fill="var(--text-muted)">p²⁰ — yirmi token'lık dizi</text>
  <text x="575" y="44" font-size="14" text-anchor="middle" fill="var(--accent)">ya-hep-ya-hiç metrik</text>
  <text x="594" y="220" font-size="13" text-anchor="end" fill="var(--text-muted)">0,12</text>
  <text x="644" y="176" font-size="13" text-anchor="end" fill="var(--text-muted)">0,36</text>
  <text x="575" y="278" font-size="13" text-anchor="middle" fill="var(--text-muted)">ölçek (log)</text>
</svg>
