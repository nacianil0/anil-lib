<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" role="img" aria-label="Üst üste iki yatay yüzde çubuğu. Üstteki işlemin payı: matris çarpımı yüzde 99,80 ile çubuğun neredeyse tamamını kaplar; normalleştirme ve öge bazlı işlemlerin toplamı yüzde 0,20'dir ve sağ uçta görünmeyecek kadar incedir. Alttaki sürenin payı: matris çarpımı yüzde 61,0, normalleştirme yüzde 25,5, öge bazlı işlemler yüzde 13,5. İki kesikli çizgi üst çubuktaki sınırları alttakilere bağlar ve binde ikilik dilimin sürenin yüzde 39'una yayıldığını gösterir. Altta: birim işlem başına 39 bölü 0,20 bölü 61 bölü 99,80, yaklaşık 319 kat; iki sebep taşınan bayt, yani yinelemenin yüzde 37'sinin bellekle sınırlı işlemlerde geçmesi, ve koşturan birim, yani 16 kata kadar verim farkı. Kayıt: yüzdeler Ivanov ve arkadaşlarından, 16 kat Dao'dan, 319 kat bizim hesabımızdır.">
  <text x="20.0" y="30.0" font-size="13" fill="var(--text)">Aynı yineleme, iki çubuk: işlemin payı ve sürenin payı</text>
  <line x1="20" y1="44" x2="700" y2="44" stroke="var(--border)" />
  <text x="90.0" y="72.0" font-size="13" font-weight="bold" fill="var(--text)">işlemin payı</text>
  <text x="690.0" y="72.0" font-size="13" font-weight="bold" text-anchor="end" fill="var(--accent)">matris dışındaki işlemler: %0,20</text>
  <text x="90.0" y="196.0" font-size="13" font-weight="bold" fill="var(--text)">sürenin payı</text>
  <rect x="90.0" y="82" width="598.8" height="40" fill="var(--cool-soft)" stroke="var(--border)" />
  <rect x="688.8" y="82" width="1.0" height="40" fill="var(--accent-soft)" stroke="var(--border)" />
  <rect x="689.8" y="82" width="0.6" height="40" fill="var(--accent)" stroke="var(--border)" />
  <rect x="90.0" y="206" width="366.0" height="40" fill="var(--cool-soft)" stroke="var(--border)" />
  <rect x="456.0" y="206" width="153.0" height="40" fill="var(--accent-soft)" stroke="var(--border)" />
  <rect x="609.0" y="206" width="81.0" height="40" fill="var(--accent)" stroke="var(--border)" />
  <text x="102.0" y="107.0" font-size="13" font-weight="bold" fill="var(--cool)">matris çarpımı %99,80</text>
  <text x="102.0" y="231.0" font-size="13" font-weight="bold" fill="var(--cool)">matris çarpımı %61,0</text>
  <text x="532.5" y="224.0" font-size="13" text-anchor="middle" fill="var(--text)">normalleştirme</text>
  <text x="532.5" y="240.0" font-size="13" text-anchor="middle" fill="var(--text)">%25,5</text>
  <text x="649.5" y="224.0" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--bg)">öge bazlı</text>
  <text x="649.5" y="240.0" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--bg)">%13,5</text>
  <line x1="688.8" y1="122" x2="456.0" y2="206" stroke="var(--text-faint)" stroke-dasharray="4 4" />
  <line x1="689.8" y1="122" x2="609.0" y2="206" stroke="var(--text-faint)" stroke-dasharray="4 4" />
  <text x="420.0" y="160.0" font-size="13" font-weight="bold" text-anchor="end" fill="var(--accent)">binde iki, sürenin yüzde 39'una yayılıyor</text>
  <text x="20.0" y="280.0" font-size="13" fill="var(--text)">Birim işlem başına: (39 ÷ 0,20) ÷ (61 ÷ 99,80) = 195 ÷ 0,611, yaklaşık 319 kat.</text>
  <text x="20.0" y="304.0" font-size="13" fill="var(--text)">İki sebep: taşınan bayt (yinelemenin %37'si bellekle sınırlı işlemlerde)</text>
  <text x="20.0" y="324.0" font-size="13" fill="var(--text)">ve koşturan birim (matris çarpımı verimi ötekilerin 16 katına kadar).</text>
  <text x="20.0" y="354.0" font-size="13" fill="var(--text-faint)">Yüzdeler Ivanov ve arkadaşlarından, 16 kat Dao'dan; 319 kat bizim hesabımızdır.</text>
</svg>
