<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-label="Üç bölmeli şema. Üstte yönlendirme akışı: token vektörü kapı ağına girer, kapı ağı uzmanlara puan verir, en yüksek puanlı iki uzman çalıştırılır ve çıktıları kapı puanlarıyla ağırlıklı toplanır; dört uzman kutusundan ikisi çalışıyor, ikisi boşta. Ortada dengesizlik döngüsü: birkaç uzman sürekli seçilir, daha çok eğitilir, daha iyi olur, daha çok seçilir; kalan uzmanlar ölü kalır. Altta üç önlem ve bedelleri: yük dengeleme kaybı dengesizliği cezalandıran ek bir terimdir ve asıl hedefle yarışır; kapasite sınırı uzman başına en fazla token sayısını belirler, aşan token'lar katmanı atlayarak geçer ve bedel düşen token olarak ödenir; atamayı tersine çevirmek, yani uzmanların token seçmesi, dengeyi yardımcı kayba gerek kalmadan garanti eder ve 8 milyar çalışan parametreli 64 uzmanlı bir modelde yakınsamayı iki kattan fazla hızlandırır.">
  <text x="20" y="24" font-size="13" font-weight="bold" fill="var(--text)">yönlendirme akışı</text>

  <rect x="20" y="36" width="110" height="44" fill="var(--surface-muted)" />
  <text x="30" y="63" font-size="13" fill="var(--text)">token vektörü</text>
  <rect x="160" y="36" width="100" height="44" fill="var(--surface-muted)" />
  <text x="170" y="63" font-size="13" fill="var(--text)">kapı ağı</text>

  <rect x="300" y="26" width="150" height="28" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="310" y="45" font-size="13" fill="var(--text)">uzman 1 — çalışır</text>
  <rect x="300" y="60" width="150" height="28" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="310" y="79" font-size="13" fill="var(--text)">uzman 2 — çalışır</text>
  <rect x="470" y="26" width="150" height="28" fill="var(--bg)" stroke="var(--border)" />
  <text x="480" y="45" font-size="13" fill="var(--text-faint)">uzman 3 — boşta</text>
  <rect x="470" y="60" width="150" height="28" fill="var(--bg)" stroke="var(--border)" />
  <text x="480" y="79" font-size="13" fill="var(--text-faint)">uzman 4 — boşta</text>

  <line x1="132" y1="58" x2="146" y2="58" stroke="var(--accent)" />
  <path d="M152 58 L144 54 L144 62 Z" fill="var(--accent)" />
  <line x1="262" y1="58" x2="286" y2="58" stroke="var(--accent)" />
  <path d="M292 58 L284 54 L284 62 Z" fill="var(--accent)" />

  <text x="20" y="106" font-size="13" fill="var(--text-muted)">Çıktı: seçilen uzmanların çıktılarının kapı puanlarıyla ağırlıklı toplamı.</text>
  <line x1="20" y1="122" x2="700" y2="122" stroke="var(--border)" />

  <text x="20" y="146" font-size="13" font-weight="bold" fill="var(--text)">dengesizlik döngüsü</text>
  <text x="20" y="170" font-size="13" fill="var(--accent)">birkaç uzman sürekli seçilir → daha çok eğitilir → daha iyi olur →</text>
  <text x="20" y="190" font-size="13" fill="var(--accent)">daha çok seçilir. Kalan uzmanlar ölü kalır.</text>
  <line x1="20" y1="206" x2="700" y2="206" stroke="var(--border)" />

  <text x="20" y="230" font-size="13" font-weight="bold" fill="var(--text)">üç önlem ve bedeli</text>
  <text x="20" y="254" font-size="13" fill="var(--text)">yük dengeleme kaybı:</text>
  <text x="250" y="254" font-size="13" fill="var(--text-muted)">ek terim; asıl hedefle yarışır</text>
  <text x="20" y="278" font-size="13" fill="var(--text)">kapasite sınırı:</text>
  <text x="250" y="278" font-size="13" fill="var(--text-muted)">aşan token katmanı atlar</text>
  <text x="250" y="296" font-size="13" fill="var(--text-muted)">— bedel düşen token'dır</text>
  <text x="20" y="320" font-size="13" fill="var(--text)">atamayı tersine çevirmek:</text>
  <text x="250" y="320" font-size="13" fill="var(--cool)">denge garanti; 8 milyar çalışan / 64 uzmanda</text>
  <text x="250" y="338" font-size="13" fill="var(--cool)">yakınsama iki kattan fazla hızlanıyor</text>
</svg>
