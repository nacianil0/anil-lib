  <text x="360" y="278" font-size="13" text-anchor="middle" fill="var(--text-muted)">deneme sayısı</text>

  <line x1="16" y1="294" x2="704" y2="294" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="316" font-size="13" text-anchor="start" fill="var(--text-muted)">tek denemede eğitilmiş model açık ara önde; deneme sayısı büyüyünce temel model geçiyor</text>
