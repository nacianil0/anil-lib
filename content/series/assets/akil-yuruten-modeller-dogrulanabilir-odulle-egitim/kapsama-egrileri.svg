  <line x1="190" y1="44" x2="214" y2="44" stroke="var(--accent)" stroke-width="2"/>
  <text x="222" y="49" font-size="13" text-anchor="start" fill="var(--accent)">pekiştirmeli öğrenmeden geçmiş</text>

  <line x1="70" y1="66" x2="70" y2="240" stroke="var(--border)" stroke-width="1"/>
  <line x1="70" y1="240" x2="660" y2="240" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="76" font-size="13" text-anchor="start" fill="var(--text-faint)">kapsama</text>

  <path d="M 84 228 C 200 190, 330 140, 460 100 S 600 74, 648 66" fill="none" stroke="var(--cool)" stroke-width="2"/>
  <path d="M 84 190 C 170 130, 250 108, 360 100 L 648 96" fill="none" stroke="var(--accent)" stroke-width="2"/>

  <polygon points="452,100 458,106 452,112 446,106" fill="var(--text)"/>
