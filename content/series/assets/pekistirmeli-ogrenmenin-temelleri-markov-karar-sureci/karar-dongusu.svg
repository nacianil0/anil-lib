<svg viewBox="0 0 720 326" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Durum, eylem, ödül ve yeni durum</text>

  <rect x="60" y="70" width="200" height="64" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="160" y="96" font-size="13" text-anchor="middle" fill="var(--text)">karar veren birim</text>
  <text x="160" y="118" font-size="13" text-anchor="middle" fill="var(--text-muted)">politika</text>

  <rect x="460" y="70" width="200" height="64" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="560" y="96" font-size="13" text-anchor="middle" fill="var(--text)">çevre</text>
  <text x="560" y="118" font-size="13" text-anchor="middle" fill="var(--text-muted)">durumu günceller</text>

  <line x1="260" y1="102" x2="446" y2="102" stroke="var(--accent)" stroke-width="1"/>
  <polygon points="452,102 444,98 444,106" fill="var(--accent)"/>
  <text x="356" y="94" font-size="13" text-anchor="middle" fill="var(--accent)">eylem</text>

  <line x1="560" y1="134" x2="560" y2="180" stroke="var(--cool)" stroke-width="1"/>
  <line x1="560" y1="180" x2="160" y2="180" stroke="var(--cool)" stroke-width="1"/>
  <line x1="160" y1="180" x2="160" y2="140" stroke="var(--cool)" stroke-width="1"/>
  <polygon points="160,134 156,142 164,142" fill="var(--cool)"/>
  <text x="300" y="172" font-size="13" text-anchor="middle" fill="var(--cool)">ödül</text>
  <text x="430" y="172" font-size="13" text-anchor="middle" fill="var(--cool)">yeni durum</text>

  <line x1="60" y1="230" x2="660" y2="230" stroke="var(--border)" stroke-width="1"/>
  <line x1="100" y1="224" x2="100" y2="236" stroke="var(--border)" stroke-width="1"/>
  <line x1="220" y1="224" x2="220" y2="236" stroke="var(--border)" stroke-width="1"/>
  <line x1="340" y1="224" x2="340" y2="236" stroke="var(--border)" stroke-width="1"/>
  <line x1="470" y1="224" x2="470" y2="236" stroke="var(--border)" stroke-width="1"/>
  <line x1="600" y1="224" x2="600" y2="236" stroke="var(--border)" stroke-width="1"/>
  <text x="100" y="254" font-size="13" text-anchor="middle" fill="var(--text-muted)">durum</text>
  <text x="220" y="254" font-size="13" text-anchor="middle" fill="var(--text-muted)">eylem</text>
  <text x="340" y="254" font-size="13" text-anchor="middle" fill="var(--text-muted)">ödül</text>
  <text x="470" y="254" font-size="13" text-anchor="middle" fill="var(--text-muted)">yeni durum</text>
  <text x="600" y="254" font-size="13" text-anchor="middle" fill="var(--text-muted)">yeni eylem</text>

  <line x1="16" y1="284" x2="704" y2="284" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="308" font-size="13" text-anchor="start" fill="var(--text-muted)">13. makaledeki ödül döngüsü bunun özel hâliydi: politika karar veren birim, ödül modeli kaynak</text>
</svg>
