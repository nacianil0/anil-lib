  <text x="407" y="88" font-size="13" text-anchor="middle" fill="var(--text)">yeniden</text>
  <text x="407" y="104" font-size="13" text-anchor="middle" fill="var(--text)">sırala</text>
  <text x="407" y="134" font-size="13" text-anchor="middle" fill="var(--text-muted)">aday sayısı</text>
  <line x1="456" y1="92" x2="470" y2="92" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-44-hat)"/>

  <rect x="472" y="70" width="98" height="44" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="521" y="88" font-size="13" text-anchor="middle" fill="var(--text)">yeniden</text>
  <text x="521" y="104" font-size="13" text-anchor="middle" fill="var(--text)">paketle</text>
  <text x="521" y="134" font-size="13" text-anchor="middle" fill="var(--text-muted)">en ilgili</text>
  <text x="521" y="150" font-size="13" text-anchor="middle" fill="var(--text-muted)">en sona</text>
  <line x1="570" y1="92" x2="584" y2="92" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-44-hat)"/>

  <rect x="586" y="70" width="118" height="44" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="645" y="88" font-size="13" text-anchor="middle" fill="var(--text)">sıkıştır, sonra</text>
  <text x="645" y="104" font-size="13" text-anchor="middle" fill="var(--text)">isteme koy</text>
  <text x="645" y="134" font-size="13" text-anchor="middle" fill="var(--text-muted)">boş</text>
  <text x="645" y="150" font-size="13" text-anchor="middle" fill="var(--text-muted)">dönebilir</text>

  <line x1="16" y1="176" x2="704" y2="176" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="200" font-size="13" text-anchor="start" fill="var(--text-faint)">beş görevde ortalama puan ve sorgu başına gecikme</text>

  <text x="16" y="230" font-size="13" text-anchor="start" fill="var(--text-muted)">getirmesiz model</text>
  <rect x="250" y="218" width="175" height="14" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="500" y="230" font-size="13" text-anchor="start" fill="var(--text)">0,351 · 1,27 sn</text>

  <text x="16" y="260" font-size="13" text-anchor="start" fill="var(--text-muted)">tam hat, varsayımsal belgesiz</text>
  <rect x="250" y="248" width="214" height="14" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="500" y="260" font-size="13" text-anchor="start" fill="var(--text)">0,429 · 1,45 sn</text>

  <text x="16" y="290" font-size="13" text-anchor="start" fill="var(--text-muted)">tam hat, varsayımsal belgeyle</text>
  <rect x="250" y="278" width="223" height="14" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="500" y="290" font-size="13" text-anchor="start" fill="var(--text)">0,446 · 11,7 sn</text>

  <line x1="16" y1="316" x2="704" y2="316" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="340" font-size="13" text-anchor="start" fill="var(--text-muted)">son 0,017 puan, sorgu başına bir büyük dil modeli çağrısı: gecikme yaklaşık sekiz kat</text>
  <text x="16" y="362" font-size="13" text-anchor="start" fill="var(--text-faint)">hattan önce bir sınıflandırıcı, getirme gerekmeyen soruyu hattı hiç çalıştırmadan cevaplatır</text>
