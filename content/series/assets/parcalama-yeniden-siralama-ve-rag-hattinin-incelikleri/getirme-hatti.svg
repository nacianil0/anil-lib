  <text x="179" y="88" font-size="13" text-anchor="middle" fill="var(--text)">sorguyu</text>
  <text x="179" y="104" font-size="13" text-anchor="middle" fill="var(--text)">yeniden yaz</text>
  <text x="179" y="134" font-size="13" text-anchor="middle" fill="var(--text-muted)">varsayımsal</text>
  <text x="179" y="150" font-size="13" text-anchor="middle" fill="var(--text-muted)">belge</text>
  <line x1="228" y1="92" x2="242" y2="92" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-44-hat)"/>

  <rect x="244" y="70" width="98" height="44" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="293" y="88" font-size="13" text-anchor="middle" fill="var(--text)">melez</text>
  <text x="293" y="104" font-size="13" text-anchor="middle" fill="var(--text)">getirme</text>
  <text x="293" y="134" font-size="13" text-anchor="middle" fill="var(--text-muted)">sözcük +</text>
  <text x="293" y="150" font-size="13" text-anchor="middle" fill="var(--text-muted)">vektör</text>
  <line x1="342" y1="92" x2="356" y2="92" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-44-hat)"/>

