    </marker>
  </defs>
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Beş karar, bir hat: her düğme ve bedeli</text>
  <text x="16" y="46" font-size="13" text-anchor="start" fill="var(--text-faint)">üst sıra hattın aşamaları, her kutunun altında o aşamanın düğmesi</text>

  <rect x="16" y="70" width="98" height="44" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="65" y="96" font-size="13" text-anchor="middle" fill="var(--text)">parçalama</text>
  <text x="65" y="134" font-size="13" text-anchor="middle" fill="var(--text-muted)">birim</text>
  <text x="65" y="150" font-size="13" text-anchor="middle" fill="var(--text-muted)">büyüklüğü</text>
  <line x1="114" y1="92" x2="128" y2="92" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-44-hat)"/>

