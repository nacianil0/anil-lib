<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" role="img" aria-label="Logaritmik iki eksenli bir çatı çizgisi. Yatay eksen işlem yoğunluğu, 1'den 100.000 işlem/bayta; dikey eksen ulaşılabilir hız, 1'den 1.000 TFLOP/s'ye. Çatı, solda bant genişliğiyle sınırlı eğik bir koldan 208 işlem/baytlık sırt noktasında 312 TFLOP/s'lik düz tavana döner. Eğik kolda üç üretim noktası durur: yığın 1, yığın 32 ve sırt noktasının hemen sağında yığın 256. Düz tavanda iki eğitim noktası durur: 1 çarpı 2.048 ve 4 çarpı 8.192. Altta: yığın 1 ve 32'nin hızını bant belirler, yığın 256 sırtı ancak geçer, eğitim noktalarının hızını hesap belirler; yığın 32 ile 4 çarpı 8.192 arasındaki yoğunluk farkı 1.024 kattır; hesap yalnızca ağırlıkla yapılan çarpımlar içindir. Kayıt: çizgi, noktalar ve 312 bölü 1,5 eşittir 208 bizim hesabımızdır.">
  <text x="20.0" y="30.0" font-size="13" fill="var(--text)">Aynı çip, sırt noktasının iki yanı: A100 çatı çizgisi</text>
  <line x1="20" y1="42" x2="700" y2="42" stroke="var(--border)" />
  <text x="20.0" y="60.0" font-size="13" fill="var(--text-muted)">ulaşılabilir hız, TFLOP/s (logaritmik)</text>
  <line x1="90.0" y1="330.0" x2="680.0" y2="330.0" stroke="var(--border)" />
  <line x1="90.0" y1="330.0" x2="90.0" y2="70.0" stroke="var(--border)" />
  <line x1="90.0" y1="330.0" x2="90.0" y2="335.0" stroke="var(--text-faint)" />
  <text x="90.0" y="350.0" font-size="13" text-anchor="middle" fill="var(--text-muted)">1</text>
  <line x1="208.0" y1="330.0" x2="208.0" y2="335.0" stroke="var(--text-faint)" />
  <text x="208.0" y="350.0" font-size="13" text-anchor="middle" fill="var(--text-muted)">10</text>
  <line x1="326.0" y1="330.0" x2="326.0" y2="335.0" stroke="var(--text-faint)" />
  <text x="326.0" y="350.0" font-size="13" text-anchor="middle" fill="var(--text-muted)">100</text>
  <line x1="444.0" y1="330.0" x2="444.0" y2="335.0" stroke="var(--text-faint)" />
  <text x="444.0" y="350.0" font-size="13" text-anchor="middle" fill="var(--text-muted)">1.000</text>
  <line x1="562.0" y1="330.0" x2="562.0" y2="335.0" stroke="var(--text-faint)" />
  <text x="562.0" y="350.0" font-size="13" text-anchor="middle" fill="var(--text-muted)">10.000</text>
  <line x1="680.0" y1="330.0" x2="680.0" y2="335.0" stroke="var(--text-faint)" />
  <text x="680.0" y="350.0" font-size="13" text-anchor="middle" fill="var(--text-muted)">100.000</text>
  <line x1="85.0" y1="330.0" x2="90.0" y2="330.0" stroke="var(--text-faint)" />
  <text x="81.0" y="334.0" font-size="13" text-anchor="end" fill="var(--text-muted)">1</text>
  <line x1="85.0" y1="243.3" x2="90.0" y2="243.3" stroke="var(--text-faint)" />
  <text x="81.0" y="247.3" font-size="13" text-anchor="end" fill="var(--text-muted)">10</text>
  <line x1="85.0" y1="156.7" x2="90.0" y2="156.7" stroke="var(--text-faint)" />
  <text x="81.0" y="160.7" font-size="13" text-anchor="end" fill="var(--text-muted)">100</text>
  <line x1="85.0" y1="70.0" x2="90.0" y2="70.0" stroke="var(--text-faint)" />
  <text x="81.0" y="74.0" font-size="13" text-anchor="end" fill="var(--text-muted)">1.000</text>
  <text x="90.0" y="372.0" font-size="13" fill="var(--text-muted)">işlem yoğunluğu, işlem/bayt (logaritmik)</text>
  <polyline points="90.0,314.7 363.5,113.8 680.0,113.8" fill="none" stroke="var(--text)" stroke-width="2" />
  <line x1="363.5" y1="113.8" x2="363.5" y2="330.0" stroke="var(--text-faint)" stroke-dasharray="4 4" />
  <text x="371.5" y="320.0" font-size="13" fill="var(--text-muted)">sırt noktası: 208 işlem/bayt</text>
  <text x="455.0" y="80.0" font-size="13" fill="var(--text-muted)">hesapla sınırlı, tepe 312 TFLOP/s</text>
  <text x="100.0" y="150.0" font-size="13" fill="var(--text-muted)">bant genişliğiyle sınırlı</text>
  <circle cx="90.0" cy="314.7" r="5" fill="var(--cool)" />
  <text x="104.0" y="322.0" font-size="13" font-weight="bold" fill="var(--cool)">üretim, yığın 1</text>
  <circle cx="267.6" cy="184.3" r="5" fill="var(--cool)" />
  <text x="276.6" y="204.3" font-size="13" font-weight="bold" fill="var(--cool)">üretim, yığın 32</text>
  <circle cx="374.2" cy="113.8" r="5" fill="var(--cool)" />
  <text x="382.2" y="139.8" font-size="13" font-weight="bold" fill="var(--cool)">üretim, yığın 256</text>
  <circle cx="480.7" cy="113.8" r="5" fill="var(--accent)" />
  <text x="480.7" y="101.8" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--accent)">eğitim, 1 × 2.048</text>
  <circle cx="622.8" cy="113.8" r="5" fill="var(--accent)" />
  <text x="682.8" y="101.8" font-size="13" font-weight="bold" text-anchor="end" fill="var(--accent)">eğitim, 4 × 8.192</text>
  <text x="20.0" y="402.0" font-size="13" fill="var(--text)">Yığın 1 ve 32 eğik kolda, hızlarını bant belirliyor; yığın 256 sırtı ancak geçiyor.</text>
  <text x="20.0" y="422.0" font-size="13" fill="var(--text)">Eğitim noktaları tavanda, hızlarını hesap belirliyor. Yığın 32 ile 4 × 8.192 arası 1.024 kat.</text>
  <text x="20.0" y="444.0" font-size="13" fill="var(--text-muted)">Sınır: yalnızca ağırlıkla yapılan çarpımlar; dikkat işleminin kendisi ayrı davranır.</text>
  <text x="20.0" y="472.0" font-size="13" fill="var(--text-faint)">Tepe hız ve bant A100 değerleridir; çizgi, noktalar ve 312 ÷ 1,5 = 208 bizim hesabımızdır.</text>
</svg>
