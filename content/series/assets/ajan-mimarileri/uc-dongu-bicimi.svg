<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Üç karar biçimi yan yana: her adımda karar veren döngü, önce plan yazıp adımları sırayla yürüten düzen ve başarısızlıkta alt görevlere bölüp yeniden deneyen gerektiğinde ayrıştırma.">
  <defs>
    <marker id="ok-52-akis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)" />
    </marker>
    <marker id="ok-52-donus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cool)" />
    </marker>
  </defs>

  <text x="16" y="40" font-size="13" font-weight="bold" fill="var(--text)">her adımda karar</text>
  <rect x="40" y="70" width="80" height="30" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="80" y="89" font-size="13" text-anchor="middle" fill="var(--text)">gözlem</text>
  <line x1="80" y1="100" x2="80" y2="116" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <rect x="40" y="118" width="80" height="30" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="80" y="137" font-size="13" text-anchor="middle" fill="var(--text)">model</text>
  <line x1="80" y1="148" x2="80" y2="164" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <rect x="40" y="166" width="80" height="30" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="80" y="185" font-size="13" text-anchor="middle" fill="var(--text)">tek eylem</text>
  <line x1="80" y1="196" x2="80" y2="212" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <rect x="40" y="214" width="80" height="30" rx="5" fill="var(--cool-soft)" stroke="var(--cool)" />
  <text x="80" y="233" font-size="13" text-anchor="middle" fill="var(--text)">çevre</text>
  <line x1="120" y1="229" x2="156" y2="229" stroke="var(--cool)" stroke-width="1.2" />
  <line x1="156" y1="229" x2="156" y2="85" stroke="var(--cool)" stroke-width="1.2" />
  <line x1="156" y1="85" x2="122" y2="85" stroke="var(--cool)" stroke-width="1.2" marker-end="url(#ok-52-donus)" />
  <text x="164" y="160" font-size="13" fill="var(--cool)">yeni</text>
  <text x="164" y="178" font-size="13" fill="var(--cool)">gözlem</text>
  <text x="16" y="272" font-size="13" fill="var(--text-muted)">plan yok; düşünce</text>
  <text x="16" y="290" font-size="13" fill="var(--text-muted)">satırlarında örtük</text>

  <line x1="244" y1="24" x2="244" y2="300" stroke="var(--border)" stroke-dasharray="3 3" />

  <text x="252" y="40" font-size="13" font-weight="bold" fill="var(--text)">önce plan, sonra yürütme</text>
  <rect x="270" y="62" width="120" height="30" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="330" y="81" font-size="13" text-anchor="middle" fill="var(--text)">plan: 1, 2, 3</text>
  <line x1="310" y1="92" x2="310" y2="116" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <rect x="270" y="118" width="80" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="310" y="136" font-size="13" text-anchor="middle" fill="var(--text)">adım 1</text>
  <line x1="310" y1="146" x2="310" y2="164" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <rect x="270" y="166" width="80" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="310" y="184" font-size="13" text-anchor="middle" fill="var(--text)">adım 2</text>
  <line x1="310" y1="194" x2="310" y2="212" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <rect x="270" y="214" width="80" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="310" y="232" font-size="13" text-anchor="middle" fill="var(--text)">adım 3</text>
  <rect x="384" y="118" width="70" height="124" rx="5" fill="var(--cool-soft)" stroke="var(--cool)" />
  <text x="419" y="184" font-size="13" text-anchor="middle" fill="var(--text)">çevre</text>
  <line x1="350" y1="132" x2="382" y2="132" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <line x1="350" y1="180" x2="382" y2="180" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <line x1="350" y1="228" x2="382" y2="228" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <text x="252" y="272" font-size="13" fill="var(--text-muted)">plan bir kez yazılır;</text>
  <text x="252" y="290" font-size="13" fill="var(--text-muted)">plana geri dönüş yok</text>

  <line x1="480" y1="24" x2="480" y2="300" stroke="var(--border)" stroke-dasharray="3 3" />

  <text x="488" y="40" font-size="13" font-weight="bold" fill="var(--text)">gerektiğinde ayrıştırma</text>
  <rect x="500" y="62" width="80" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="540" y="80" font-size="13" text-anchor="middle" fill="var(--text)">görev</text>
  <line x1="540" y1="90" x2="540" y2="104" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <rect x="500" y="106" width="80" height="28" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="540" y="124" font-size="13" text-anchor="middle" fill="var(--text)">dene</text>
  <line x1="580" y1="120" x2="622" y2="120" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <text x="601" y="112" font-size="13" text-anchor="middle" fill="var(--text-muted)">olur</text>
  <rect x="624" y="106" width="72" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="660" y="124" font-size="13" text-anchor="middle" fill="var(--text)">bitti</text>
  <line x1="540" y1="134" x2="540" y2="158" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <text x="548" y="151" font-size="13" fill="var(--text-muted)">olmaz</text>
  <rect x="500" y="160" width="80" height="28" rx="5" fill="var(--cool-soft)" stroke="var(--cool)" />
  <text x="540" y="178" font-size="13" text-anchor="middle" fill="var(--text)">böl</text>
  <line x1="526" y1="188" x2="526" y2="206" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <line x1="554" y1="188" x2="614" y2="206" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-52-akis)" />
  <rect x="488" y="208" width="76" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="526" y="226" font-size="13" text-anchor="middle" fill="var(--text)">alt görev</text>
  <rect x="576" y="208" width="76" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="614" y="226" font-size="13" text-anchor="middle" fill="var(--text)">alt görev</text>
  <line x1="500" y1="236" x2="500" y2="252" stroke="var(--cool)" stroke-width="1.2" />
  <line x1="500" y1="252" x2="492" y2="252" stroke="var(--cool)" stroke-width="1.2" />
  <line x1="492" y1="252" x2="492" y2="120" stroke="var(--cool)" stroke-width="1.2" />
  <line x1="492" y1="120" x2="498" y2="120" stroke="var(--cool)" stroke-width="1.2" marker-end="url(#ok-52-donus)" />
  <text x="660" y="196" font-size="13" text-anchor="middle" fill="var(--text-muted)">en çok 3–4 kat</text>
  <text x="488" y="272" font-size="13" fill="var(--text-muted)">bölme bir tasarım kararı</text>
  <text x="488" y="290" font-size="13" fill="var(--text-muted)">değil, başarısızlık cevabı</text>

  <line x1="16" y1="306" x2="704" y2="306" stroke="var(--border)" />
  <text x="16" y="328" font-size="13" fill="var(--text-muted)">Üç biçim aynı döngü; fark, planın ne zaman ve neye göre yazıldığında.</text>
</svg>
