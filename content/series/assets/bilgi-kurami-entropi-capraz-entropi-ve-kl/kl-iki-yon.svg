  <text x="112" y="160" font-size="13" fill="var(--text-muted)">p</text>
  <text x="185" y="194" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--accent)">q</text>
  <text x="462" y="160" font-size="13" fill="var(--text-muted)">p</text>
  <text x="612" y="100" font-size="13" font-weight="bold" fill="var(--accent)">q</text>

  <text x="185" y="274" font-size="13" text-anchor="middle" fill="var(--text-muted)">q, p'nin boş vadisine de kütle koyar</text>
  <text x="535" y="274" font-size="13" text-anchor="middle" fill="var(--text-muted)">q bir tepeye yerleşir, öbürünü ihmal eder</text>

  <line x1="20" y1="292" x2="700" y2="292" stroke="var(--border)" />
  <text x="20" y="314" font-size="13" fill="var(--text)">İleri yön: p'nin kütle koyduğu yerde q sıfıra inemez; inerse logaritma patlar.</text>
  <text x="20" y="334" font-size="13" fill="var(--text)">Ters yön: q'nun kütle koyduğu yerde p küçük olmamalı; q tek tepede güvenle durur.</text>
  <text x="20" y="358" font-size="13" fill="var(--text-faint)">Eğriler hesaplandı: p, tepeleri −2 ve +2'de duran iki eşit Gauss'un karışımı;</text>
  <text x="20" y="376" font-size="13" fill="var(--text-faint)">q, her yönde KL'yi en küçük yapan tek Gauss (ters yönde iki tepe eşit iyi çözümdür).</text>
</svg>
