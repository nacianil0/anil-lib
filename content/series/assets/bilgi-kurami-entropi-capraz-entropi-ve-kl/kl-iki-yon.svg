<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-label="İki panelli şekil; iki panelde de aynı gerçek dağılım p çizilidir: tepeleri eksi 2 ve artı 2'de duran, aralarında boş bir vadi bulunan iki tepeli bir eğri. Sol panel ileri yön, p'den q'ya KL: en uygun tek tepeli q geniş ve basık bir eğridir, iki tepeyi de örter ve p'nin neredeyse hiç kütle koymadığı ortadaki vadiye de kütle koyar. Sağ panel ters yön, q'dan p'ye KL: en uygun q dar bir eğridir, tepelerden birinin tam üstüne oturur ve öbür tepeyi tümüyle ihmal eder. Altta iki kayıt: ileri yönde q, p'nin kütle koyduğu hiçbir yerde sıfıra inemez; ters yönde q'nun kütle koyduğu yerde p küçük olmamalıdır. En altta eğrilerin hesaplandığı yazılıdır: p iki eşit Gauss'un karışımı, q her yönde KL'yi en küçük yapan tek Gauss.">
  <text x="40" y="28" font-size="13" font-weight="bold" fill="var(--text)">ileri yön: p'den q'ya — kütleyi örter</text>
  <text x="390" y="28" font-size="13" font-weight="bold" fill="var(--text)">ters yön: q'dan p'ye — tepe arar</text>

  <line x1="40" y1="250" x2="330" y2="250" stroke="var(--border)" />
  <line x1="390" y1="250" x2="680" y2="250" stroke="var(--border)" />

