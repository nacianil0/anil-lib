<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" role="img" aria-label="Dört satır ve üç sütunluk tablo; sütunlar sızıntı yolu, ölçülmüş örnek ve tespit. Birebir kopya: veritabanında 317 test kümesi olayı, web derleminde hedef metinlerin yüzde 1,87 ile 24,88'i; tespit n-gram ya da alt dizi taraması, 13-gram, 50 karakter, 8-gram. Yeniden yazım ve çeviri: yeniden yazılmış test kümesiyle eğitilen 13 milyarlık model 85,9; tespit n-gram kaçırır, dil modeliyle arındırma. Dolaylı sızıntı ve görev kirliliği: 255 makalenin yüzde 42'si arayüzden 4,7 milyon örnek; kesim tarihinden önceki kümelerde daha iyi; tespit kesim tarihi karşılaştırması. Çözüm sızıntısı: 82 yama; kod ölçütlerinde çözümü görülen alt kümede daha yüksek; tespit yayın tarihi süzgeci ve canlı ölçüt. Altta kara kutu tespiti: yönlendirmeli tamamlama yüzde 92 ile 100, sıra değiştirilebilirlik testi, eksik şık tahmini yüzde 57, en düşük olasılıklı token testi 0,72.">
  <text x="20" y="28" font-size="13" font-weight="bold" fill="var(--text)">sızıntı yolu</text>
  <text x="200" y="28" font-size="13" font-weight="bold" fill="var(--text)">ölçülmüş örnek</text>
  <text x="480" y="28" font-size="13" font-weight="bold" fill="var(--text)">tespit</text>
  <line x1="20" y1="38" x2="700" y2="38" stroke="var(--border)" />

  <rect x="20" y="46" width="680" height="76" fill="var(--surface-muted)" />
  <text x="30" y="68" font-size="13" font-weight="bold" fill="var(--text)">1. birebir kopya</text>
  <text x="30" y="86" font-size="13" fill="var(--text-muted)">test kümesi derlemde</text>
  <text x="200" y="68" font-size="13" fill="var(--text)">veritabanında 317 test kümesi olayı;</text>
  <text x="200" y="86" font-size="13" fill="var(--text)">web derleminde hedef metinlerin</text>
  <text x="200" y="104" font-size="13" fill="var(--text)">%1,87–24,88'i birebir var</text>
  <text x="480" y="68" font-size="13" fill="var(--text)">derlemde n-gram / alt dizi</text>
  <text x="480" y="86" font-size="13" fill="var(--text)">taraması: 13-gram, 50 karakter,</text>
  <text x="480" y="104" font-size="13" fill="var(--text)">8-gram; sağlayıcı raporu</text>

  <rect x="20" y="130" width="680" height="76" fill="var(--accent-soft)" />
  <text x="30" y="152" font-size="13" font-weight="bold" fill="var(--text)">2. yeniden yazım</text>
  <text x="30" y="170" font-size="13" font-weight="bold" fill="var(--text)">ve çeviri</text>
  <text x="30" y="188" font-size="13" fill="var(--text-muted)">anlam aynı, n-gram sıfır</text>
  <text x="200" y="152" font-size="13" fill="var(--text)">yeniden yazılmış test kümesiyle</text>
  <text x="200" y="170" font-size="13" fill="var(--text)">eğitilen 13 milyarlık model</text>
  <text x="200" y="188" font-size="13" fill="var(--text)">en yaygın sınavda 85,9</text>
  <text x="480" y="152" font-size="13" fill="var(--text)">n-gram taraması kaçırır;</text>
  <text x="480" y="170" font-size="13" fill="var(--text)">embedding adayı + dil modeliyle</text>
  <text x="480" y="188" font-size="13" fill="var(--text)">"aynı soru mu" arındırması</text>

  <rect x="20" y="214" width="680" height="76" fill="var(--surface-muted)" />
  <text x="30" y="236" font-size="13" font-weight="bold" fill="var(--text)">3. dolaylı sızıntı,</text>
  <text x="30" y="254" font-size="13" font-weight="bold" fill="var(--text)">görev kirliliği</text>
  <text x="30" y="272" font-size="13" fill="var(--text-muted)">arayüzden ve görevden</text>
  <text x="200" y="236" font-size="13" fill="var(--text)">255 makalenin %42'si arayüzden</text>
  <text x="200" y="254" font-size="13" fill="var(--text)">4,7 milyon örnek gönderdi; kesim</text>
  <text x="200" y="272" font-size="13" fill="var(--text)">tarihinden önceki kümelerde daha iyi</text>
  <text x="480" y="236" font-size="13" fill="var(--text)">kesim tarihi karşılaştırması:</text>
  <text x="480" y="254" font-size="13" fill="var(--text)">tarihten önce ↔ sonra yayımlanan</text>
  <text x="480" y="272" font-size="13" fill="var(--text)">kümeler, aynı zorlukta</text>

  <rect x="20" y="298" width="680" height="76" fill="var(--surface-muted)" />
  <text x="30" y="320" font-size="13" font-weight="bold" fill="var(--text)">4. çözüm sızıntısı</text>
  <text x="30" y="338" font-size="13" fill="var(--text-muted)">cevap sorunun yanında</text>
  <text x="200" y="320" font-size="13" fill="var(--text)">sorun kaydında çözümü yazılı 82</text>
  <text x="200" y="338" font-size="13" fill="var(--text)">yama; kod ölçütlerinde çözümü</text>
  <text x="200" y="356" font-size="13" fill="var(--text)">görülen alt kümede daha yüksek puan</text>
  <text x="480" y="320" font-size="13" fill="var(--text)">yayın tarihi süzgeci;</text>
  <text x="480" y="338" font-size="13" fill="var(--text)">kesim tarihinden sonraki</text>
  <text x="480" y="356" font-size="13" fill="var(--text)">sorularla canlı ölçüt</text>

  <line x1="20" y1="384" x2="700" y2="384" stroke="var(--border)" />
  <text x="20" y="406" font-size="13" font-weight="bold" fill="var(--text)">kara kutuda, derleme bakmadan:</text>
  <text x="20" y="424" font-size="13" fill="var(--text)">yönlendirmeli tamamlama %92–100 · kanonik sıra tercihi (değiştirilebilirlik testi)</text>
  <text x="20" y="442" font-size="13" fill="var(--text)">silinen yanlış şıkkı tahmin %57 · en düşük olasılıklı token testi 0,72 eğri altı alan</text>
</svg>
