  <text x="356" y="120" font-size="14" text-anchor="middle" fill="var(--text)">Altı eğitim çifti</text>
  <text x="356" y="146" font-size="13" text-anchor="middle" fill="var(--text-muted)">A yeğlenir B'ye</text>
  <text x="356" y="168" font-size="13" text-anchor="middle" fill="var(--text-muted)">A yeğlenir C'ye</text>
  <text x="356" y="190" font-size="13" text-anchor="middle" fill="var(--text-muted)">A yeğlenir D'ye</text>
  <text x="356" y="212" font-size="13" text-anchor="middle" fill="var(--text-muted)">B yeğlenir C'ye</text>
  <text x="356" y="234" font-size="13" text-anchor="middle" fill="var(--text-muted)">B yeğlenir D'ye</text>
  <text x="356" y="256" font-size="13" text-anchor="middle" fill="var(--text-muted)">C yeğlenir D'ye</text>
  <text x="356" y="282" font-size="13" text-anchor="middle" fill="var(--text-faint)">tek sıralama, altı örnek</text>

  <line x1="456" y1="194" x2="510" y2="194" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#ok-13-tercih)"/>

