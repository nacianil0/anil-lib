  <text x="106" y="58" font-size="13" text-anchor="middle" fill="var(--text-muted)">model dört cevap üretir</text>

  <line x1="106" y1="66" x2="106" y2="92" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#ok-13-tercih)"/>

