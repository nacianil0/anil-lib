  <text x="620" y="122" font-size="14" text-anchor="middle" fill="var(--text)">Ödül modeli</text>
  <text x="620" y="148" font-size="13" text-anchor="middle" fill="var(--text-muted)">her cevaba tek bir sayı</text>
  <text x="620" y="182" font-size="14" text-anchor="middle" fill="var(--text)">A için 1,2</text>
  <text x="620" y="206" font-size="14" text-anchor="middle" fill="var(--text)">B için 0,4</text>
  <text x="620" y="244" font-size="13" text-anchor="middle" fill="var(--text-faint)">eğitim hedefi: yeğlenenin</text>
  <text x="620" y="264" font-size="13" text-anchor="middle" fill="var(--text-faint)">sayısı daha büyük olsun</text>

  <text x="16" y="320" font-size="13" text-anchor="start" fill="var(--text-faint)">insan hiçbir yerde cevap yazmaz; yalnızca sıralar</text>
