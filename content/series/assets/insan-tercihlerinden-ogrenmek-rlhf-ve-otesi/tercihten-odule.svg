<svg viewBox="0 0 740 336" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ok-13-tercih" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)"/>
    </marker>
  </defs>

  <rect x="16" y="20" width="180" height="46" rx="6" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
