  <rect x="16" y="148" width="180" height="40" rx="5" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="106" y="173" font-size="13" text-anchor="middle" fill="var(--text)">Cevap B · 2. sıra</text>
  <rect x="16" y="200" width="180" height="40" rx="5" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="106" y="225" font-size="13" text-anchor="middle" fill="var(--text)">Cevap C · 3. sıra</text>
  <rect x="16" y="252" width="180" height="40" rx="5" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="106" y="277" font-size="13" text-anchor="middle" fill="var(--text)">Cevap D · 4. sıra</text>

