<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Talimat hiyerarşisi eğitimi: dayanıklılık ve bedeli</text>

  <rect x="250" y="38" width="14" height="10" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="270" y="48" font-size="13" text-anchor="start" fill="var(--text-muted)">hiyerarşi eğitimi almamış</text>
  <rect x="456" y="38" width="14" height="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="476" y="48" font-size="13" text-anchor="start" fill="var(--accent)">hiyerarşi eğitiminden sonra</text>

  <text x="240" y="86" font-size="13" text-anchor="end" fill="var(--text-muted)">sistem istemini sızdırma</text>
  <rect x="250" y="68" width="131" height="14" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="389" y="79" font-size="13" text-anchor="start" fill="var(--text-muted)">32,8</text>
  <rect x="250" y="84" width="384" height="14" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="642" y="95" font-size="13" text-anchor="start" fill="var(--accent)">95,9</text>

  <text x="240" y="128" font-size="13" text-anchor="end" fill="var(--text-muted)">çelişen kullanıcı talimatı</text>
  <rect x="250" y="110" width="249" height="14" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="507" y="121" font-size="13" text-anchor="start" fill="var(--text-muted)">62,2</text>
  <rect x="250" y="126" width="370" height="14" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="628" y="137" font-size="13" text-anchor="start" fill="var(--accent)">92,6</text>

  <text x="240" y="170" font-size="13" text-anchor="end" fill="var(--text-muted)">talimat kaçırma</text>
  <rect x="250" y="152" width="237" height="14" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="495" y="163" font-size="13" text-anchor="start" fill="var(--text-muted)">59,2</text>
  <rect x="250" y="168" width="317" height="14" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="575" y="179" font-size="13" text-anchor="start" fill="var(--accent)">79,2</text>

  <text x="240" y="212" font-size="13" text-anchor="end" fill="var(--text-muted)">parola sızdırma oyunu</text>
  <rect x="250" y="194" width="207" height="14" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="465" y="205" font-size="13" text-anchor="start" fill="var(--text-muted)">51,8</text>
  <rect x="250" y="210" width="295" height="14" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="553" y="221" font-size="13" text-anchor="start" fill="var(--accent)">73,7</text>

  <line x1="16" y1="238" x2="704" y2="238" stroke="var(--border)" stroke-width="1"/>

  <text x="240" y="272" font-size="13" text-anchor="end" fill="var(--text-muted)">zararsız ama şüpheli istek</text>
  <rect x="250" y="254" width="332" height="14" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="590" y="265" font-size="13" text-anchor="start" fill="var(--text-muted)">83,1</text>
  <rect x="250" y="270" width="242" height="14" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="500" y="281" font-size="13" text-anchor="start" fill="var(--cool)">60,4</text>

  <text x="16" y="312" font-size="13" text-anchor="start" fill="var(--text-muted)">ilk dört satır saldırılara dayanıklılık; son satır zararsız isteklere uyma oranı</text>
  <text x="16" y="334" font-size="13" text-anchor="start" fill="var(--text-faint)">dördüncü satırdaki saldırı türü eğitim verisinde hiç yer almadı</text>
