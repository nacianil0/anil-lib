<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Modelin doğru bilme olasılığı yüzde 25 iken beklenen puan</text>

  <text x="16" y="62" font-size="13" text-anchor="start" fill="var(--text-muted)">yanlış cevap 0 puan</text>

  <text x="30" y="106" font-size="14" text-anchor="start" fill="var(--text)">tahmin et</text>
  <rect x="200" y="84" width="110" height="32" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="255" y="106" font-size="15" text-anchor="middle" fill="var(--accent)">0,25</text>

  <text x="30" y="156" font-size="14" text-anchor="start" fill="var(--text)">bilmiyorum de</text>
  <rect x="200" y="134" width="110" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="255" y="156" font-size="15" text-anchor="middle" fill="var(--text-muted)">0</text>

  <text x="30" y="204" font-size="13" text-anchor="start" fill="var(--accent)">tahmin susmayı yener</text>

  <line x1="352" y1="48" x2="352" y2="220" stroke="var(--border)" stroke-width="1"/>

  <text x="384" y="62" font-size="13" text-anchor="start" fill="var(--text-muted)">yanlış cevap 1/3 puan götürür</text>

  <text x="398" y="106" font-size="14" text-anchor="start" fill="var(--text)">tahmin et</text>
  <rect x="568" y="84" width="110" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="623" y="106" font-size="15" text-anchor="middle" fill="var(--text)">0</text>

  <text x="398" y="156" font-size="14" text-anchor="start" fill="var(--text)">bilmiyorum de</text>
  <rect x="568" y="134" width="110" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="623" y="156" font-size="15" text-anchor="middle" fill="var(--text)">0</text>

  <text x="398" y="204" font-size="13" text-anchor="start" fill="var(--cool)">eşitlenir; eşiğin altında susmak kârlı</text>

  <text x="16" y="262" font-size="13" text-anchor="start" fill="var(--text-faint)">model değişmedi, soru değişmedi; değişen tek şey puanlama kuralıdır</text>
</svg>
