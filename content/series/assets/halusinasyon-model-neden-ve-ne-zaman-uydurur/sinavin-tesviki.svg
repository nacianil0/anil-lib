<svg viewBox="0 0 720 356" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="24" font-size="14" text-anchor="start" fill="var(--text)">Tahmin etmenin beklenen puanı, iki puanlama kuralında</text>

  <path d="M 100,200 L 235,200 L 100,246.7 Z" fill="var(--cool-soft)" stroke="none"/>

  <line x1="100" y1="50" x2="100" y2="262" stroke="var(--border)" stroke-width="1"/>
  <line x1="100" y1="262" x2="648" y2="262" stroke="var(--border)" stroke-width="1"/>
  <text x="92" y="64" font-size="13" text-anchor="end" fill="var(--text-muted)">1</text>
  <text x="92" y="204" font-size="13" text-anchor="end" fill="var(--text-muted)">0</text>
  <text x="92" y="251" font-size="13" text-anchor="end" fill="var(--text-muted)">−1/3</text>

  <line x1="100" y1="200" x2="640" y2="200" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="640" y="220" font-size="13" text-anchor="end" fill="var(--text-muted)">bilmiyorum de: her durumda 0</text>

  <line x1="100" y1="200" x2="640" y2="60" stroke="var(--accent)" stroke-width="2"/>
  <text x="260" y="104" font-size="13" text-anchor="start" fill="var(--accent)">yanlış cevap 0 puan</text>

  <line x1="100" y1="246.7" x2="640" y2="60" stroke="var(--cool)" stroke-width="2"/>
  <text x="440" y="176" font-size="13" text-anchor="start" fill="var(--cool)">yanlış cevap 1/3 puan götürür</text>

  <line x1="235" y1="56" x2="235" y2="262" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="241" y="72" font-size="13" text-anchor="start" fill="var(--text-faint)">eşik: yüzde 25</text>
  <circle cx="235" cy="165" r="4" fill="var(--accent)"/>
  <text x="227" y="158" font-size="13" text-anchor="end" fill="var(--accent)">0,25</text>
  <circle cx="235" cy="200" r="4" fill="var(--cool)"/>

  <text x="100" y="280" font-size="13" text-anchor="middle" fill="var(--text-muted)">0</text>
  <text x="235" y="280" font-size="13" text-anchor="middle" fill="var(--text-muted)">0,25</text>
  <text x="640" y="280" font-size="13" text-anchor="middle" fill="var(--text-muted)">1</text>
  <text x="370" y="300" font-size="13" text-anchor="middle" fill="var(--text-muted)">modelin doğru bilme olasılığı</text>

  <text x="16" y="326" font-size="13" text-anchor="start" fill="var(--text-faint)">gölgeli bölge: ceza varken olasılık yüzde 25'in altındaysa susmak kârlıdır</text>
  <text x="16" y="346" font-size="13" text-anchor="start" fill="var(--text-faint)">ikili puanlamada tahmin, olasılık ne olursa olsun susmayı yener ya da eşitler</text>
</svg>
