<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Eğitim verisinde geçen olgular, geçiş sayısına göre</text>

  <rect x="60" y="64" width="480" height="44" rx="3" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="300" y="92" font-size="14" text-anchor="middle" fill="var(--text)">çok kez geçen olgular</text>
  <rect x="540" y="64" width="120" height="44" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="600" y="130" font-size="13" text-anchor="middle" fill="var(--accent)">tam bir kez geçen</text>

  <line x1="540" y1="140" x2="540" y2="176" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="660" y1="140" x2="660" y2="176" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="40" y="196" font-size="13" text-anchor="start" fill="var(--text-muted)">Good-Turing: iki genişlik kabaca eşittir</text>
  <line x1="316" y1="192" x2="530" y2="192" stroke="var(--text-muted)" stroke-width="1"/>

  <rect x="540" y="176" width="120" height="44" rx="3" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="590" y="242" font-size="13" text-anchor="middle" fill="var(--cool)">hiç geçmeyenlerin toplam olasılığı</text>

  <text x="16" y="284" font-size="13" text-anchor="start" fill="var(--text-faint)">kalibre bir model bu payı bir yere harcamak zorundadır; harcadığı yer kanıtı olmayan cevaplardır</text>
</svg>
