<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" role="img" aria-label="Üstte altı satırlı tablo; sütunlar ölçüt ve puan. Düzenlenen olgunun kendisi 99,8; aynı olgu başka sözcüklerle 88,1; öznenin başka adları 86,8; aynı ilişkinin öteki nesneleri 100; vurgulu satırda olgudan çıkan mantıksal sonuç 20,2; ağırlık düzenleyen yöntemlerin ortalaması 38,8 ile 71,4 arası. Altta üç kutu: sonuç taşınmıyor, cevap değişiyor ama inanç değişmiyor; birikince çöküyor, tutma oranı 100 ile 1.000 düzenleme arasında düşüyor ve devre dışı bırakanın izi yaklaşık 400 kat büyük; yer bilmek yetmiyor, iz sürmeyle bulunan yer ile düzenlenebildiği katman arasındaki bağıntı sıfıra yakın. En altta ilk iki satırın Meng, sonraki üçünün Cohen ve arkadaşlarının GPT-2 XL ölçümü, son satırın Cohen ve arkadaşlarının bütün modelleri, ikinci kutunun Gupta, üçüncü kutunun Hase ve arkadaşlarından olduğu yazılıdır.">
  <text x="20" y="28" font-size="13" fill="var(--text)">Aynı yöntem, altı ayrı ölçüt</text>
  <line x1="20" y1="42" x2="720" y2="42" stroke="var(--border)" />

  <text x="24" y="64" font-size="13" font-weight="bold" fill="var(--text-muted)">ölçüt</text>
  <text x="560" y="64" font-size="13" font-weight="bold" fill="var(--accent)">puan</text>
  <line x1="20" y1="74" x2="720" y2="74" stroke="var(--border)" />

  <text x="24" y="98" font-size="13" fill="var(--text)">düzenlenen olgunun kendisi</text>
  <text x="560" y="98" font-size="13" fill="var(--text)">99,8</text>

  <text x="24" y="122" font-size="13" fill="var(--text)">aynı olgu, başka sözcüklerle</text>
  <text x="560" y="122" font-size="13" fill="var(--text)">88,1</text>

  <text x="24" y="146" font-size="13" fill="var(--text)">öznenin başka adları</text>
  <text x="560" y="146" font-size="13" fill="var(--text)">86,8</text>

  <text x="24" y="170" font-size="13" fill="var(--text)">aynı ilişkinin öteki nesneleri</text>
  <text x="560" y="170" font-size="13" fill="var(--text)">100</text>

  <text x="24" y="196" font-size="13" font-weight="bold" fill="var(--text)">olgudan çıkan mantıksal sonuç</text>
  <text x="560" y="196" font-size="13" font-weight="bold" fill="var(--accent)">20,2</text>

  <text x="24" y="220" font-size="13" fill="var(--text)">ağırlık düzenleyen yöntemlerin ortalaması</text>
  <text x="560" y="220" font-size="13" fill="var(--text)">38,8 – 71,4</text>

  <line x1="20" y1="236" x2="720" y2="236" stroke="var(--border)" />

  <rect x="20" y="250" width="224" height="132" fill="var(--surface)" stroke="var(--border)" />
  <text x="32" y="274" font-size="13" font-weight="bold" fill="var(--cool)">Sonuç taşınmıyor</text>
  <text x="32" y="296" font-size="13" fill="var(--text)">Cevap değişiyor,</text>
  <text x="32" y="316" font-size="13" fill="var(--text)">inanç değişmiyor.</text>
  <text x="32" y="336" font-size="13" fill="var(--text)">Model yeni nesneyi</text>
  <text x="32" y="356" font-size="13" fill="var(--text)">söylüyor, ondan çıkanı</text>
  <text x="32" y="374" font-size="13" fill="var(--text)">hesaplamıyor.</text>

  <rect x="258" y="250" width="224" height="132" fill="var(--surface)" stroke="var(--border)" />
  <text x="270" y="274" font-size="13" font-weight="bold" fill="var(--cool)">Birikince çöküyor</text>
  <text x="270" y="296" font-size="13" fill="var(--text)">Tutma oranı 100 ile</text>
  <text x="270" y="316" font-size="13" fill="var(--text)">1.000 düzenleme arası</text>
  <text x="270" y="336" font-size="13" fill="var(--text)">düşüyor. Devre dışı</text>
  <text x="270" y="356" font-size="13" fill="var(--text)">bırakanın izi ~400 kat</text>
  <text x="270" y="374" font-size="13" fill="var(--text)">büyük; ilk sırada da öyle.</text>

  <rect x="496" y="250" width="224" height="132" fill="var(--surface)" stroke="var(--border)" />
  <text x="508" y="274" font-size="13" font-weight="bold" fill="var(--cool)">Yer bilmek yetmiyor</text>
  <text x="508" y="296" font-size="13" fill="var(--text)">Olgunun iz sürmeyle</text>
  <text x="508" y="316" font-size="13" fill="var(--text)">bulunan yeri ile</text>
  <text x="508" y="336" font-size="13" fill="var(--text)">düzenlenebildiği katman</text>
  <text x="508" y="356" font-size="13" fill="var(--text)">arasındaki bağıntı</text>
  <text x="508" y="374" font-size="13" fill="var(--text)">sıfıra yakın.</text>

  <text x="20" y="412" font-size="13" fill="var(--text-faint)">İlk iki satır Meng ve ark.'nın; üçüncüden beşinciye Cohen ve ark.'nın GPT-2 XL ölçümü;</text>
  <text x="20" y="430" font-size="13" fill="var(--text-faint)">son satır Cohen ve ark.'nın bütün modelleri; ikinci kutu Gupta ve ark.'nın,</text>
  <text x="20" y="448" font-size="13" fill="var(--text-faint)">üçüncü kutu Hase ve ark.'nın ölçümüdür.</text>
</svg>
