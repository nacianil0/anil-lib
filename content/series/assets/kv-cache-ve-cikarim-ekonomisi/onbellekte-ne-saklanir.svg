<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Önbellekte saklanan şey: anahtarlar ve değerler</text>

  <text x="60" y="58" font-size="13" text-anchor="start" fill="var(--text-muted)">önceki token'lar (önbellekte)</text>
  <text x="540" y="58" font-size="13" text-anchor="start" fill="var(--accent)">yeni token</text>

  <text x="50" y="88" font-size="13" text-anchor="end" fill="var(--text-muted)">anahtar</text>
  <text x="50" y="118" font-size="13" text-anchor="end" fill="var(--text-muted)">değer</text>

  <rect x="60" y="70" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="60" y="100" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="148" y="70" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="148" y="100" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="236" y="70" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="236" y="100" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="324" y="70" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="324" y="100" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="412" y="70" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <rect x="412" y="100" width="80" height="26" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>

  <rect x="540" y="70" width="90" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="585" y="88" font-size="13" text-anchor="middle" fill="var(--accent)">sorgu</text>
  <text x="585" y="118" font-size="13" text-anchor="middle" fill="var(--text-faint)">saklanmaz</text>

  <line x1="100" y1="150" x2="580" y2="150" stroke="var(--border)" stroke-width="1"/>
  <line x1="100" y1="126" x2="100" y2="150" stroke="var(--border)" stroke-width="1"/>
  <line x1="188" y1="126" x2="188" y2="150" stroke="var(--border)" stroke-width="1"/>
  <line x1="276" y1="126" x2="276" y2="150" stroke="var(--border)" stroke-width="1"/>
  <line x1="364" y1="126" x2="364" y2="150" stroke="var(--border)" stroke-width="1"/>
  <line x1="452" y1="126" x2="452" y2="150" stroke="var(--border)" stroke-width="1"/>
  <line x1="580" y1="96" x2="580" y2="150" stroke="var(--accent)" stroke-width="1"/>

  <text x="16" y="176" font-size="13" text-anchor="start" fill="var(--text-muted)">yeni token'ın sorgusu, saklanan bütün anahtarlarla karşılaştırılır</text>

  <text x="16" y="216" font-size="13" text-anchor="start" fill="var(--text)">bir token için saklanan bayt:</text>
  <text x="16" y="242" font-size="13" text-anchor="start" fill="var(--accent)">2 × katman sayısı × anahtar-değer başı sayısı × baş boyutu × sayı başına bayt</text>

  <text x="16" y="276" font-size="13" text-anchor="start" fill="var(--text-muted)">sorgu vektörleri saklanmaz; yalnızca güncel token için üretilir</text>
  <text x="16" y="300" font-size="13" text-anchor="start" fill="var(--text-faint)">anahtar ve değerler sonradan gelen token'lardan etkilenmez; yeniden kullanılabilir</text>
</svg>
