<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="İki panel. Sol panel gürültü giderme: temiz girdi ve bozulmuş girdi ayrı çalıştırılır; yamalı çalıştırmada bozulmuş girdi işlenirken tek bir bileşenin aktivasyonu temiz çalıştırmadan geri konur ve çıktının ne kadar geri geldiği ölçülür; soru bu bileşen yeter mi; 18'deki nedensel izleme bu yön. Sağ panel gürültüleme: temiz girdi işlenirken tek bir bileşenin aktivasyonu bozulmuş çalıştırmadan konur ve çıktının ne kadar bozulduğu ölçülür; soru bu bileşen gerekli mi. Altta ölçünün doğru ile yanlış cevabın logit farkı olduğu, olasılığa yeğlendiği çünkü olasılığın ters yönde çalışan bileşenleri kaçırabildiği; bozma yönteminin sıfırlama, ortalama ya da yeniden örnekleme olarak sonucu değiştirdiği; ve otomatik keşfin yamayı doğrusal yaklaşıklıkla kestirip kenarları budamak olduğu yazılıdır.">
  <rect x="20" y="20" width="330" height="230" fill="var(--surface-muted)" />
  <text x="30" y="42" font-size="13" font-weight="bold" fill="var(--text)">gürültü giderme (denoising)</text>
  <text x="30" y="60" font-size="13" fill="var(--text-muted)">18'deki nedensel izleme bu yön</text>
  <rect x="30" y="76" width="200" height="40" fill="var(--accent-soft)" />
  <text x="40" y="94" font-size="13" fill="var(--text)">temiz girdi</text>
  <text x="40" y="110" font-size="13" fill="var(--text)">→ aktivasyonlar kaydedilir</text>
  <rect x="30" y="128" width="140" height="40" fill="var(--bg)" stroke="var(--border)" />
  <text x="40" y="146" font-size="13" fill="var(--text)">bozulmuş girdi</text>
  <text x="40" y="162" font-size="13" fill="var(--text)">→ cevap kaybolur</text>
  <text x="184" y="150" font-size="13" fill="var(--text-muted)">→</text>
  <rect x="200" y="128" width="150" height="40" fill="var(--accent-soft)" />
  <text x="210" y="146" font-size="13" fill="var(--text)">bozuk koşuya TEK</text>
  <text x="210" y="162" font-size="13" fill="var(--text)">temiz hesap geri konur</text>
  <text x="30" y="196" font-size="13" fill="var(--text)">ölçülen: cevap ne kadar geri geldi?</text>
  <text x="30" y="216" font-size="13" font-weight="bold" fill="var(--text)">sorusu: bu bileşen yeter mi?</text>
  <text x="30" y="236" font-size="13" fill="var(--text-muted)">yedek başlar burada görünmez</text>

  <rect x="370" y="20" width="330" height="230" fill="var(--surface-muted)" />
  <text x="380" y="42" font-size="13" font-weight="bold" fill="var(--text)">gürültüleme (noising)</text>
  <text x="380" y="60" font-size="13" fill="var(--text-muted)">ters yön</text>
  <rect x="380" y="76" width="200" height="40" fill="var(--bg)" stroke="var(--border)" />
  <text x="390" y="94" font-size="13" fill="var(--text)">bozulmuş girdi</text>
  <text x="390" y="110" font-size="13" fill="var(--text)">→ aktivasyonlar kaydedilir</text>
  <rect x="380" y="128" width="140" height="40" fill="var(--accent-soft)" />
  <text x="390" y="146" font-size="13" fill="var(--text)">temiz girdi</text>
  <text x="390" y="162" font-size="13" fill="var(--text)">→ cevap doğru</text>
  <text x="534" y="150" font-size="13" fill="var(--text-muted)">→</text>
  <rect x="550" y="128" width="140" height="40" fill="var(--bg)" stroke="var(--border)" />
  <text x="560" y="146" font-size="13" fill="var(--text)">temiz koşuya TEK</text>
  <text x="560" y="162" font-size="13" fill="var(--text)">bozuk hesap konur</text>
  <text x="380" y="196" font-size="13" fill="var(--text)">ölçülen: cevap ne kadar bozuldu?</text>
  <text x="380" y="216" font-size="13" font-weight="bold" fill="var(--text)">sorusu: bu bileşen gerekli mi?</text>
  <text x="380" y="236" font-size="13" fill="var(--text-muted)">yedek başlar asıl başları gizler</text>

  <line x1="20" y1="266" x2="700" y2="266" stroke="var(--border)" />
  <text x="20" y="290" font-size="13" font-weight="bold" fill="var(--text)">ölçü ve bozma yöntemi sonucun içindedir</text>
  <text x="20" y="310" font-size="13" fill="var(--text)">ölçü: doğru ↔ yanlış cevabın logit farkı; olasılık, ters yönde çalışan bileşenleri kaçırabilir</text>
  <text x="20" y="328" font-size="13" fill="var(--text)">bozma: sıfırlama, ortalamayla değiştirme, başka örnekten yeniden örnekleme → farklı bileşenler</text>
  <text x="20" y="356" font-size="13" font-weight="bold" fill="var(--text)">otomatik keşif</text>
  <text x="20" y="376" font-size="13" fill="var(--text)">her kenarı yamalayıp ölçüyü bozmayanı budamak; yamayı gradyanla doğrusal yaklaşıklamak</text>
</svg>
