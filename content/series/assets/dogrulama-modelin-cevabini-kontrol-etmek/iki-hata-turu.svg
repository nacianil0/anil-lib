<svg viewBox="0 0 720 336" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Doğrulayıcının iki ayrı yanılma biçimi</text>

  <text x="323" y="70" font-size="13" text-anchor="middle" fill="var(--text-muted)">doğrulayıcı kabul etti</text>
  <text x="581" y="70" font-size="13" text-anchor="middle" fill="var(--text-muted)">doğrulayıcı reddetti</text>

  <text x="16" y="120" font-size="13" text-anchor="start" fill="var(--text)">cevap doğru</text>
  <text x="16" y="194" font-size="13" text-anchor="start" fill="var(--text)">cevap yanlış</text>

  <rect x="200" y="84" width="246" height="62" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="323" y="112" font-size="13" text-anchor="middle" fill="var(--text)">istenen sonuç</text>
  <text x="323" y="132" font-size="13" text-anchor="middle" fill="var(--text-faint)">doğru cevap seçilir</text>

  <rect x="458" y="84" width="246" height="62" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="581" y="112" font-size="13" text-anchor="middle" fill="var(--text)">yanlış ret</text>
  <text x="581" y="132" font-size="13" text-anchor="middle" fill="var(--text-muted)">elde olan doğru cevap atılır</text>

  <rect x="200" y="158" width="246" height="62" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="323" y="186" font-size="13" text-anchor="middle" fill="var(--text)">yanlış kabul</text>
  <text x="323" y="206" font-size="13" text-anchor="middle" fill="var(--text-muted)">aday sayısıyla sıklaşır</text>

  <rect x="458" y="158" width="246" height="62" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="581" y="186" font-size="13" text-anchor="middle" fill="var(--text)">istenen sonuç</text>
  <text x="581" y="206" font-size="13" text-anchor="middle" fill="var(--text-faint)">yanlış cevap elenir</text>

  <line x1="16" y1="246" x2="704" y2="246" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="268" font-size="13" text-anchor="start" fill="var(--text-muted)">tek bir doğruluk sayısı iki hatayı gizler; ölçüm ayrı ayrı yapılmalıdır</text>
  <text x="16" y="290" font-size="13" text-anchor="start" fill="var(--text-faint)">ölçülen bir örnek — grafik boyamada aynı model, yanlış cevapların yüzde 6,5'ini</text>
  <text x="16" y="310" font-size="13" text-anchor="start" fill="var(--text-faint)">kabul ederken doğru cevapların yüzde 95,8'ini reddetti</text>
</svg>
