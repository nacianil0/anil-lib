  <text x="91" y="102" font-size="13" text-anchor="middle" fill="var(--text-muted)">kısa ince ayar</text>

  <line x1="166" y1="86" x2="184" y2="86" stroke="var(--accent)" stroke-width="1"/>
  <polygon points="190,86 182,82 182,90" fill="var(--accent)"/>

  <rect x="190" y="62" width="170" height="48" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="275" y="84" font-size="13" text-anchor="middle" fill="var(--text)">100 aday çözüm</text>
  <text x="275" y="102" font-size="13" text-anchor="middle" fill="var(--text-muted)">aynı soruya</text>

  <line x1="360" y1="86" x2="378" y2="86" stroke="var(--accent)" stroke-width="1"/>
  <polygon points="384,86 376,82 376,90" fill="var(--accent)"/>

