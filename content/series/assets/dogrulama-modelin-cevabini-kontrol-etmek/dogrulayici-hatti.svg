<svg viewBox="0 0 720 424" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Bedava etiketten doğrulayıcıya</text>

  <text x="16" y="52" font-size="13" text-anchor="start" fill="var(--accent)">eğitim</text>

