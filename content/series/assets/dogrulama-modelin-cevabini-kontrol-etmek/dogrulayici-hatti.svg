  <text x="500" y="317" font-size="13" text-anchor="middle" fill="var(--text-muted)">puan 0,55</text>

  <line x1="556" y1="276" x2="592" y2="264" stroke="var(--accent)" stroke-width="1"/>
  <polygon points="598,262 590,260 592,268" fill="var(--accent)"/>

  <rect x="598" y="242" width="106" height="44" fill="var(--surface)" stroke="var(--accent)" stroke-width="1"/>
  <text x="651" y="269" font-size="13" text-anchor="middle" fill="var(--text)">seçilen</text>

  <line x1="16" y1="352" x2="704" y2="352" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="374" font-size="13" text-anchor="start" fill="var(--text-muted)">eğitimde etiketi cevap anahtarı verir; çıkarımda puanı doğrulayıcı verir</text>
  <text x="16" y="396" font-size="13" text-anchor="start" fill="var(--text-faint)">üreticiyi büyütmek, doğrulayıcıyı büyütmekten daha çok kazandırıyor</text>
