  <text x="500" y="209" font-size="13" text-anchor="middle" fill="var(--text-muted)">puan 0,42</text>

  <rect x="182" y="226" width="270" height="28" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="317" y="245" font-size="13" text-anchor="middle" fill="var(--text-muted)">aday 2</text>
  <text x="500" y="245" font-size="13" text-anchor="middle" fill="var(--text-muted)">puan 0,17</text>

  <rect x="182" y="262" width="270" height="28" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="317" y="281" font-size="13" text-anchor="middle" fill="var(--text)">aday 3</text>
  <text x="500" y="281" font-size="13" text-anchor="middle" fill="var(--text)">puan 0,91</text>

  <rect x="182" y="298" width="270" height="28" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
