  <text x="81" y="269" font-size="13" text-anchor="middle" fill="var(--text)">yeni soru</text>

  <line x1="146" y1="264" x2="182" y2="204" stroke="var(--cool)" stroke-width="1"/>
  <line x1="146" y1="264" x2="182" y2="240" stroke="var(--cool)" stroke-width="1"/>
  <line x1="146" y1="264" x2="182" y2="276" stroke="var(--cool)" stroke-width="1"/>
  <line x1="146" y1="264" x2="182" y2="312" stroke="var(--cool)" stroke-width="1"/>

