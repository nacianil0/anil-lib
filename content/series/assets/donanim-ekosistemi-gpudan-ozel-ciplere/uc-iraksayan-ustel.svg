<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" role="img" aria-label="Beş satırlı tablo; satırlar birlikte fakat farklı hızlarda büyüyen beş büyüklük. Donanımın tepe işlem kapasitesi yirmi yılda yaklaşık 60.000 kat, yani iki yılda 3,0 kat arttı. DRAM bant genişliği aynı sürede 100 kat, yani iki yılda 1,6 kat arttı. Kartlar arası iletişim bandı 30 kat, yani iki yılda 1,4 kat arttı. Büyük Transformer modellerinin parametre sayısı 2018 ile 2022 arasında iki yılda 410 kat arttı. Tek bir hızlandırıcının belleği ise iki yılda yalnızca 2 kat arttı. En altta bir kayıt: 26, 27, 28, 85, 86 ve 88. makalelerde ayrı ayrı karşılaştığımız darboğazlar bu satırlar arasındaki farktan çıkıyor; çipin tepe hızı hızlı büyüdü, ona veri taşıyan her şey yavaş.">
  <text x="30" y="24" font-size="13" font-weight="bold" fill="var(--text)">büyüyen şey</text>
  <text x="380" y="24" font-size="13" font-weight="bold" fill="var(--text)">yirmi yılda</text>
  <text x="540" y="24" font-size="13" font-weight="bold" fill="var(--text)">iki yılda</text>
  <line x1="20" y1="34" x2="700" y2="34" stroke="var(--border)" />

  <rect x="20" y="42" width="680" height="30" fill="var(--surface-muted)" />
  <text x="30" y="62" font-size="13" fill="var(--text)">donanımın tepe işlem kapasitesi</text>
  <text x="380" y="62" font-size="13" fill="var(--cool)">60.000 kat</text>
  <text x="540" y="62" font-size="13" fill="var(--cool)">3,0 kat</text>

  <text x="30" y="92" font-size="13" fill="var(--text)">DRAM bant genişliği</text>
  <text x="380" y="92" font-size="13" fill="var(--accent)">100 kat</text>
  <text x="540" y="92" font-size="13" fill="var(--accent)">1,6 kat</text>

  <rect x="20" y="102" width="680" height="30" fill="var(--surface-muted)" />
  <text x="30" y="122" font-size="13" fill="var(--text)">kartlar arası iletişim bandı</text>
  <text x="380" y="122" font-size="13" fill="var(--accent)">30 kat</text>
  <text x="540" y="122" font-size="13" fill="var(--accent)">1,4 kat</text>

  <text x="30" y="152" font-size="13" fill="var(--text)">model parametre sayısı (2018–2022)</text>
  <text x="380" y="152" font-size="13" fill="var(--text-muted)">—</text>
  <text x="540" y="152" font-size="13" fill="var(--cool)">410 kat</text>

  <rect x="20" y="162" width="680" height="30" fill="var(--surface-muted)" />
  <text x="30" y="182" font-size="13" fill="var(--text)">tek hızlandırıcının belleği</text>
  <text x="380" y="182" font-size="13" fill="var(--text-muted)">—</text>
  <text x="540" y="182" font-size="13" fill="var(--accent)">2 kat</text>

  <line x1="20" y1="200" x2="700" y2="200" stroke="var(--border)" />
  <text x="20" y="224" font-size="13" fill="var(--text-muted)">Üçü de üstel büyüyor, ama üsler farklı; iki farklı üstelin arası da üstel büyür.</text>
  <text x="20" y="248" font-size="13" fill="var(--text-muted)">26, 27, 28, 85, 86 ve 88'de ayrı ayrı karşılaştığımız darboğazlar bu satırlar</text>
  <text x="20" y="266" font-size="13" fill="var(--text-muted)">arasındaki farktan çıkıyor.</text>
  <text x="20" y="290" font-size="13" fill="var(--text-faint)">Çipin tepe hızı hızlı büyüdü; ona veri taşıyan her şey yavaş.</text>
</svg>
