<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" role="img" aria-label="Yatay eksende beta, dikey eksende delta. Delta eşittir 1,5 bölü beta eğrisi soldan yukarıdan sağa aşağı inen bir hiperbol çiziyor. Dört ölçüm noktası eğrinin üstüne oturuyor: beta 0,2'de 7,57, beta 0,5'te 3,02, beta 1,0'da 1,53, beta 2,0'da 0,77. Mikro ve geniş modelin noktaları çakışıyor. Açıklama: beta onda birine inince delta on katına çıkıyor.">
  <text x="20" y="22" font-size="13" fill="var(--text)">Aynı kayba (0,20) inen koşularda tasmanın uzunluğu</text>
