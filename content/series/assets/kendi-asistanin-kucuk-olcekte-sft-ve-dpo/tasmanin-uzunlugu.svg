  <text x="78" y="185" font-size="13" text-anchor="end" fill="var(--text-muted)">4</text>
  <text x="78" y="245" font-size="13" text-anchor="end" fill="var(--text-muted)">2</text>
  <text x="78" y="305" font-size="13" text-anchor="end" fill="var(--text-muted)">0</text>
  <line x1="219.5" y1="300" x2="219.5" y2="306" stroke="var(--text)" />
