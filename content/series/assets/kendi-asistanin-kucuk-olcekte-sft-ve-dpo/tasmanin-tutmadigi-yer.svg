<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" role="img" aria-label="İki panelli yatay çubuk grafik. Satırlar sözlüğün yedi token'ı. Sol panel DPO'dan önce: bugün 0,497 ve dün 0,501, öteki token'lar sıfıra yakın. Sağ panel DPO'dan sonra: uyudu 0,994, bugün 0,001, dün 0,0005, havladı 0,004. bugün ve dün satırları vurgulu. Altta: karşılaştırılan iki cevabın toplamı 0,998'den 0,002'ye indi, oran ise yeğlenen lehine yaklaşık 2,3.">
  <text x="20" y="24" font-size="13" fill="var(--text)">Tohum 11, β 2,0: başla kedi bağlamında sıradaki token, DPO'dan önce ve sonra</text>

  <rect x="20" y="154" width="680" height="60" fill="var(--accent-soft)" />

  <text x="110" y="54" font-size="13" fill="var(--text-muted)">önce (referans)</text>
  <text x="420" y="54" font-size="13" fill="var(--text-muted)">sonra</text>
  <line x1="110" y1="62" x2="110" y2="274" stroke="var(--border)" />
  <line x1="420" y1="62" x2="420" y2="274" stroke="var(--border)" />

  <text x="100" y="81" font-size="13" text-anchor="end" fill="var(--text)">başla</text>
  <text x="100" y="111" font-size="13" text-anchor="end" fill="var(--text)">kedi</text>
  <text x="100" y="141" font-size="13" text-anchor="end" fill="var(--text)">köpek</text>
  <text x="100" y="171" font-size="13" text-anchor="end" fill="var(--text)">bugün</text>
  <text x="100" y="201" font-size="13" text-anchor="end" fill="var(--text)">dün</text>
  <text x="100" y="231" font-size="13" text-anchor="end" fill="var(--text)">uyudu</text>
  <text x="100" y="261" font-size="13" text-anchor="end" fill="var(--text)">havladı</text>

  <text x="116" y="81" font-size="13" fill="var(--text-faint)">0</text>
  <text x="116" y="111" font-size="13" fill="var(--text-faint)">0,001</text>
  <text x="116" y="141" font-size="13" fill="var(--text-faint)">0,0001</text>
  <rect x="110" y="158" width="119" height="16" fill="var(--cool)" />
  <text x="236" y="171" font-size="13" fill="var(--text)">0,497</text>
  <rect x="110" y="188" width="120" height="16" fill="var(--cool)" />
  <text x="237" y="201" font-size="13" fill="var(--text)">0,501</text>
  <text x="116" y="231" font-size="13" fill="var(--text-faint)">0,001</text>
  <text x="116" y="261" font-size="13" fill="var(--text-faint)">0</text>

  <text x="426" y="81" font-size="13" fill="var(--text-faint)">0,0001</text>
  <text x="426" y="111" font-size="13" fill="var(--text-faint)">0</text>
  <text x="426" y="141" font-size="13" fill="var(--text-faint)">0</text>
  <text x="426" y="171" font-size="13" fill="var(--text)">0,001</text>
  <text x="426" y="201" font-size="13" fill="var(--text)">0,0005</text>
  <rect x="420" y="218" width="239" height="16" fill="var(--accent)" />
  <text x="664" y="231" font-size="13" fill="var(--text)">0,994</text>
  <rect x="420" y="248" width="1" height="16" fill="var(--accent)" />
  <text x="428" y="261" font-size="13" fill="var(--text-faint)">0,004</text>

  <text x="20" y="296" font-size="13" fill="var(--text)">Karşılaştırılan iki cevabın toplamı 0,998'den 0,002'ye indi; kütlenin</text>
  <text x="20" y="314" font-size="13" fill="var(--text)">yüzde 99,4'ü karşılaştırmaya hiç girmeyen uyudu'ya kaçtı.</text>
  <text x="20" y="334" font-size="13" fill="var(--text-muted)">Kaybın gördüğü tek şey oran ve o hâlâ yeğlenen lehine: 0,00112 ÷ 0,00049 ≈ 2,3.</text>
  <text x="20" y="354" font-size="13" fill="var(--text-faint)">Olasılıklar modelin kendi dağılımından okundu; örnekleme yapılmadı.</text>
</svg>
