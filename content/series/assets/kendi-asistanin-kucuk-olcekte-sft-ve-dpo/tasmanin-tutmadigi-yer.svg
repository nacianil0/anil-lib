  <text x="570" y="126" font-size="13" font-weight="bold" fill="var(--accent)">1,59842</text>

  <text x="24" y="152" font-size="13" fill="var(--text)">42</text>
  <text x="96" y="152" font-size="13" fill="var(--text)">2,0</text>
