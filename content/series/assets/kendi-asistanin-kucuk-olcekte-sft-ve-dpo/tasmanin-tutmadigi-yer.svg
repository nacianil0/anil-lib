  <rect x="20" y="258" width="680" height="36" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="34" y="282" font-size="13" fill="var(--text)">δ her tohumda aynı: kayıp hedefine her koşuda aynı biçimde ulaşıldı.</text>

  <rect x="20" y="304" width="680" height="76" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="34" y="328" font-size="13" font-weight="bold" fill="var(--accent)">Modelin gerçekte yaptığı şey aynı değil</text>
  <text x="34" y="350" font-size="13" fill="var(--text)">p(bugün) üç koşuda 0,6809 · 0,0011 · 0,6840. Ortadaki koşuda yeğlenen</text>
  <text x="34" y="370" font-size="13" fill="var(--text)">cevap binde bire indi — δ iki cevabın oranını ölçüyor, düzeyini değil.</text>

  <rect x="20" y="390" width="680" height="36" fill="var(--surface)" stroke="var(--border)" />
  <text x="34" y="414" font-size="13" fill="var(--text-muted)">Hasar da tohuma göre: fiil bir koşuda çöküyor, ikisinde yerinde kalıyor.</text>

  <text x="20" y="452" font-size="13" fill="var(--text-faint)">Üç tohum bir yöntemi ölçmez; yalnızca ayrışmanın üçünde de göründüğünü söyler.</text>
