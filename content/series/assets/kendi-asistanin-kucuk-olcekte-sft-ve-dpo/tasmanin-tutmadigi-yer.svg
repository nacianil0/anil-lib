<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" role="img" aria-label="Altı satırlık yedi sütunlu bir tablo ve altında üç kutu. Üstte başlık: aynı kayıp eşiği, üç tohum, tercih dışındaki her şey. Sütunlar tohum, beta, delta, p bugün, doğru fiil önce, sonra ve derlem kaybı. Birinci satır tohum 7, beta 2,0: delta 0,766, p 0,6809, fiil 0,9990'dan 0,4999'a, derlem 1,67270. İkinci satır vurguludur, tohum 11, beta 2,0: delta 0,843, p 0,0011, fiil 0,9975'ten 0,9925'e, derlem 1,59842. Üçüncü satır tohum 42, beta 2,0: delta 0,775, p 0,6840, fiil 0,9980'den 0,9937'ye, derlem 0,49886. Dördüncü satır tohum 7, beta 1,0: delta 1,530, p 0,7003, fiil 0,9990'dan 0,4999'a, derlem 1,82731. Beşinci satır vurguludur, tohum 11, beta 1,0: delta 1,540, p 0,0006, fiil 0,9975'ten 0,9922'ye, derlem 2,49577. Altıncı satır tohum 42, beta 1,0: delta 1,505, p 0,8164, fiil 0,9980'den 0,9398'e, derlem 0,59280. Birinci kutuda şu durur: delta her tohumda aynı, yani kayıp hedefine her koşuda aynı biçimde ulaşıldı ve tercih tanımı gereği karşılandı. İkinci kutu vurguludur: modelin gerçekte yaptığı şey aynı değil, bugünün olasılığı üç koşuda 0,6809, 0,0011 ve 0,6840; ortadaki koşuda yeğlenen cevap binde bire indi çünkü delta iki cevabın oranını ölçüyor ve ikisini birden aşağı iterek o oran korunabiliyor. Üçüncü kutuda hasar durur: doğru fiil olasılığı bir tohumda 0,999'dan 0,500'e çöküyor, öteki ikisinde yerinde kalıyor; derlem kaybı üçünde de yükseliyor ama artış 0,04 ile 2,03 arasında. En altta bir kayıt: üç tohum bir yöntemi ölçmeye yetmez, yalnızca ayrışmanın üçünde de göründüğünü söyler.">
  <text x="20" y="30" font-size="13" fill="var(--text)">Aynı kayıp eşiği, üç tohum — tercih dışındaki her şey</text>
