<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" role="img" aria-label="Dokuz basamaklı dikey bir akış. bugün token'ının dört sayılık vektörü yukarıdan aşağı dokuz basamaktan geçer; sağda her basamaktaki vektör boyu yazar. Yalnızca dördüncü basamak, maskelenmiş dikkat, vurguludur ve ona soldan iki ok gelir: başla ve kedi konumlarından. Son basamak yedi olasılık verir, uyudu için 0,061.">
  <defs>
    <marker id="ok-103-yol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)" />
    </marker>
    <marker id="ok-103-komsu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="20" y="24" font-size="13" fill="var(--text)">bugün token'ının yolu: dört sayı, dokuz basamak</text>
  <text x="544" y="46" font-size="13" fill="var(--text-faint)">vektör boyu</text>

  <rect x="150" y="56" width="380" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" />
  <text x="162" y="76" font-size="13" fill="var(--text)">1  token embedding + konum embedding (toplama)</text>
  <text x="544" y="76" font-size="13" fill="var(--text-muted)">4</text>
  <line x1="340" y1="86" x2="340" y2="98" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-103-yol)" />

  <rect x="150" y="100" width="380" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" />
  <text x="162" y="120" font-size="13" fill="var(--text)">2  katman normalleştirme</text>
  <text x="544" y="120" font-size="13" fill="var(--text-muted)">4</text>
  <line x1="340" y1="130" x2="340" y2="142" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-103-yol)" />

  <rect x="150" y="144" width="380" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" />
  <text x="162" y="164" font-size="13" fill="var(--text)">3  sorgu, anahtar, değer (iki baş, ikişer sayı)</text>
  <text x="544" y="164" font-size="13" fill="var(--text-muted)">3 × (2 + 2)</text>
  <line x1="340" y1="174" x2="340" y2="186" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-103-yol)" />

  <rect x="150" y="188" width="380" height="30" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="162" y="208" font-size="13" fill="var(--text)">4  maskelenmiş dikkat: komşulara bakan tek basamak</text>
  <text x="544" y="208" font-size="13" fill="var(--text-muted)">2 + 2</text>
  <line x1="340" y1="218" x2="340" y2="230" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-103-yol)" />

  <rect x="150" y="232" width="380" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" />
  <text x="162" y="252" font-size="13" fill="var(--text)">5  başları birleştiren izdüşüm + artık toplama</text>
  <text x="544" y="252" font-size="13" fill="var(--text-muted)">4</text>
  <line x1="340" y1="262" x2="340" y2="274" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-103-yol)" />

  <rect x="150" y="276" width="380" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" />
  <text x="162" y="296" font-size="13" fill="var(--text)">6  katman normalleştirme</text>
  <text x="544" y="296" font-size="13" fill="var(--text-muted)">4</text>
  <line x1="340" y1="306" x2="340" y2="318" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-103-yol)" />

  <rect x="150" y="320" width="380" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" />
  <text x="162" y="340" font-size="13" fill="var(--text)">7  ileri besleme (GELU) + artık toplama</text>
  <text x="544" y="340" font-size="13" fill="var(--text-muted)">4 → 8 → 4</text>
  <line x1="340" y1="350" x2="340" y2="362" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-103-yol)" />

  <rect x="150" y="364" width="380" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" />
  <text x="162" y="384" font-size="13" fill="var(--text)">8  ikinci blok (2–7 yeniden) + son normalleştirme</text>
  <text x="544" y="384" font-size="13" fill="var(--text-muted)">4</text>
  <line x1="340" y1="394" x2="340" y2="406" stroke="var(--text-muted)" stroke-width="1.2" marker-end="url(#ok-103-yol)" />

  <rect x="150" y="408" width="380" height="30" rx="4" fill="var(--surface)" stroke="var(--border)" />
  <text x="162" y="428" font-size="13" fill="var(--text)">9  bağlanmış çıktı izdüşümü + softmax → uyudu 0,061</text>
  <text x="544" y="428" font-size="13" fill="var(--text-muted)">7 olasılık</text>

  <text x="12" y="134" font-size="13" fill="var(--text-faint)">önceki konumlar</text>
  <rect x="12" y="144" width="124" height="30" rx="4" fill="var(--surface-muted)" stroke="var(--accent)" />
  <text x="22" y="164" font-size="13" fill="var(--text)">başla · konum 0</text>
  <rect x="12" y="232" width="124" height="30" rx="4" fill="var(--surface-muted)" stroke="var(--accent)" />
  <text x="22" y="252" font-size="13" fill="var(--text)">kedi · konum 1</text>
  <line x1="136" y1="162" x2="146" y2="197" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#ok-103-komsu)" />
  <line x1="136" y1="244" x2="146" y2="210" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#ok-103-komsu)" />

  <text x="20" y="464" font-size="13" fill="var(--text-muted)">Yalnızca 4. basamak başka konumların anahtar ve değerlerini okur; uyudu maskelidir.</text>
  <text x="20" y="486" font-size="13" fill="var(--text-faint)">Kalan sekiz basamak bu konumun kendi sayıları üzerinde çalışır. Ağırlıklar rastgeledir.</text>
</svg>
