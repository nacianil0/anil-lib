  <path d="M 84 206 C 200 190, 340 168, 450 158 S 560 152, 600 150" fill="none" stroke="var(--cool)" stroke-width="2"/>
  <path d="M 84 200 C 200 180, 340 152, 450 140 S 560 134, 600 132" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <path d="M 84 196 C 200 168, 340 126, 450 104 S 560 90, 600 86" fill="none" stroke="var(--accent)" stroke-width="2"/>

  <text x="608" y="91" font-size="13" text-anchor="start" fill="var(--accent)">%78,2</text>
