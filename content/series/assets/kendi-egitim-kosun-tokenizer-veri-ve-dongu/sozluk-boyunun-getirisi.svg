<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Altı satırlık beş sütunlu bir tablo ve altında iki kutu. Üstte başlık: birleştirme sayısı arttıkça ne kazanılıyor ve ne ödeniyor. Sütunlar birleştirme, sözlük, token, kelime bölü token ve satır başına kazanılan token. Birinci satır sıfır birleştirme: sözlük 85, 1.739.841 token, 6,821 kelime bölü token, satır başına kazanç yok. İkinci satır 100 birleştirme: sözlük 185, 1.051.052 token, 4,121, satır başına 6.888. Üçüncü satır 400 birleştirme: sözlük 483, 726.244 token, 2,847, satır başına 815. Dördüncü satır 1.600 birleştirme: sözlük 1.669, 474.331 token, 1,860, satır başına 142. Beşinci satır 3.200 birleştirme: sözlük 3.242, 389.428 token, 1,527, satır başına 54. Altıncı satır vurguludur, 6.400 birleştirme: sözlük 6.343, 330.996 token, 1,298, satır başına 19. Birinci kutuda oran durur: ilk yüz satırın her biri derlemden 6.888 token siliyor, son üç bin satırın her biri yalnızca 19; aradaki oran 366. İkinci kutuda mikro modelin eşiği durur: vektör boyu 4 ve blokların tamamı 320 parametre olduğu için sözlük 80 token'ı geçtiğinde defter makineden büyük olur. En altta bir kayıt: bütün sayımlar bu serinin derlemi üzerinde bizim ölçümümüzdür.">
  <text x="20" y="30" font-size="13" fill="var(--text)">Birleştirme sayısı arttıkça ne kazanılıyor, ne ödeniyor</text>
  <line x1="20" y1="44" x2="700" y2="44" stroke="var(--border)" />

  <text x="24" y="66" font-size="13" font-weight="bold" fill="var(--text-muted)">birleştirme</text>
  <text x="140" y="66" font-size="13" font-weight="bold" fill="var(--text-muted)">sözlük</text>
  <text x="240" y="66" font-size="13" font-weight="bold" fill="var(--text-muted)">token</text>
  <text x="380" y="66" font-size="13" font-weight="bold" fill="var(--text-muted)">kelime/token</text>
  <text x="530" y="66" font-size="13" font-weight="bold" fill="var(--text-muted)">satır başına kazanç</text>
  <line x1="20" y1="76" x2="700" y2="76" stroke="var(--border)" />

  <text x="24" y="100" font-size="13" fill="var(--text)">0</text>
  <text x="140" y="100" font-size="13" fill="var(--text)">85</text>
  <text x="240" y="100" font-size="13" fill="var(--text)">1.739.841</text>
  <text x="380" y="100" font-size="13" fill="var(--text)">6,821</text>
  <text x="530" y="100" font-size="13" fill="var(--text-faint)">—</text>

  <text x="24" y="126" font-size="13" fill="var(--text)">100</text>
  <text x="140" y="126" font-size="13" fill="var(--text)">185</text>
  <text x="240" y="126" font-size="13" fill="var(--text)">1.051.052</text>
  <text x="380" y="126" font-size="13" fill="var(--text)">4,121</text>
  <text x="530" y="126" font-size="13" font-weight="bold" fill="var(--accent)">6.888</text>

  <text x="24" y="152" font-size="13" fill="var(--text)">400</text>
  <text x="140" y="152" font-size="13" fill="var(--text)">483</text>
  <text x="240" y="152" font-size="13" fill="var(--text)">726.244</text>
  <text x="380" y="152" font-size="13" fill="var(--text)">2,847</text>
  <text x="530" y="152" font-size="13" fill="var(--text)">815</text>

  <text x="24" y="178" font-size="13" fill="var(--text)">1.600</text>
  <text x="140" y="178" font-size="13" fill="var(--text)">1.669</text>
  <text x="240" y="178" font-size="13" fill="var(--text)">474.331</text>
  <text x="380" y="178" font-size="13" fill="var(--text)">1,860</text>
  <text x="530" y="178" font-size="13" fill="var(--text)">142</text>

  <text x="24" y="204" font-size="13" fill="var(--text)">3.200</text>
  <text x="140" y="204" font-size="13" fill="var(--text)">3.242</text>
  <text x="240" y="204" font-size="13" fill="var(--text)">389.428</text>
  <text x="380" y="204" font-size="13" fill="var(--text)">1,527</text>
  <text x="530" y="204" font-size="13" fill="var(--text)">54</text>

  <text x="24" y="230" font-size="13" fill="var(--text)">6.400</text>
  <text x="140" y="230" font-size="13" fill="var(--text)">6.343</text>
  <text x="240" y="230" font-size="13" fill="var(--text)">330.996</text>
  <text x="380" y="230" font-size="13" fill="var(--text)">1,298</text>
  <text x="530" y="230" font-size="13" font-weight="bold" fill="var(--accent)">19</text>

  <line x1="20" y1="246" x2="700" y2="246" stroke="var(--border)" />

  <rect x="20" y="258" width="680" height="56" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="34" y="282" font-size="13" fill="var(--text)">İlk yüz satırın her biri derlemden 6.888 token siliyor; son üç bin satırın</text>
  <text x="34" y="302" font-size="13" fill="var(--text)">her biri yalnızca 19. Aradaki oran 366.</text>

  <rect x="20" y="324" width="680" height="56" fill="var(--surface)" stroke="var(--border)" />
  <text x="34" y="348" font-size="13" fill="var(--text-muted)">Mikro modelin eşiği: vektör boyu 4 ve bloklar 320 parametre olduğu için</text>
  <text x="34" y="368" font-size="13" fill="var(--text-muted)">sözlük 80 token'ı geçtiğinde defter makineden büyük olur.</text>

  <text x="20" y="404" font-size="13" fill="var(--text-faint)">Bütün sayımlar bu serinin derlemi üzerinde bizim ölçümümüzdür.</text>
</svg>
