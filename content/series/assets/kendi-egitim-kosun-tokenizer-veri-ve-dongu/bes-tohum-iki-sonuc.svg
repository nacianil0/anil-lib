  <line x1="607" y1="220" x2="607" y2="226" stroke="var(--text)" />
  <text x="60" y="240" font-size="13" text-anchor="middle" fill="var(--text-muted)">0,40</text>
  <text x="242" y="240" font-size="13" text-anchor="middle" fill="var(--text-muted)">0,50</text>
  <text x="425" y="240" font-size="13" text-anchor="middle" fill="var(--text-muted)">0,60</text>
  <text x="607" y="240" font-size="13" text-anchor="middle" fill="var(--text-muted)">0,70</text>
  <text x="370" y="260" font-size="13" text-anchor="middle" fill="var(--text-faint)">son kayıp, nat — düşük olan iyidir</text>

