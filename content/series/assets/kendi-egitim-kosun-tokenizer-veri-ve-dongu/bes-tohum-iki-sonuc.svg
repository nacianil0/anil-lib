<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-label="Yatay bir kayıp ekseni üzerinde beş nokta. Üç nokta dilin entropisi 0,4621 çizgisinin hemen yanında, iki nokta ikili sayım tabanı 0,6931 çizgisinin hemen yanında toplanmış. Aradaki boşlukta, 0,556'da, içi boş bir işaret ortalamayı gösteriyor ve hiçbir koşunun orada durmadığı yazıyor. Altta ortalama artı eksi bir sapmanın iki öbeği birden kapladığı bir ayraç var.">
  <text x="20" y="24" font-size="13" fill="var(--text)">Beş tohumun son kaybı, tek bir cetvel üzerinde</text>

