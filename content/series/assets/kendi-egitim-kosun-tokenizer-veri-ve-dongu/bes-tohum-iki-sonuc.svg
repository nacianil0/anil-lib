  <line x1="576" y1="278" x2="576" y2="290" stroke="var(--accent)" stroke-width="1.2" />
  <text x="345" y="306" font-size="13" text-anchor="middle" fill="var(--text-muted)">ortalama ± 1 sapma (0,127): iki öbeğin arasını kaplıyor</text>

  <text x="20" y="338" font-size="13" fill="var(--text-faint)">Beş koşu da bizimdir; değişen tek şey başlangıç ağırlıklarının tohumudur.</text>
