  <circle cx="597" cy="204" r="6" fill="var(--text-muted)" />
  <circle cx="597" cy="188" r="6" fill="var(--text-muted)" />
  <text x="582" y="184" font-size="13" text-anchor="end" fill="var(--text)">tohum 23, 101</text>
  <text x="582" y="202" font-size="13" text-anchor="end" fill="var(--text-muted)">2 koşu, 0,694 dolayı</text>

  <line x1="345" y1="122" x2="345" y2="220" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 3" />
