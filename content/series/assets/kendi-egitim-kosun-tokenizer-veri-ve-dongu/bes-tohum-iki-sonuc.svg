  <line x1="594" y1="62" x2="594" y2="220" stroke="var(--text-faint)" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="594" y="54" font-size="13" text-anchor="middle" fill="var(--text-muted)">ikili sayım tabanı 0,6931</text>

