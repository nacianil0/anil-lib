<svg viewBox="0 0 720 404" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ok-46-karar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)"/>
    </marker>
  </defs>
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Dört karar, dört yansıma token'ı</text>
  <text x="16" y="46" font-size="13" text-anchor="start" fill="var(--text-faint)">kararların hepsi modelin ürettiği özel token'lardır; eleştirmen yalnızca eğitimde gerekir</text>

  <rect x="200" y="62" width="240" height="32" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="82" font-size="13" text-anchor="middle" fill="var(--text)">soru + o ana kadar üretilen metin</text>
  <line x1="320" y1="94" x2="320" y2="112" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-46-karar)"/>

  <rect x="248" y="114" width="144" height="32" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="320" y="134" font-size="13" text-anchor="middle" fill="var(--text)">1 · getir mi?</text>
  <line x1="248" y1="130" x2="120" y2="130" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="120" y1="130" x2="120" y2="292" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="120" y1="292" x2="186" y2="292" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-46-karar)"/>
  <text x="128" y="150" font-size="13" text-anchor="start" fill="var(--text-muted)">hayır</text>
  <line x1="320" y1="146" x2="320" y2="164" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-46-karar)"/>
  <text x="328" y="160" font-size="13" text-anchor="start" fill="var(--text-muted)">evet</text>

  <rect x="248" y="166" width="144" height="32" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="320" y="186" font-size="13" text-anchor="middle" fill="var(--text)">getirilen parçalar</text>
  <line x1="320" y1="198" x2="320" y2="216" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-46-karar)"/>

  <rect x="248" y="218" width="144" height="32" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="320" y="238" font-size="13" text-anchor="middle" fill="var(--text)">2 · parça ilgili mi?</text>
  <line x1="392" y1="234" x2="470" y2="234" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-46-karar)"/>
  <text x="478" y="238" font-size="13" text-anchor="start" fill="var(--text-muted)">ilgisiz parça elenir</text>
  <line x1="320" y1="250" x2="320" y2="268" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-46-karar)"/>

  <rect x="188" y="270" width="264" height="44" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="288" font-size="13" text-anchor="middle" fill="var(--text)">her parçayla bir bölüm üret</text>
  <text x="320" y="304" font-size="13" text-anchor="middle" fill="var(--text-muted)">3 · destekleniyor mu?  4 · yararlı mı?</text>
  <line x1="320" y1="314" x2="320" y2="332" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-46-karar)"/>

  <rect x="200" y="334" width="240" height="32" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="320" y="354" font-size="13" text-anchor="middle" fill="var(--text)">en iyi bölümü seç, sonrakine geç</text>
  <line x1="440" y1="350" x2="600" y2="350" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="600" y1="350" x2="600" y2="78" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="600" y1="78" x2="454" y2="78" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-46-karar)"/>
  <text x="608" y="220" font-size="13" text-anchor="start" fill="var(--text-faint)">bir sonraki</text>
  <text x="608" y="238" font-size="13" text-anchor="start" fill="var(--text-faint)">bölüm için</text>
  <text x="608" y="256" font-size="13" text-anchor="start" fill="var(--text-faint)">başa dön</text>

  <text x="16" y="390" font-size="13" text-anchor="start" fill="var(--text-muted)">2, 3 ve 4: bağlam ilgililiği, kaynak sadakati ve cevap ilgililiğinin üretim anındaki karşılıkları</text>
</svg>
