<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-label="Üç panel. Sol panelde yoğun durum: beş özellik iki boyuta sıkıştırılıyor, model yalnızca en önemli iki özelliği birbirine dik iki eksene koyuyor, kalan üçü öğrenilmiyor. Orta panelde seyrek durum: aynı beş özellik iki boyutta düzgün beşgenin köşelerine yerleşiyor, hiçbir çift dik değil, aralarındaki açı 72 derece, bedel girişim. Sağ panelde özellik başına boyut ölçüsünün, yani bir özelliğin kapladığı boyut payının, oturduğu basamaklar: 1 adanmış boyut, 3/4 dörtyüzlü, 2/3 üçgen, 1/2 karşıt kutuplu çift, 2/5 beşgen, 0 öğrenilmemiş özellik. Altta kural: seyreklik arttıkça model daha çok özelliği süperpozisyona alır, önce en önemsizlerini; kazanç temsil edilen özellik sayısı, bedel girişimdir ve küçük çakışmayı ReLU eşiği kırpar; geçiş kesiklidir ve oyuncak modelde ölçülmüştür.">
  <rect x="20" y="20" width="215" height="250" fill="var(--surface-muted)" />
  <text x="30" y="42" font-size="13" font-weight="bold" fill="var(--text)">yoğun: seyreklik ≈ 0</text>
  <text x="30" y="60" font-size="13" fill="var(--text-muted)">5 özellik, 2 boyut</text>
  <line x1="127" y1="165" x2="177" y2="165" stroke="var(--accent)" stroke-width="2" />
  <line x1="127" y1="165" x2="127" y2="115" stroke="var(--accent)" stroke-width="2" />
  <circle cx="127" cy="165" r="3" fill="var(--text-muted)" />
  <text x="183" y="169" font-size="13" fill="var(--text)">ö1</text>
  <text x="133" y="112" font-size="13" fill="var(--text)">ö2</text>
  <text x="30" y="222" font-size="13" fill="var(--text-faint)">ö3, ö4, ö5: yön yok</text>
  <text x="30" y="244" font-size="13" fill="var(--text)">en önemli iki özellik dik</text>
  <text x="30" y="262" font-size="13" fill="var(--text-muted)">kalan üçü öğrenilmez</text>

  <rect x="245" y="20" width="215" height="250" fill="var(--surface-muted)" />
  <text x="255" y="42" font-size="13" font-weight="bold" fill="var(--text)">seyrek: özellikler nadir</text>
  <text x="255" y="60" font-size="13" fill="var(--text-muted)">5 özellik, 2 boyut</text>
  <line x1="352" y1="165" x2="352" y2="115" stroke="var(--accent)" stroke-width="2" />
  <line x1="352" y1="165" x2="304" y2="150" stroke="var(--accent)" stroke-width="2" />
  <line x1="352" y1="165" x2="323" y2="206" stroke="var(--accent)" stroke-width="2" />
  <line x1="352" y1="165" x2="381" y2="206" stroke="var(--accent)" stroke-width="2" />
  <line x1="352" y1="165" x2="400" y2="150" stroke="var(--accent)" stroke-width="2" />
  <circle cx="352" cy="165" r="3" fill="var(--text-muted)" />
  <text x="352" y="110" font-size="13" text-anchor="middle" fill="var(--text)">ö1</text>
  <text x="299" y="146" font-size="13" text-anchor="end" fill="var(--text)">ö2</text>
  <text x="318" y="222" font-size="13" text-anchor="middle" fill="var(--text)">ö3</text>
  <text x="386" y="222" font-size="13" text-anchor="middle" fill="var(--text)">ö4</text>
  <text x="405" y="146" font-size="13" fill="var(--text)">ö5</text>
  <text x="255" y="244" font-size="13" fill="var(--text)">hiçbiri dik değil; açı 72°</text>
  <text x="255" y="262" font-size="13" fill="var(--text-muted)">bedel: girişim</text>

  <rect x="470" y="20" width="230" height="250" fill="var(--surface-muted)" />
  <text x="480" y="42" font-size="13" font-weight="bold" fill="var(--text)">özellik başına boyut</text>
  <text x="480" y="60" font-size="13" fill="var(--text-muted)">basamaklara oturuyor</text>
  <text x="480" y="92" font-size="13" fill="var(--text)">1 — adanmış boyut</text>
  <rect x="480" y="98" width="150" height="5" fill="var(--accent)" />
  <text x="480" y="122" font-size="13" fill="var(--text)">3/4 — dörtyüzlü</text>
  <rect x="480" y="128" width="113" height="5" fill="var(--accent)" />
  <text x="480" y="152" font-size="13" fill="var(--text)">2/3 — üçgen</text>
  <rect x="480" y="158" width="100" height="5" fill="var(--accent)" />
  <text x="480" y="182" font-size="13" fill="var(--text)">1/2 — karşıt kutuplu çift</text>
  <rect x="480" y="188" width="75" height="5" fill="var(--accent)" />
  <text x="480" y="212" font-size="13" fill="var(--text)">2/5 — beşgen</text>
  <rect x="480" y="218" width="60" height="5" fill="var(--accent)" />
  <text x="480" y="242" font-size="13" fill="var(--text-muted)">0 — öğrenilmemiş</text>
  <line x1="480" y1="248" x2="482" y2="248" stroke="var(--border)" stroke-width="5" />

  <line x1="20" y1="288" x2="700" y2="288" stroke="var(--border)" />
  <text x="20" y="310" font-size="13" fill="var(--text)">Seyreklik arttıkça model daha çok özelliği süperpozisyona alır — önce en önemsizlerini.</text>
  <text x="20" y="330" font-size="13" fill="var(--text)">Kazanç: temsil edilen özellik sayısı. Bedel: girişim; küçük çakışmayı ReLU eşiği kırpar.</text>
  <text x="20" y="350" font-size="13" fill="var(--text-muted)">Geçiş kesiklidir; oyuncak modelde ölçülmüştür, gerçek ağa taşınması ölçülmemiştir.</text>
</svg>
