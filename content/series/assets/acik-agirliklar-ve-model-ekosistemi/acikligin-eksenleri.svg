<svg viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Açıklık tek eksen değil</text>

  <text x="300" y="70" font-size="13" text-anchor="middle" fill="var(--text-muted)">ağırlıklar</text>
  <text x="400" y="70" font-size="13" text-anchor="middle" fill="var(--text-muted)">eğitim verisi</text>
  <text x="500" y="70" font-size="13" text-anchor="middle" fill="var(--text-muted)">kod</text>
  <text x="574" y="70" font-size="13" text-anchor="middle" fill="var(--text-muted)">lisans</text>
  <text x="654" y="70" font-size="13" text-anchor="middle" fill="var(--text-muted)">rapor</text>

  <text x="250" y="112" font-size="13" text-anchor="end" fill="var(--text)">bütün eksenlerde açık</text>
  <rect x="272" y="90" width="56" height="30" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="300" y="110" font-size="13" text-anchor="middle" fill="var(--cool)">açık</text>
  <rect x="372" y="90" width="56" height="30" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="400" y="110" font-size="13" text-anchor="middle" fill="var(--cool)">açık</text>
  <rect x="472" y="90" width="56" height="30" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="500" y="110" font-size="13" text-anchor="middle" fill="var(--cool)">açık</text>
  <rect x="546" y="90" width="56" height="30" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="574" y="110" font-size="13" text-anchor="middle" fill="var(--cool)">açık</text>
  <rect x="626" y="90" width="56" height="30" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="654" y="110" font-size="13" text-anchor="middle" fill="var(--cool)">açık</text>

  <text x="250" y="162" font-size="13" text-anchor="end" fill="var(--text)">yalnızca ağırlığı açık</text>
  <rect x="272" y="140" width="56" height="30" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="300" y="160" font-size="13" text-anchor="middle" fill="var(--cool)">açık</text>
  <rect x="372" y="140" width="56" height="30" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="400" y="160" font-size="13" text-anchor="middle" fill="var(--text-faint)">kapalı</text>
  <rect x="472" y="140" width="56" height="30" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="500" y="160" font-size="13" text-anchor="middle" fill="var(--text-faint)">kapalı</text>
  <rect x="546" y="140" width="56" height="30" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="574" y="160" font-size="13" text-anchor="middle" fill="var(--accent)">kısmi</text>
  <rect x="626" y="140" width="56" height="30" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="654" y="160" font-size="13" text-anchor="middle" fill="var(--accent)">kısmi</text>

  <text x="16" y="214" font-size="13" text-anchor="start" fill="var(--text-muted)">iki satıra da tek kelimeyle açık denebiliyor; fark ancak eksen eksen bakınca görünür</text>
  <text x="16" y="244" font-size="13" text-anchor="start" fill="var(--text-faint)">tam çerçeve on dört eksen taşır: erişilebilirlik, belgelendirme, erişim ve lisans</text>
</svg>
