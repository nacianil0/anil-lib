  <line x1="443" y1="90" x2="516" y2="90" stroke="var(--accent)" stroke-width="1"/>
  <rect x="516" y="72" width="188" height="36" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="610" y="95" font-size="13" text-anchor="middle" fill="var(--accent)">tabloya yazılan puan</text>

  <text x="295" y="252" font-size="13" text-anchor="middle" fill="var(--text-faint)">denenen sürümler</text>
  <text x="16" y="284" font-size="13" text-anchor="start" fill="var(--text-faint)">yayımlanan sonuç rastgele bir örneklem değil, birçok denemenin maksimumudur</text>
