  <text x="110" y="66" font-size="13" text-anchor="end" fill="var(--text-muted)">puan</text>

  <line x1="120" y1="230" x2="470" y2="230" stroke="var(--border)" stroke-width="1"/>

  <circle cx="150" cy="184" r="5" fill="var(--text-faint)"/>
  <circle cx="176" cy="160" r="5" fill="var(--text-faint)"/>
  <circle cx="202" cy="203" r="5" fill="var(--text-faint)"/>
  <circle cx="228" cy="147" r="5" fill="var(--text-faint)"/>
  <circle cx="254" cy="192" r="5" fill="var(--text-faint)"/>
  <circle cx="280" cy="129" r="5" fill="var(--text-faint)"/>
  <circle cx="306" cy="176" r="5" fill="var(--text-faint)"/>
  <circle cx="332" cy="212" r="5" fill="var(--text-faint)"/>
  <circle cx="358" cy="141" r="5" fill="var(--text-faint)"/>
  <circle cx="384" cy="168" r="5" fill="var(--text-faint)"/>
  <circle cx="410" cy="197" r="5" fill="var(--text-faint)"/>
