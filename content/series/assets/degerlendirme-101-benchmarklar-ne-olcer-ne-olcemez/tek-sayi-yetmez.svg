  <text x="120" y="100" font-size="14" text-anchor="middle" fill="var(--accent)">doğruluk</text>
  <text x="30" y="138" font-size="13" text-anchor="start" fill="var(--text-faint)">tek sayı, tek sıralama</text>

  <line x1="250" y1="56" x2="250" y2="312" stroke="var(--border)" stroke-width="1"/>

  <text x="284" y="64" font-size="13" text-anchor="start" fill="var(--text-muted)">her senaryo için yedi ölçü</text>
