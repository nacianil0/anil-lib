<svg viewBox="0 0 720 312" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Getirme doğruyu artırdı, güvenilirliği düşürdü</text>
  <text x="16" y="46" font-size="13" text-anchor="start" fill="var(--text-faint)">aynı model, aynı sorular; cevapların yüzdesi ve eksi puanlı güvenilirlik</text>

  <line x1="200" y1="70" x2="200" y2="216" stroke="var(--border)" stroke-width="1"/>

  <text x="190" y="102" font-size="13" text-anchor="end" fill="var(--text-muted)">yalnızca model</text>
  <rect x="200" y="80" width="101" height="12" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="400" y="90" font-size="13" text-anchor="start" fill="var(--text)">doğru 33,5</text>
  <rect x="200" y="96" width="41" height="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="400" y="106" font-size="13" text-anchor="start" fill="var(--text)">uydurma 13,5</text>
  <rect x="200" y="112" width="159" height="12" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="400" y="122" font-size="13" text-anchor="start" fill="var(--text-muted)">eksik 53,0</text>

  <text x="190" y="164" font-size="13" text-anchor="end" fill="var(--text-muted)">web getirmeli hat</text>
  <rect x="200" y="142" width="131" height="12" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="400" y="152" font-size="13" text-anchor="start" fill="var(--text)">doğru 43,6</text>
  <rect x="200" y="158" width="90" height="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="400" y="168" font-size="13" text-anchor="start" fill="var(--text)">uydurma 30,1</text>
  <rect x="200" y="174" width="79" height="12" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="400" y="184" font-size="13" text-anchor="start" fill="var(--text-muted)">eksik 26,3</text>

  <text x="520" y="90" font-size="13" text-anchor="start" fill="var(--text-faint)">güvenilirlik</text>
  <text x="520" y="108" font-size="14" text-anchor="start" fill="var(--text)">20,0</text>
  <text x="520" y="152" font-size="13" text-anchor="start" fill="var(--text-faint)">güvenilirlik</text>
  <text x="520" y="170" font-size="14" text-anchor="start" fill="var(--text)">13,4</text>
  <text x="600" y="108" font-size="13" text-anchor="start" fill="var(--text-faint)">doğru +1</text>
  <text x="600" y="126" font-size="13" text-anchor="start" fill="var(--text-faint)">uydurma −1</text>
  <text x="600" y="144" font-size="13" text-anchor="start" fill="var(--text-faint)">eksik 0</text>

  <line x1="16" y1="240" x2="704" y2="240" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="264" font-size="13" text-anchor="start" fill="var(--text-muted)">eksik cevapların yarısı doğruya, öteki yarısı uydurmaya dönüştü; uydurma eksi puan alır</text>
  <text x="16" y="286" font-size="13" text-anchor="start" fill="var(--text-faint)">güvenilirlik düştü: getirme, çekimser bir modeli kendinden emin bir yanlışçıya çevirebilir</text>
</svg>
