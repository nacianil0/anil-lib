<svg viewBox="0 0 720 332" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ok-45-katman" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)"/>
    </marker>
  </defs>
  <text x="16" y="26" font-size="14" text-anchor="start" fill="var(--text)">Hattın üç katmanı, üç hatası, üç ölçüsü</text>
  <text x="16" y="46" font-size="13" text-anchor="start" fill="var(--text-faint)">üst satır: katmanın tipik hatası · alt satır: o katmanı ölçen ölçü</text>

  <text x="112" y="84" font-size="13" text-anchor="middle" fill="var(--accent)">yanlış belge</text>
  <text x="298" y="76" font-size="13" text-anchor="middle" fill="var(--accent)">belgeyi yok sayıp</text>
  <text x="298" y="92" font-size="13" text-anchor="middle" fill="var(--accent)">ezberden cevaplama</text>
  <text x="484" y="76" font-size="13" text-anchor="middle" fill="var(--accent)">belgede olmayanı</text>
  <text x="484" y="92" font-size="13" text-anchor="middle" fill="var(--accent)">ekleme</text>

  <rect x="16" y="110" width="60" height="44" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1"/>
  <text x="46" y="136" font-size="13" text-anchor="middle" fill="var(--text)">soru</text>
  <line x1="76" y1="132" x2="90" y2="132" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-45-katman)"/>

  <rect x="92" y="110" width="112" height="44" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="148" y="136" font-size="13" text-anchor="middle" fill="var(--text)">getirme</text>
  <line x1="204" y1="132" x2="218" y2="132" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-45-katman)"/>

  <rect x="220" y="110" width="156" height="44" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="298" y="136" font-size="13" text-anchor="middle" fill="var(--text)">okuma</text>
  <line x1="376" y1="132" x2="390" y2="132" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-45-katman)"/>

  <rect x="392" y="110" width="156" height="44" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/>
  <text x="470" y="136" font-size="13" text-anchor="middle" fill="var(--text)">üretim</text>
  <line x1="548" y1="132" x2="562" y2="132" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#ok-45-katman)"/>

  <rect x="564" y="110" width="140" height="44" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
  <text x="634" y="136" font-size="13" text-anchor="middle" fill="var(--text)">cevap</text>

  <text x="148" y="182" font-size="13" text-anchor="middle" fill="var(--text-muted)">bağlam ilgililiği</text>
  <text x="148" y="198" font-size="13" text-anchor="middle" fill="var(--text-muted)">bulma oranı</text>
  <text x="384" y="182" font-size="13" text-anchor="middle" fill="var(--text-muted)">kaynak sadakati</text>
  <text x="384" y="198" font-size="13" text-anchor="middle" fill="var(--text-muted)">ifade ifade sayılır</text>
  <line x1="236" y1="206" x2="532" y2="206" stroke="var(--border)" stroke-width="1"/>
  <text x="634" y="182" font-size="13" text-anchor="middle" fill="var(--text-muted)">doğruluk</text>
  <text x="634" y="198" font-size="13" text-anchor="middle" fill="var(--text-muted)">cevap ilgililiği</text>

  <line x1="16" y1="236" x2="704" y2="236" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="260" font-size="13" text-anchor="start" fill="var(--text-muted)">tek bir doğruluk sayısı üç hatayı birbirinden ayırmaz; her katman kendi ölçüsüyle ölçülür</text>
  <text x="16" y="282" font-size="13" text-anchor="start" fill="var(--text-faint)">getirme dışsal uydurmayı içsel uydurmaya çevirir: hata artık kaynağa bakılarak denetlenebilir</text>
  <text x="16" y="304" font-size="13" text-anchor="start" fill="var(--text-faint)">ölçülerin çoğunu bir hakem model hesaplar; hakemin kendi yanlılığı ayrıca ölçülür</text>
</svg>
