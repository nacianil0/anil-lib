<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-label="Üstte 100 görevlik açıklama amaçlı düzenek: modelin emin olduğu 70 görevde model yüzde 95, emin olmadığı 30 görevde yüzde 50 doğru; insan her yerde yüzde 85, emin olunmayan bölgede bağımsız bilgiyle yüzde 80 ya da modelle aynı yerde zorlanıyorsa yüzde 55. Altta dört politika satırı: yalnız model 18,5 hata ve 0 devir; yalnız insan 15 hata ve 100 devir; emin değilse devret, insan bağımsız 9,5 hata ve 30 devir; emin değilse devret, insan modelle aynı yerde zorlanıyor 17 hata ve 30 devir.">
  <text x="20" y="26" font-size="13" font-weight="bold" fill="var(--text)">Düzenek (100 görev; sayılar açıklama amaçlı)</text>
  <rect x="20" y="36" width="330" height="74" rx="4" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="30" y="56" font-size="13" font-weight="bold" fill="var(--text)">model</text>
  <text x="30" y="76" font-size="13" fill="var(--text)">emin: 70 görev, %95 doğru → 3,5 hata</text>
  <text x="30" y="96" font-size="13" fill="var(--text)">emin değil: 30 görev, %50 doğru → 15 hata</text>
  <rect x="370" y="36" width="330" height="74" rx="4" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="380" y="56" font-size="13" font-weight="bold" fill="var(--text)">insan</text>
  <text x="380" y="76" font-size="13" fill="var(--text)">her yerde %85 doğru; her devir zaman ister</text>
  <text x="380" y="96" font-size="13" fill="var(--text)">emin-değilde: bağımsız %80 · bağıntılı %55</text>

  <text x="20" y="140" font-size="13" font-weight="bold" fill="var(--text)">politika</text>
  <text x="470" y="140" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">hata</text>
  <text x="600" y="140" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">devir</text>
  <text x="700" y="140" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">hesap</text>
  <line x1="20" y1="150" x2="700" y2="150" stroke="var(--border)" />

  <text x="20" y="176" font-size="13" fill="var(--text)">yalnız model</text>
  <rect x="330" y="166" width="74" height="10" fill="var(--accent)" />
  <text x="470" y="176" font-size="13" text-anchor="end" fill="var(--text)">18,5</text>
  <text x="600" y="176" font-size="13" text-anchor="end" fill="var(--text)">0</text>
  <text x="700" y="176" font-size="13" text-anchor="end" fill="var(--text-muted)">3,5 + 15</text>

  <text x="20" y="216" font-size="13" fill="var(--text)">yalnız insan</text>
  <rect x="330" y="206" width="60" height="10" fill="var(--accent)" />
  <text x="470" y="216" font-size="13" text-anchor="end" fill="var(--text)">15</text>
  <text x="600" y="216" font-size="13" text-anchor="end" fill="var(--text)">100</text>
  <text x="700" y="216" font-size="13" text-anchor="end" fill="var(--text-muted)">100 × 0,15</text>

  <text x="20" y="256" font-size="13" font-weight="bold" fill="var(--text)">emin değilse devret · insan bağımsız</text>
  <rect x="330" y="246" width="38" height="10" fill="var(--cool)" />
  <text x="470" y="256" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">9,5</text>
  <text x="600" y="256" font-size="13" text-anchor="end" fill="var(--text)">30</text>
  <text x="700" y="256" font-size="13" text-anchor="end" fill="var(--text-muted)">3,5 + 30 × 0,20</text>

  <text x="20" y="296" font-size="13" fill="var(--text)">emin değilse devret · insan bağıntılı</text>
  <rect x="330" y="286" width="68" height="10" fill="var(--accent)" />
  <text x="470" y="296" font-size="13" text-anchor="end" fill="var(--text)">17</text>
  <text x="600" y="296" font-size="13" text-anchor="end" fill="var(--text)">30</text>
  <text x="700" y="296" font-size="13" text-anchor="end" fill="var(--text-muted)">3,5 + 30 × 0,45</text>

  <line x1="20" y1="318" x2="700" y2="318" stroke="var(--border)" />
  <text x="20" y="342" font-size="13" fill="var(--text-muted)">Çubuk hata sayısını gösterir (20 hata = 80 birim). Devir, insanın karar verdiği görev sayısı.</text>
  <text x="20" y="360" font-size="13" fill="var(--text-muted)">Kazanç ancak insan modelin zorlandığı yerde bağımsız bir şey biliyorsa büyük;</text>
  <text x="20" y="378" font-size="13" fill="var(--text-muted)">aynı yerde zorlanıyorsa devir hatayı neredeyse düşürmez.</text>
</svg>
