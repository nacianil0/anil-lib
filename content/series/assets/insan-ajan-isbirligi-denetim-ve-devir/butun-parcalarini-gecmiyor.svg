<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-label="Altı satırlı nokta ve aralık şeması. Her satırda solda karşılaştırmanın adı, ortada sıfır çizgisi etrafında bir nokta ve yüzde 95 güven aralığı, sağda etki büyüklüğü yazar: genel, insan artı yapay zekâ ile en iyi tek başına eksi 0,23; karar görevleri eksi 0,27; üretim görevleri artı 0,19; insan tek başına daha iyiyken artı 0,46; yapay zekâ tek başına daha iyiyken eksi 0,54; insan artı yapay zekâ ile yalnız insan artı 0,64.">
  <text x="20" y="28" font-size="13" font-weight="bold" fill="var(--text)">karşılaştırma</text>
  <text x="470" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">etki büyüklüğü (Hedges g)</text>
  <text x="700" y="28" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">g</text>
  <line x1="20" y1="38" x2="700" y2="38" stroke="var(--border)" />

  <line x1="290" y1="46" x2="290" y2="306" stroke="var(--border)" stroke-dasharray="3 3" />
  <line x1="470" y1="46" x2="470" y2="306" stroke="var(--text-faint)" />
  <line x1="650" y1="46" x2="650" y2="306" stroke="var(--border)" stroke-dasharray="3 3" />

  <text x="20" y="70" font-size="13" fill="var(--text)">insan + YZ ↔ en iyi tek başına (genel)</text>
  <line x1="382" y1="66" x2="454" y2="66" stroke="var(--accent)" stroke-width="2" />
  <circle cx="418" cy="66" r="5" fill="var(--accent)" />
  <text x="700" y="70" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">−0,23</text>

  <text x="20" y="112" font-size="13" fill="var(--text)">karar görevleri</text>
  <line x1="371" y1="108" x2="448" y2="108" stroke="var(--accent)" stroke-width="2" />
  <circle cx="409" cy="108" r="5" fill="var(--accent)" />
  <text x="700" y="112" font-size="13" text-anchor="end" fill="var(--text)">−0,27</text>

  <text x="20" y="154" font-size="13" fill="var(--text)">üretim görevleri</text>
  <line x1="450" y1="150" x2="578" y2="150" stroke="var(--cool)" stroke-width="2" />
  <circle cx="513" cy="150" r="5" fill="var(--cool)" />
  <text x="700" y="154" font-size="13" text-anchor="end" fill="var(--text)">+0,19</text>

  <text x="20" y="196" font-size="13" fill="var(--text)">insan tek başına daha iyiyken</text>
  <line x1="533" y1="192" x2="619" y2="192" stroke="var(--cool)" stroke-width="2" />
  <circle cx="574" cy="192" r="5" fill="var(--cool)" />
  <text x="700" y="196" font-size="13" text-anchor="end" fill="var(--text)">+0,46</text>

  <text x="20" y="238" font-size="13" fill="var(--text)">YZ tek başına daha iyiyken</text>
  <line x1="310" y1="234" x2="387" y2="234" stroke="var(--accent)" stroke-width="2" />
  <circle cx="349" cy="234" r="5" fill="var(--accent)" />
  <text x="700" y="238" font-size="13" font-weight="bold" text-anchor="end" fill="var(--text)">−0,54</text>

  <text x="20" y="280" font-size="13" fill="var(--text)">insan + YZ ↔ yalnız insan (güçlendirme)</text>
  <line x1="589" y1="276" x2="637" y2="276" stroke="var(--cool)" stroke-width="2" />
  <circle cx="614" cy="276" r="5" fill="var(--cool)" />
  <text x="700" y="280" font-size="13" text-anchor="end" fill="var(--text)">+0,64</text>

  <text x="290" y="322" font-size="13" text-anchor="middle" fill="var(--text-muted)">−0,8</text>
  <text x="470" y="322" font-size="13" text-anchor="middle" fill="var(--text-muted)">0</text>
  <text x="650" y="322" font-size="13" text-anchor="middle" fill="var(--text-muted)">+0,8</text>

  <text x="20" y="346" font-size="13" fill="var(--text-muted)">106 deney, 370 etki büyüklüğü; çizgi yüzde 95 güven aralığı. Sıfırın sağı birleşimin lehine.</text>
  <text x="20" y="362" font-size="13" fill="var(--text-muted)">Değerler Vaccaro, Almaatouq ve Malone'un meta-analizinden.</text>
</svg>
