<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 374" role="img" aria-label="Bir zaman çizelgesi: dört satır aşama 1'den 4'e, yatayda 22 zaman dilimi. Solda ileri geçiş, sağda geri geçiş bölgesi. İleri geçişte 1'den 8'e numaralı mikro yığınlar her aşamada bir dilim kayarak ilerler; geri geçişte aynı sekiz mikro yığın ters yönde, aşama 4'ten aşama 1'e doğru kayarak geçer. Kesikli çizgili boş dilimler hattın dolarken ve boşalırken oluşan kabarcıktır: aşama 4'ün başında üç boş dilim, aşama 1'in ortasında altı boş dilim. Altta hesap: her aşama 16 dilim çalışır, 6 dilim bekler; boş bölü dolu 6 bölü 16, yani 3 bölü 8, yani p eksi 1 bölü m. m 32 olsaydı oran 3 bölü 32, yaklaşık yüzde 9 olurdu. Kayıt: biçim şematiktir, ileri ve geri geçiş eşit süreli çizilmiştir.">
