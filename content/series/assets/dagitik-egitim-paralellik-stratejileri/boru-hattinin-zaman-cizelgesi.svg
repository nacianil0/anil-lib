  <text x="20.0" y="280.0" font-size="13" fill="var(--text)">Her aşama 2m = 16 dilim çalışıyor; hat dolarken ve boşalırken 2(p − 1) = 6 dilim bekliyor.</text>
  <text x="20.0" y="304.0" font-size="13" font-weight="bold" fill="var(--accent)">Boş ÷ dolu = 6 ÷ 16 = 3 ÷ 8 = (p − 1) ÷ m</text>
  <text x="20.0" y="328.0" font-size="13" fill="var(--text-muted)">m = 32 olsaydı bekleyen yine 6, çalışan 64 dilim olurdu: 3 ÷ 32, yaklaşık yüzde 9.</text>
  <text x="20.0" y="360.0" font-size="13" fill="var(--text-faint)">Biçim şematiktir: ileri ve geri geçiş eşit süreli çizildi; oran bu varsayıma bağlı değildir.</text>
