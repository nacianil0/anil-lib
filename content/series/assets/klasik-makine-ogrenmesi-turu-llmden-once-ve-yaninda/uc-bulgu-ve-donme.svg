<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" role="img" aria-label="İki panelli şekil; iki panelde de aynı kurgusal noktalar vardır: dolu daireler bir sınıf, içi boş daireler öbür sınıf. Sol panelde iki sınıfı dikey bir çizgi ayırır, yani tek bir özniteliğe konan tek bir eşik; ağaç için bu tek bölmedir. Sağ panelde aynı noktalar 45 derece döndürülmüştür; sınıfları ayıran sınır artık köşegen bir kesikli çizgidir ve eksene paralel bölmeler onu ancak beş basamaklı bir merdivenle yaklaşık izleyebilir, her basamak ayrı bir bölmedir. Altta kayıtlar: döndürmeye göre değişmeyen bir ağ için iki panel aynı problemdir, ağaç için değildir; noktalar kurgusaldır ve Grinsztajn ve arkadaşlarının ölçümünü değil mekanizmasını gösterir.">
  <text x="40" y="28" font-size="13" font-weight="bold" fill="var(--text)">eksene paralel sınır</text>
  <text x="390" y="28" font-size="13" font-weight="bold" fill="var(--text)">aynı veri 45 derece döndürülmüş</text>

  <rect x="40" y="44" width="290" height="282" fill="var(--surface)" stroke="var(--border)" />
  <rect x="390" y="44" width="290" height="282" fill="var(--surface)" stroke="var(--border)" />

  <line x1="185" y1="52" x2="185" y2="318" stroke="var(--accent)" stroke-width="2.5" />
  <text x="193" y="66" font-size="13" fill="var(--accent)">x₁ = eşik</text>

  <line x1="444" y1="94" x2="626" y2="276" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="5 4" />
  <polyline points="450,100 450,134 484,134 484,168 518,168 518,202 552,202 552,236 586,236 586,270 620,270" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" />

  <circle cx="145" cy="265" r="5" fill="var(--accent)" /> <circle cx="84" cy="183" r="5" fill="var(--accent)" /> <circle cx="80" cy="200" r="5" fill="var(--accent)" /> <circle cx="99" cy="248" r="5" fill="var(--accent)" /> <circle cx="141" cy="113" r="5" fill="var(--accent)" /> <circle cx="112" cy="166" r="5" fill="var(--accent)" /> <circle cx="143" cy="165" r="5" fill="var(--accent)" /> <circle cx="127" cy="168" r="5" fill="var(--accent)" /> <circle cx="106" cy="188" r="5" fill="var(--accent)" /> <circle cx="80" cy="147" r="5" fill="var(--accent)" /> <circle cx="85" cy="139" r="5" fill="var(--accent)" /> <circle cx="159" cy="147" r="5" fill="var(--accent)" /> <circle cx="76" cy="194" r="5" fill="var(--accent)" /> <circle cx="100" cy="243" r="5" fill="var(--accent)" /> <circle cx="160" cy="100" r="5" fill="var(--accent)" />
