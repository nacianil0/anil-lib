  <text x="40" y="348" font-size="13" fill="var(--text)">tek bölme yeter: x₁ &lt; eşik mi?</text>
  <text x="390" y="348" font-size="13" fill="var(--text)">merdivenle: her basamak bir bölme</text>

  <text x="20" y="386" font-size="13" fill="var(--text-muted)">Döndürmeye göre değişmeyen bir ağ için iki panel aynı problemdir; ağaç için değil.</text>
  <text x="20" y="406" font-size="13" fill="var(--text-faint)">Noktalar kurgusal bir örnektir: ölçümü değil, bulgunun mekanizmasını gösterir.</text>
</svg>
