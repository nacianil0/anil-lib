<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="İki panelli geometrik şekil. Sol panelde A matrisi, satırları 3 1 ve 1 3: kesikli çizilmiş birim çember, A'dan geçince eksenleri çapraz duran bir elipse dönüşür; uzun yarı ekseni 4 birim ve (1; 1) yönünde, kısa yarı ekseni 2 birim ve (1; −1) yönündedir. Yarı eksenler tekil değerler 4 ve 2'dir; aynı eksenler A'nın özvektörleri, özdeğerler de 4 ve 2'dir. Sağ panelde B matrisi, satırları 0 2 ve 0 0: aynı birim çember yatay eksende −2'den 2'ye uzanan bir doğru parçasına ezilir; (0; 1) vektörü (2; 0)'a gider. En uzun yarı eksen 2, öbürü 0, yani tekil değerler 2 ve 0; özdeğerler ise 0 ve 0'dır. Altta iki kayıt: tekil değerler birim çemberin gittiği şeklin yarı eksenleridir; özdeğerler yalnızca yönü korunan vektörlere bakar ve B'nin gerdirmesini göremez.">
  <defs>
    <marker id="ok-92-gerdirme" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)" />
    </marker>
  </defs>

  <text x="20" y="28" font-size="13" font-weight="bold" fill="var(--text)">A = satırları (3; 1) ve (1; 3)</text>
  <text x="380" y="28" font-size="13" font-weight="bold" fill="var(--text)">B = satırları (0; 2) ve (0; 0)</text>
  <line x1="365" y1="14" x2="365" y2="344" stroke="var(--border)" />

  <!-- sol panel: birim çember elipse gider (1 birim = 30) -->
  <line x1="60" y1="205" x2="330" y2="205" stroke="var(--border)" />
  <line x1="180" y1="70" x2="180" y2="330" stroke="var(--border)" />
  <circle cx="180" cy="205" r="30" fill="none" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="4 3" />
  <ellipse cx="180" cy="205" rx="120" ry="60" transform="rotate(-45 180 205)" fill="var(--accent-soft)" fill-opacity="0.5" stroke="var(--accent)" stroke-width="2" />
  <line x1="180" y1="205" x2="263" y2="122" stroke="var(--accent)" stroke-width="2" marker-end="url(#ok-92-gerdirme)" />
  <line x1="180" y1="205" x2="220" y2="245" stroke="var(--cool)" stroke-width="2" marker-end="url(#ok-92-gerdirme)" />
  <text x="272" y="112" font-size="13" font-weight="bold" fill="var(--accent)">σ₁ = 4</text>
  <text x="272" y="130" font-size="13" fill="var(--text-muted)">yön (1; 1)</text>
  <text x="238" y="262" font-size="13" font-weight="bold" fill="var(--cool)">σ₂ = 2</text>
  <text x="238" y="280" font-size="13" fill="var(--text-muted)">yön (1; −1)</text>
  <text x="66" y="92" font-size="13" fill="var(--text-faint)">birim çember</text>
  <line x1="120" y1="98" x2="160" y2="182" stroke="var(--text-faint)" />

  <text x="20" y="366" font-size="13" fill="var(--text)">çember elipse döner: tekil değerler 4 ve 2</text>
  <text x="20" y="386" font-size="13" fill="var(--text-muted)">aynı eksenler özvektörler; özdeğerler de 4 ve 2</text>

  <!-- sağ panel: birim çember doğru parçasına ezilir -->
  <line x1="410" y1="205" x2="680" y2="205" stroke="var(--border)" />
  <line x1="540" y1="70" x2="540" y2="330" stroke="var(--border)" />
  <circle cx="540" cy="205" r="30" fill="none" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="480" y1="205" x2="600" y2="205" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" />
  <line x1="540" y1="205" x2="540" y2="178" stroke="var(--cool)" stroke-width="2" marker-end="url(#ok-92-gerdirme)" />
  <path d="M 546 172 Q 590 150 598 196" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ok-92-gerdirme)" />
  <text x="486" y="164" font-size="13" fill="var(--cool)">(0; 1)</text>
  <text x="608" y="190" font-size="13" fill="var(--accent)">(2; 0)</text>
  <text x="474" y="232" font-size="13" fill="var(--text-muted)">−2</text>
  <text x="596" y="232" font-size="13" fill="var(--text-muted)">2</text>

  <text x="380" y="366" font-size="13" fill="var(--text)">parçaya ezilir: tekil değerler 2 ve 0</text>
  <text x="380" y="386" font-size="13" fill="var(--text-muted)">özdeğerler 0 ve 0: gerdirmeyi göremezler</text>

  <text x="20" y="414" font-size="13" fill="var(--text-muted)">Tekil değerler, birim çemberin gittiği şeklin yarı eksenleridir.</text>
  <text x="20" y="432" font-size="13" fill="var(--text-faint)">Kesikli çizgi birim çemberdir; çizim ölçeklidir ve iki matristen hesaplandı.</text>
</svg>
