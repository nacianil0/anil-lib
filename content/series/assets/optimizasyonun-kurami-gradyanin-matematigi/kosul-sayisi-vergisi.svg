  <text x="20" y="374" font-size="13" fill="var(--text-muted)">Eşyükselti çizgileri f = ½(w₁² + 20w₂²) çanağının; iki eksen aynı ölçekte, koşul sayısı 20.</text>
  <text x="20" y="396" font-size="13" fill="var(--text-faint)">Yollar hesaplandı: gradyan inişi α = 0,0952; momentum α = 0,1336, β = 0,4026.</text>
