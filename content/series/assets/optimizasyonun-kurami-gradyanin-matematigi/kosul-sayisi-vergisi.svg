<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-label="Uzun ve dar bir vadinin eşyükselti çizgileri üzerinde iki eniyileme yolu. Çanak f eşittir yarım çarpı w1 kare artı 20 w2 kare; iki eksen aynı ölçekte, koşul sayısı 20, eşyükselti elipsleri yatayda uzun, düşeyde dar. Sağda (20; 1) başlangıç noktası, solda (0; 0) en iyi nokta. Gradyan inişinin yolu her adımda dar eksende işaret değiştirerek yukarı aşağı savrulur ve uzun eksen boyunca küçük adımlarla sürünür; başlangıç uzaklığının yüzde birine 47 adımda iner. Momentumun yolu ilk adımlarda daha geniş salınır ama uzun eksende çok daha büyük adımlar atar; yüzde bire 15 adımda iner. Her iki yolda adımlar noktayla işaretlidir; onuncu adımda momentum en iyi noktaya neredeyse varmışken gradyan inişi uzun eksenin ortasındadır. Altta kayıtlar: eşyükselti çizgileri çanağındır; yollar gradyan inişi için alfa 0,0952, momentum için alfa 0,1336 ve beta 0,4026 ile hesaplanmıştır.">
