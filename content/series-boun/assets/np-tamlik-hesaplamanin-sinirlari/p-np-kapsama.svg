<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
  <text x="15" y="22" font-size="13" fill="var(--text-muted)">P ≠ NP varsayımı altında</text>

  <rect x="170" y="42" width="175" height="150" rx="6" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
  <path d="M 170 47 A 120 72 0 0 1 170 187 Z" fill="var(--accent-soft)" stroke="none" />
  <ellipse cx="145" cy="117" rx="120" ry="72" fill="none" stroke="var(--cool)" stroke-width="1.8" />
  <path d="M 170 47 A 120 72 0 0 1 170 187 Z" fill="none" stroke="var(--accent)" stroke-width="1.4" />
  <ellipse cx="85" cy="117" rx="48" ry="38" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4" />

  <text x="108" y="62" font-size="13" fill="var(--text)">NP</text>
  <text x="278" y="62" font-size="13" fill="var(--text)">NP-zor</text>
  <text x="85" y="112" font-size="13" text-anchor="middle" fill="var(--text)">P</text>
  <text x="85" y="133" font-size="13" text-anchor="middle" fill="var(--text-muted)">en kısa yol</text>
  <text x="207" y="122" font-size="13" text-anchor="middle" fill="var(--text)">NP-tam</text>

  <text x="15" y="222" font-size="13" fill="var(--text-faint)">P: en kısa yol · 2-SAT · 2-boyama</text>
  <text x="15" y="242" font-size="13" fill="var(--text-faint)">NP-tam: 3SAT · altküme toplamı · 3-boyama</text>
  <text x="15" y="262" font-size="13" fill="var(--text-faint)">NP-zor, NP'de değil: durma problemi</text>
  <text x="15" y="284" font-size="13" fill="var(--text)">NP-tam = NP ∩ NP-zor</text>

  <line x1="362" y1="36" x2="362" y2="296" stroke="var(--border)" stroke-width="1" />

  <text x="378" y="22" font-size="13" fill="var(--text-muted)">P = NP olsaydı</text>

  <rect x="392" y="42" width="313" height="150" rx="6" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" stroke-dasharray="5 4" />
  <ellipse cx="478" cy="117" rx="78" ry="62" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8" />

  <text x="478" y="112" font-size="13" text-anchor="middle" fill="var(--text)">P = NP</text>
  <text x="478" y="134" font-size="13" text-anchor="middle" fill="var(--text)">= NP-tam</text>
  <text x="600" y="62" font-size="13" fill="var(--text)">NP-zor</text>
  <text x="588" y="130" font-size="13" fill="var(--text-muted)">durma problemi</text>

  <text x="378" y="222" font-size="13" fill="var(--text-faint)">Her NP problemi polinom zamanda çözülür</text>
  <text x="378" y="242" font-size="13" fill="var(--text-faint)">Zorluk varsayımlı kriptografi çöker</text>
  <text x="378" y="262" font-size="13" fill="var(--text-faint)">NP-zorun NP dışı kısmı değişmez</text>
  <text x="378" y="284" font-size="13" fill="var(--text)">Durma problemi yine çözülemez</text>

  <text x="15" y="312" font-size="13" fill="var(--text-faint)">NP-zor NP'nin dışına taşar: NP-zor olmak NP'de olmayı gerektirmez</text>
</svg>
