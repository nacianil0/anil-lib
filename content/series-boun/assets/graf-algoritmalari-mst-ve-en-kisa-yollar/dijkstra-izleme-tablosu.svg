<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" font-size="13" fill="var(--text-muted)">Dijkstra, kaynak A · kenarlar: A–B 4, A–C 3, A–E 7, B–C 2, B–D 5, C–E 6, D–E 1</text>

  <text x="105" y="60" font-size="13" text-anchor="middle" fill="var(--text-faint)">kuyruktan çıkan</text>
  <text x="240" y="60" font-size="13" text-anchor="middle" fill="var(--text-faint)">A</text>
  <text x="330" y="60" font-size="13" text-anchor="middle" fill="var(--text-faint)">B</text>
  <text x="420" y="60" font-size="13" text-anchor="middle" fill="var(--text-faint)">C</text>
  <text x="510" y="60" font-size="13" text-anchor="middle" fill="var(--text-faint)">D</text>
  <text x="600" y="60" font-size="13" text-anchor="middle" fill="var(--text-faint)">E</text>
  <line x1="20" y1="70" x2="660" y2="70" stroke="var(--border)" stroke-width="1" />

  <text x="105" y="94" font-size="13" text-anchor="middle" fill="var(--text-muted)">başlangıç</text>
  <text x="240" y="94" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <text x="330" y="94" font-size="13" text-anchor="middle" fill="var(--text-faint)">∞</text>
  <text x="420" y="94" font-size="13" text-anchor="middle" fill="var(--text-faint)">∞</text>
  <text x="510" y="94" font-size="13" text-anchor="middle" fill="var(--text-faint)">∞</text>
  <text x="600" y="94" font-size="13" text-anchor="middle" fill="var(--text-faint)">∞</text>

  <rect x="216" y="106" width="48" height="22" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.2" />
  <text x="105" y="122" font-size="13" text-anchor="middle" fill="var(--text)">A · 0</text>
  <text x="240" y="122" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <text x="330" y="122" font-size="13" text-anchor="middle" fill="var(--text)">4</text>
  <text x="420" y="122" font-size="13" text-anchor="middle" fill="var(--text)">3</text>
  <text x="510" y="122" font-size="13" text-anchor="middle" fill="var(--text-faint)">∞</text>
  <text x="600" y="122" font-size="13" text-anchor="middle" fill="var(--text)">7</text>

  <rect x="396" y="138" width="48" height="22" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.2" />
  <text x="105" y="154" font-size="13" text-anchor="middle" fill="var(--text)">C · 3</text>
  <text x="240" y="154" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <text x="330" y="154" font-size="13" text-anchor="middle" fill="var(--text)">4</text>
  <text x="420" y="154" font-size="13" text-anchor="middle" fill="var(--text)">3</text>
  <text x="510" y="154" font-size="13" text-anchor="middle" fill="var(--text-faint)">∞</text>
  <text x="600" y="154" font-size="13" text-anchor="middle" fill="var(--text)">7</text>

  <rect x="306" y="170" width="48" height="22" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.2" />
  <text x="105" y="186" font-size="13" text-anchor="middle" fill="var(--text)">B · 4</text>
  <text x="240" y="186" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <text x="330" y="186" font-size="13" text-anchor="middle" fill="var(--text)">4</text>
  <text x="420" y="186" font-size="13" text-anchor="middle" fill="var(--text)">3</text>
  <text x="510" y="186" font-size="13" text-anchor="middle" fill="var(--text)">9</text>
  <text x="600" y="186" font-size="13" text-anchor="middle" fill="var(--text)">7</text>

  <rect x="576" y="202" width="48" height="22" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.2" />
  <rect x="486" y="202" width="48" height="22" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="105" y="218" font-size="13" text-anchor="middle" fill="var(--text)">E · 7</text>
  <text x="240" y="218" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <text x="330" y="218" font-size="13" text-anchor="middle" fill="var(--text)">4</text>
  <text x="420" y="218" font-size="13" text-anchor="middle" fill="var(--text)">3</text>
  <text x="510" y="218" font-size="13" text-anchor="middle" fill="var(--text)">8</text>
  <text x="600" y="218" font-size="13" text-anchor="middle" fill="var(--text)">7</text>
  <text x="640" y="218" font-size="13" fill="var(--accent)">9 → 8</text>

  <rect x="486" y="234" width="48" height="22" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.2" />
  <text x="105" y="250" font-size="13" text-anchor="middle" fill="var(--text)">D · 8</text>
  <text x="240" y="250" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <text x="330" y="250" font-size="13" text-anchor="middle" fill="var(--text)">4</text>
  <text x="420" y="250" font-size="13" text-anchor="middle" fill="var(--text)">3</text>
  <text x="510" y="250" font-size="13" text-anchor="middle" fill="var(--text)">8</text>
  <text x="600" y="250" font-size="13" text-anchor="middle" fill="var(--text)">7</text>

  <line x1="20" y1="266" x2="660" y2="266" stroke="var(--border)" stroke-width="1" />
  <text x="20" y="288" font-size="13" fill="var(--text-faint)">C çıkarken hiçbir tahmin düşmez: C üzerinden B 5, E 9 ederdi, ikisi de mevcut değerden iyi değil.</text>
  <text x="20" y="310" font-size="13" fill="var(--text-muted)">Kesinleşen tahmin kutulu. D'nin tahmini 9'dan 8'e düşüyor: bu bir azalt_anahtar çağrısıdır.</text>
</svg>
