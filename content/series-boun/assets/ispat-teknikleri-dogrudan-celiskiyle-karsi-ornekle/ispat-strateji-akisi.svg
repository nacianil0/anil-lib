<svg viewBox="0 0 720 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a3-strateji-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <rect x="40" y="24" width="300" height="44" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="190" y="52" font-size="14" text-anchor="middle" fill="var(--text)">İddia: p → q</text>

  <line x1="190" y1="70" x2="190" y2="96" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-strateji-ok)" />

  <rect x="40" y="100" width="300" height="58" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="190" y="124" font-size="14" text-anchor="middle" fill="var(--text)">p&#39;yi varsayıp q&#39;ya</text>
  <text x="190" y="146" font-size="14" text-anchor="middle" fill="var(--text)">doğrudan yürüyebiliyor musun?</text>

  <line x1="342" y1="129" x2="416" y2="129" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-strateji-ok)" />
  <text x="379" y="119" font-size="13" text-anchor="middle" fill="var(--accent)">evet</text>

  <rect x="420" y="100" width="260" height="58" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="550" y="124" font-size="14" text-anchor="middle" fill="var(--text)">Doğrudan ispat</text>
  <text x="550" y="146" font-size="13" text-anchor="middle" fill="var(--text-muted)">p&#39;yi varsay, q&#39;ya yürü</text>

  <line x1="190" y1="160" x2="190" y2="192" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-strateji-ok)" />
  <text x="202" y="181" font-size="13" fill="var(--text-muted)">hayır</text>

  <rect x="40" y="196" width="300" height="58" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="190" y="220" font-size="14" text-anchor="middle" fill="var(--text)">¬q&#39;dan ¬p&#39;ye yürümek</text>
  <text x="190" y="242" font-size="14" text-anchor="middle" fill="var(--text)">daha kolay mı?</text>

  <line x1="342" y1="225" x2="416" y2="225" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-strateji-ok)" />
  <text x="379" y="215" font-size="13" text-anchor="middle" fill="var(--accent)">evet</text>

  <rect x="420" y="196" width="260" height="58" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="550" y="220" font-size="14" text-anchor="middle" fill="var(--text)">Karşıt tersiyle ispat</text>
  <text x="550" y="242" font-size="13" text-anchor="middle" fill="var(--text-muted)">¬q&#39;yu varsay, ¬p&#39;ye yürü</text>

  <line x1="190" y1="256" x2="190" y2="288" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-strateji-ok)" />
  <text x="202" y="277" font-size="13" fill="var(--text-muted)">hayır</text>

  <rect x="40" y="292" width="300" height="58" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="190" y="316" font-size="14" text-anchor="middle" fill="var(--text)">Çelişkiyle ispat</text>
  <text x="190" y="338" font-size="13" text-anchor="middle" fill="var(--text-muted)">p ∧ ¬q varsay, çelişki üret</text>

  <text x="360" y="380" font-size="13" text-anchor="middle" fill="var(--text-muted)">İddia ∀x P(x) biçimindeyse ve doğruluğundan şüpheliysen, önce tek bir karşı örnek ara</text>
</svg>
