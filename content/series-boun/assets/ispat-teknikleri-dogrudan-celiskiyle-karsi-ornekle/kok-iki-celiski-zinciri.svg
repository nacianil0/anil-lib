<svg viewBox="0 0 720 452" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a3-kokiki-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <rect x="50" y="24" width="620" height="46" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="360" y="53" font-size="14" text-anchor="middle" fill="var(--text)">Varsay: √2 = a / b, ortak bölenleri yok</text>

  <line x1="360" y1="72" x2="360" y2="92" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-kokiki-ok)" />

  <rect x="50" y="96" width="620" height="46" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="360" y="125" font-size="14" text-anchor="middle" fill="var(--text)">Kare al: a² = 2b², yani a² çift</text>

  <line x1="360" y1="144" x2="360" y2="164" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-kokiki-ok)" />

  <rect x="50" y="168" width="620" height="46" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="360" y="197" font-size="14" text-anchor="middle" fill="var(--text)">Lemma: a² çift ise a çift, yani a = 2k</text>

  <line x1="360" y1="216" x2="360" y2="236" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-kokiki-ok)" />

  <rect x="50" y="240" width="620" height="46" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="360" y="269" font-size="14" text-anchor="middle" fill="var(--text)">Yerine koy: b² = 2k², aynı lemmayla b de çift</text>

  <line x1="360" y1="288" x2="360" y2="308" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-kokiki-ok)" />

  <rect x="50" y="312" width="620" height="46" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="360" y="341" font-size="14" text-anchor="middle" fill="var(--text)">a ve b ikisi de çift: ortak bölen 2 — varsayımla çelişki</text>

  <line x1="360" y1="360" x2="360" y2="380" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a3-kokiki-ok)" />

  <rect x="50" y="384" width="620" height="46" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="360" y="413" font-size="14" text-anchor="middle" fill="var(--text)">Sonuç: √2 rasyonel değildir</text>
</svg>
