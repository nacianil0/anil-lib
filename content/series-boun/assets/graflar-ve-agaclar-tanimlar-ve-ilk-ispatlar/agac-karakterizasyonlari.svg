  <text x="360" y="300" font-size="13" text-anchor="middle" fill="var(--text-muted)">döngü kenarını sil; bağlı graf n − 1 kenardan aşağı inemez</text>

  <text x="360" y="352" font-size="13" text-anchor="middle" fill="var(--text-muted)">Halka kapandığı için üç ifade denktir; ispata elindeki bilgiye en yakın oktan başla</text>
