<svg viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a7-halka-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <rect x="240" y="34" width="240" height="64" rx="8" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.4" />
  <text x="360" y="60" font-size="14" text-anchor="middle" fill="var(--text)">1 — Bağlı ve döngüsüz</text>
  <text x="360" y="82" font-size="13" text-anchor="middle" fill="var(--text-muted)">tanım gereği: ağaç</text>

  <rect x="450" y="200" width="250" height="68" rx="8" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.4" />
  <text x="575" y="228" font-size="14" text-anchor="middle" fill="var(--text)">2 — Bağlı ve tam olarak</text>
  <text x="575" y="250" font-size="14" text-anchor="middle" fill="var(--text)">n − 1 kenarlı</text>

  <rect x="20" y="200" width="250" height="68" rx="8" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.4" />
  <text x="145" y="228" font-size="14" text-anchor="middle" fill="var(--text)">3 — Her düğüm ikilisi</text>
  <text x="145" y="250" font-size="14" text-anchor="middle" fill="var(--text)">arasında tam bir yol</text>

  <line x1="455" y1="102" x2="566" y2="194" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#boun-a7-halka-ok)" />
  <line x1="444" y1="234" x2="278" y2="234" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#boun-a7-halka-ok)" />
  <line x1="154" y1="194" x2="265" y2="102" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#boun-a7-halka-ok)" />

  <text x="506" y="140" font-size="13" fill="var(--text-muted)">yaprak silen</text>
  <text x="506" y="160" font-size="13" fill="var(--text-muted)">tümevarım</text>

  <text x="214" y="140" font-size="13" text-anchor="end" fill="var(--text-muted)">iki farklı yol</text>
