<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <text x="15" y="22" font-size="13" fill="var(--text-muted)">Sanal adres 21 → fiziksel adres 117</text>

  <text x="15" y="53" font-size="13" fill="var(--text)">sanal</text>
  <rect x="80" y="35" width="26" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="93" y="53" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <rect x="106" y="35" width="26" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="119" y="53" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <rect x="132" y="35" width="26" height="26" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="145" y="53" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <rect x="158" y="35" width="26" height="26" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="171" y="53" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <rect x="184" y="35" width="26" height="26" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="197" y="53" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <rect x="210" y="35" width="26" height="26" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="223" y="53" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <line x1="80" y1="66" x2="132" y2="66" stroke="var(--accent)" stroke-width="2" />
  <line x1="132" y1="66" x2="236" y2="66" stroke="var(--text-faint)" stroke-width="2" />
  <text x="106" y="81" font-size="13" text-anchor="middle" fill="var(--accent)">VPN</text>
  <text x="184" y="81" font-size="13" text-anchor="middle" fill="var(--text-muted)">ofset</text>

  <text x="80" y="107" font-size="13" fill="var(--text-muted)">sanal sayfa → çerçeve</text>
  <text x="15" y="129" font-size="13" fill="var(--text)">tablo</text>
  <text x="80" y="129" font-size="13" fill="var(--text-muted)">0 → 3</text>
  <text x="145" y="129" font-size="13" fill="var(--accent)">1 → 7</text>
  <text x="210" y="129" font-size="13" fill="var(--text-muted)">2 → 5</text>
  <text x="275" y="129" font-size="13" fill="var(--text-muted)">3 → 2</text>

  <text x="15" y="171" font-size="13" fill="var(--text)">fiziksel</text>
  <rect x="80" y="153" width="26" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="93" y="171" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <rect x="106" y="153" width="26" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="119" y="171" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <rect x="132" y="153" width="26" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="145" y="171" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <rect x="158" y="153" width="26" height="26" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="171" y="171" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <rect x="184" y="153" width="26" height="26" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="197" y="171" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <rect x="210" y="153" width="26" height="26" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="223" y="171" font-size="13" text-anchor="middle" fill="var(--text)">0</text>
  <rect x="236" y="153" width="26" height="26" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="249" y="171" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <line x1="80" y1="184" x2="158" y2="184" stroke="var(--accent)" stroke-width="2" />
  <line x1="158" y1="184" x2="262" y2="184" stroke="var(--text-faint)" stroke-width="2" />
  <text x="119" y="199" font-size="13" text-anchor="middle" fill="var(--accent)">çerçeve no</text>
  <text x="210" y="199" font-size="13" text-anchor="middle" fill="var(--text-muted)">ofset</text>

  <text x="80" y="227" font-size="13" fill="var(--text)">7 × 16 + 5 = 117</text>
  <text x="80" y="247" font-size="13" fill="var(--text-muted)">64 baytlık uzay, 16 baytlık sayfa</text>

  <line x1="340" y1="32" x2="340" y2="256" stroke="var(--border)" stroke-width="1" />

  <text x="356" y="22" font-size="13" fill="var(--text-muted)">Sayfalamanın iki bedeli</text>

  <text x="356" y="53" font-size="13" fill="var(--text)">1 · Tablo büyük</text>
  <text x="356" y="77" font-size="13" fill="var(--text-muted)">32 bit adres, 4KB sayfa, 4 baytlık girdi:</text>
  <text x="356" y="95" font-size="13" fill="var(--text-muted)">1.048.576 girdi = 4 MB; 100 süreçte 400 MB.</text>

  <text x="356" y="129" font-size="13" fill="var(--text)">2 · Erişim yavaş</text>
  <text x="356" y="153" font-size="13" fill="var(--text-muted)">Her sanal erişim iki fiziksel erişime döner:</text>
  <text x="356" y="171" font-size="13" fill="var(--text-muted)">önce tablo girdisi, sonra verinin kendisi.</text>

  <text x="356" y="205" font-size="13" fill="var(--accent)">Çareleri sırayla: çok düzeyli tablo ve TLB.</text>
  <text x="356" y="229" font-size="13" fill="var(--text-muted)">Sayfa tablosu bir dizi; indisi sanal sayfa no.</text>

  <text x="15" y="272" font-size="13" fill="var(--text)">Ofset hiçbir zaman çevrilmez: sayfa içindeki kaçıncı bayt olduğunu söyler, sayfanın yerini değil.</text>
  <text x="15" y="290" font-size="13" fill="var(--text-muted)">Sayfalama dış parçalanma üretmez; bedeli son sayfanın kullanılmayan kısmıdır — iç parçalanma.</text>
</svg>
