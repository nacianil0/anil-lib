  <text x="15" y="248" font-size="13" fill="var(--text)">Üç koşul: karşılıklı dışlama, ilerleme, sınırlı bekleme.</text>
  <text x="15" y="266" font-size="13" fill="var(--text-muted)">Kritik kesiminin dışında duran bir süreç, ötekilerin özgürlüğünü kısıtlamamalıdır.</text>
  <text x="15" y="284" font-size="13" fill="var(--text-faint)">Kaba kuvvetle tarandı: bayrakta 57 durumun içinde ihlal var, test-and-set'te 5 durumda yok.</text>
