<svg viewBox="0 0 720 164" xmlns="http://www.w3.org/2000/svg">
  <text x="21" y="26" font-size="13" fill="var(--text-muted)">Mülakat 35 gün sonraysa</text>

  <line x1="60" y1="50" x2="640" y2="50" stroke="var(--border)" stroke-width="1.5" />

  <circle cx="60" cy="50" r="5" fill="var(--accent)" />
  <circle cx="193" cy="50" r="5" fill="var(--accent)" />
  <circle cx="391" cy="50" r="5" fill="var(--surface)" stroke="var(--cool)" stroke-width="1.5" />
  <circle cx="557" cy="50" r="5" fill="var(--surface)" stroke="var(--cool)" stroke-width="1.5" />
  <circle cx="640" cy="50" r="5" fill="var(--accent)" />

  <text x="60" y="76" font-size="13" text-anchor="middle" fill="var(--text)">0 · ilk okuma</text>
  <text x="391" y="76" font-size="13" text-anchor="middle" fill="var(--text-muted)">20 · ikinci tur</text>
  <text x="640" y="76" font-size="13" text-anchor="middle" fill="var(--text)">35 · mülakat günü</text>

  <text x="193" y="98" font-size="13" text-anchor="middle" fill="var(--text)">8 · ilk geri çağırma</text>
  <text x="557" y="98" font-size="13" text-anchor="middle" fill="var(--text-muted)">30 · üçüncü tur</text>

  <text x="21" y="132" font-size="13" fill="var(--text-faint)">Sekizinci gün, 35 günlük hedef için kaynağın ara değerli tahminidir.</text>
  <text x="21" y="152" font-size="13" fill="var(--text-faint)">İçi boş dairelerle gösterilen yirminci ve otuzuncu gün turları kendi genişletmemdir.</text>
</svg>
