<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a31a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="15" y="22" font-size="13" fill="var(--text-muted)">İki kilitli en küçük kilitlenme</text>

  <line x1="125" y1="73" x2="226" y2="73" stroke="var(--accent)" stroke-width="2" marker-end="url(#boun-a31a-ok)" />
  <text x="175" y="66" font-size="13" text-anchor="middle" fill="var(--text-muted)">bekliyor</text>
  <line x1="265" y1="91" x2="265" y2="141" stroke="var(--accent)" stroke-width="2" marker-end="url(#boun-a31a-ok)" />
  <text x="272" y="120" font-size="13" fill="var(--text-muted)">sahibi</text>
  <line x1="230" y1="163" x2="129" y2="163" stroke="var(--accent)" stroke-width="2" marker-end="url(#boun-a31a-ok)" />
  <text x="179" y="182" font-size="13" text-anchor="middle" fill="var(--text-muted)">bekliyor</text>
  <line x1="90" y1="145" x2="90" y2="95" stroke="var(--accent)" stroke-width="2" marker-end="url(#boun-a31a-ok)" />
  <text x="97" y="120" font-size="13" fill="var(--text-muted)">sahibi</text>

  <rect x="55" y="55" width="70" height="36" rx="5" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.4" />
  <text x="90" y="78" font-size="13" text-anchor="middle" fill="var(--text)">T1</text>
  <rect x="230" y="55" width="70" height="36" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="265" y="78" font-size="13" text-anchor="middle" fill="var(--text)">L2</text>
  <rect x="55" y="145" width="70" height="36" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="90" y="168" font-size="13" text-anchor="middle" fill="var(--text)">L1</text>
  <rect x="230" y="145" width="70" height="36" rx="5" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.4" />
  <text x="265" y="168" font-size="13" text-anchor="middle" fill="var(--text)">T2</text>

  <text x="15" y="212" font-size="13" fill="var(--text)">T1 L1'i tutup L2'yi, T2 L2'yi tutup L1'i ister.</text>
  <text x="15" y="230" font-size="13" fill="var(--text-muted)">Dört ok kapalı bir döngü oluşturur.</text>

  <line x1="362" y1="32" x2="362" y2="240" stroke="var(--border)" stroke-width="1" />

  <text x="378" y="22" font-size="13" fill="var(--text-muted)">Dört koşul ve her birini kaldırmanın yolu</text>

  <text x="378" y="60" font-size="13" fill="var(--text)">1 · Karşılıklı dışlama</text>
  <text x="392" y="78" font-size="13" fill="var(--text-muted)">kaldır: kilitsiz veri yapısı (CAS)</text>
  <text x="378" y="104" font-size="13" fill="var(--text)">2 · Elde tutup bekleme</text>
  <text x="392" y="122" font-size="13" fill="var(--text-muted)">kaldır: bütün kilitleri tek seferde al</text>
  <text x="378" y="148" font-size="13" fill="var(--text)">3 · Önkesmesizlik</text>
  <text x="392" y="166" font-size="13" fill="var(--text-muted)">kaldır: deneme kilidiyle geri çekil</text>
  <text x="378" y="192" font-size="13" fill="var(--accent)">4 · Döngüsel bekleme</text>
  <text x="392" y="210" font-size="13" fill="var(--accent)">kaldır: küresel kilit sırası koy</text>
  <text x="378" y="230" font-size="13" fill="var(--text-muted)">Pratikte en çok kullanılan dördüncüsüdür.</text>

  <text x="15" y="262" font-size="13" fill="var(--text)">Dördünden biri sağlanmazsa kilitlenme olamaz; dördü birden sağlansa bile olmak zorunda değildir.</text>
  <text x="15" y="280" font-size="13" fill="var(--text-muted)">Kaba kuvvetle taradım: ters sırada 19 erişilebilir durumun yalnızca 1'i kilitlenme;</text>
  <text x="15" y="296" font-size="13" fill="var(--text-muted)">aynı sırada alındığında 16 durumun hiçbiri kilitlenme değil.</text>
</svg>
