<svg viewBox="0 0 720 306" xmlns="http://www.w3.org/2000/svg">
  <text x="15" y="22" font-size="13" fill="var(--text-muted)">Dijkstra'nın örneği: toplam sermaye 100 sayfa</text>

  <text x="15" y="52" font-size="13" fill="var(--text-muted)">süreç</text>
  <text x="85" y="52" font-size="13" fill="var(--text-muted)">ihtiyaç</text>
  <text x="165" y="52" font-size="13" fill="var(--text-muted)">borç</text>
  <text x="225" y="52" font-size="13" fill="var(--text-muted)">kalan istek</text>
  <text x="15" y="76" font-size="13" fill="var(--text)">P1</text>
  <text x="85" y="76" font-size="13" fill="var(--text)">80</text>
  <text x="165" y="76" font-size="13" fill="var(--text)">40</text>
  <text x="225" y="76" font-size="13" fill="var(--text)">40</text>
  <text x="15" y="100" font-size="13" fill="var(--text)">P2</text>
  <text x="85" y="100" font-size="13" fill="var(--text)">60</text>
  <text x="165" y="100" font-size="13" fill="var(--text)">20</text>
  <text x="225" y="100" font-size="13" fill="var(--text)">40</text>
  <line x1="15" y1="112" x2="330" y2="112" stroke="var(--border)" stroke-width="1" />
  <text x="15" y="134" font-size="13" fill="var(--text)">kasa = 100 − 60 = 40</text>
  <rect x="15" y="148" width="110" height="26" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="70" y="166" font-size="13" text-anchor="middle" fill="var(--text)">GÜVENLİ</text>

  <line x1="362" y1="32" x2="362" y2="178" stroke="var(--border)" stroke-width="1" />

  <text x="378" y="22" font-size="13" fill="var(--text-muted)">İkisine de birer sayfa daha verilirse</text>

  <text x="378" y="52" font-size="13" fill="var(--text-muted)">süreç</text>
  <text x="448" y="52" font-size="13" fill="var(--text-muted)">ihtiyaç</text>
  <text x="528" y="52" font-size="13" fill="var(--text-muted)">borç</text>
  <text x="588" y="52" font-size="13" fill="var(--text-muted)">kalan istek</text>
  <text x="378" y="76" font-size="13" fill="var(--text)">P1</text>
  <text x="448" y="76" font-size="13" fill="var(--text)">80</text>
  <text x="528" y="76" font-size="13" fill="var(--text)">41</text>
  <text x="588" y="76" font-size="13" fill="var(--text)">39</text>
  <text x="378" y="100" font-size="13" fill="var(--text)">P2</text>
  <text x="448" y="100" font-size="13" fill="var(--text)">60</text>
  <text x="528" y="100" font-size="13" fill="var(--text)">21</text>
  <text x="588" y="100" font-size="13" fill="var(--text)">39</text>
  <line x1="378" y1="112" x2="693" y2="112" stroke="var(--border)" stroke-width="1" />
  <text x="378" y="134" font-size="13" fill="var(--text)">kasa = 100 − 62 = 38</text>
  <rect x="378" y="148" width="110" height="26" rx="5" fill="var(--surface-muted)" stroke="var(--text-muted)" stroke-width="1.4" />
  <text x="433" y="166" font-size="13" text-anchor="middle" fill="var(--text)">GÜVENSİZ</text>

  <text x="15" y="204" font-size="13" fill="var(--text)">Güvenlik denetimi: kasa, en az bir sürecin kalan isteğini karşılıyor mu? Karşılıyorsa o süreç</text>
  <text x="15" y="222" font-size="13" fill="var(--text)">bitirilir ve borcunu geri verir; kasa büyür ve sonraki süreç denenir.</text>
  <text x="15" y="240" font-size="13" fill="var(--text)">Hepsi bitebiliyorsa durum güvenlidir. Burada kasa 38, iki kalan istek de 39: hiçbiri bitemez.</text>
  <text x="15" y="262" font-size="13" fill="var(--text-muted)">Yalnızca birine verilseydi kasa 39 olurdu, o süreç bitip borcunu geri verirdi — güvenli.</text>
  <text x="15" y="280" font-size="13" fill="var(--accent)">Güvensiz durum kilitlenmiş durum değildir; kilitlenmenin artık mümkün olduğu durumdur.</text>
  <text x="15" y="298" font-size="13" fill="var(--text-muted)">Sayılar Dijkstra'nın kendi örneğindendir; güvenlik denetimini kendi programımla doğruladım.</text>
</svg>
