  <text x="378" y="214" font-size="13" fill="var(--text)">0 numaralı çatalı P4 önce alır</text>
  <text x="378" y="232" font-size="13" fill="var(--text-muted)">o kenarın yönü değişir, döngü kapanamaz</text>

  <text x="15" y="260" font-size="13" fill="var(--text)">Kaba kuvvet taraması: naif kurulumda 82 erişilebilir durumun içinde kilitlenme var,</text>
