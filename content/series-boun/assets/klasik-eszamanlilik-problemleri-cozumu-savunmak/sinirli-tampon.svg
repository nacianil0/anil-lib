<svg viewBox="0 0 720 285" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a30-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
    <marker id="boun-a30-ok-soluk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-faint)" />
    </marker>
  </defs>

  <text x="15" y="22" font-size="13" fill="var(--text-muted)">Sınırlı tampon</text>
  <text x="15" y="44" font-size="13" fill="var(--text)">MAX = 4 · sayaç = 2</text>
  <text x="200" y="44" font-size="13" fill="var(--text-faint)">modülo ile sarmalar</text>

  <path d="M 302 64 L 302 54 L 30 54 L 30 64" fill="none" stroke="var(--text-faint)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#boun-a30-ok-soluk)" />

  <rect x="30" y="64" width="62" height="34" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="61" y="86" font-size="13" text-anchor="middle" fill="var(--text)">dolu</text>
  <rect x="100" y="64" width="62" height="34" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="131" y="86" font-size="13" text-anchor="middle" fill="var(--text)">dolu</text>
  <rect x="170" y="64" width="62" height="34" rx="3" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="201" y="86" font-size="13" text-anchor="middle" fill="var(--text-faint)">boş</text>
  <rect x="240" y="64" width="62" height="34" rx="3" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="271" y="86" font-size="13" text-anchor="middle" fill="var(--text-faint)">boş</text>

  <line x1="61" y1="118" x2="61" y2="102" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#boun-a30-ok)" />
  <text x="61" y="134" font-size="13" text-anchor="middle" fill="var(--text)">al indisi</text>
  <line x1="201" y1="118" x2="201" y2="102" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#boun-a30-ok)" />
  <text x="201" y="134" font-size="13" text-anchor="middle" fill="var(--text)">koy indisi</text>

  <text x="20" y="162" font-size="13" fill="var(--text)">üretici bekler: sayaç == MAX</text>
  <text x="20" y="182" font-size="13" fill="var(--text)">tüketici bekler: sayaç == 0</text>
  <text x="20" y="202" font-size="13" fill="var(--text-muted)">iki koşul değişkeni: boş ve dolu</text>
  <text x="20" y="222" font-size="13" fill="var(--text-faint)">üretici boş'u bekler, dolu'yu bildirir</text>
  <text x="20" y="242" font-size="13" fill="var(--text-faint)">tüketici dolu'yu bekler, boş'u bildirir</text>

  <line x1="362" y1="32" x2="362" y2="240" stroke="var(--border)" stroke-width="1" />

  <text x="378" y="22" font-size="13" fill="var(--text-muted)">İki hata, iki iz</text>

  <rect x="378" y="32" width="327" height="86" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="386" y="52" font-size="13" fill="var(--text)">Tek koşul değişkeni</text>
  <text x="386" y="72" font-size="13" fill="var(--text-muted)">tüketici bir öğe alıp bildirim yapar</text>
  <text x="386" y="90" font-size="13" fill="var(--text-muted)">bildirim öteki tüketiciye gider</text>
  <text x="386" y="108" font-size="13" fill="var(--text-faint)">o yeniden uyur: üçü de uykuda</text>

  <rect x="378" y="128" width="327" height="104" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="386" y="148" font-size="13" fill="var(--text)">Semaforlarda yanlış sıra</text>
  <text x="386" y="168" font-size="13" fill="var(--text-muted)">tüketici önce kilidi alır</text>
  <text x="386" y="186" font-size="13" fill="var(--text-muted)">sonra dolu'yu bekler, kilidi tutar</text>
  <text x="386" y="204" font-size="13" fill="var(--text-muted)">üretici kilidi bekler: ikisi de bloke</text>
  <text x="386" y="222" font-size="13" fill="var(--text)">doğrusu: kilit en içte, sayaçlar dışta</text>

  <text x="15" y="262" font-size="13" fill="var(--text)">Kaba kuvvet taraması: kilit en dıştayken 14 durumun içinde kilitlenme var,</text>
  <text x="15" y="280" font-size="13" fill="var(--text-muted)">kilit en içteyken 10 durumun hiçbirinde yok.</text>
</svg>
