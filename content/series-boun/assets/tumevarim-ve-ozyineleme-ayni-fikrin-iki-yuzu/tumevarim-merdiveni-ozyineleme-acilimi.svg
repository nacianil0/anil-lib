  <line x1="360" y1="28" x2="360" y2="330" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4" />

  <text x="170" y="40" font-size="15" text-anchor="middle" fill="var(--text)">Tümevarım — ispat yönü</text>
