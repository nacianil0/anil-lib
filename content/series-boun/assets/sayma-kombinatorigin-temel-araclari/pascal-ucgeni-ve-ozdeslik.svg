  <text x="560" y="60" font-size="15" text-anchor="middle" fill="var(--text)">Pascal özdeşliği</text>
  <text x="560" y="100" font-size="14" text-anchor="middle" fill="var(--text)">C(n, k) = C(n − 1, k − 1) + C(n − 1, k)</text>
  <text x="560" y="140" font-size="13" text-anchor="middle" fill="var(--text-muted)">Örnek: C(5, 2) = C(4, 1) + C(4, 2)</text>
  <text x="560" y="162" font-size="13" text-anchor="middle" fill="var(--text-muted)">yani 10 = 4 + 6</text>

  <text x="560" y="212" font-size="13" text-anchor="middle" fill="var(--text)">Kombinatoryal ispat:</text>
  <text x="560" y="234" font-size="13" text-anchor="middle" fill="var(--text-muted)">bir elemanı sabitle.</text>
  <text x="560" y="256" font-size="13" text-anchor="middle" fill="var(--text-muted)">k elemanlı altkümeler ya</text>
  <text x="560" y="278" font-size="13" text-anchor="middle" fill="var(--text-muted)">onu içerir ya da içermez.</text>

  <text x="360" y="328" font-size="13" text-anchor="middle" fill="var(--text-muted)">Her sayı üstündeki iki sayının toplamıdır; satır toplamları 2 üzeri n verir</text>
