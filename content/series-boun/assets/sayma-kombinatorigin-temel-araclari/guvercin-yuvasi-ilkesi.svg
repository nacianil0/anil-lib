<svg viewBox="0 0 720 336" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a6-guvercin-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="360" y="34" font-size="15" text-anchor="middle" fill="var(--text)">Güvercin yuvası: 5 nesne, 4 kutu</text>

  <circle cx="150" cy="80" r="17" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="150" y="85" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <circle cx="250" cy="80" r="17" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="250" y="85" font-size="13" text-anchor="middle" fill="var(--text)">2</text>
  <circle cx="350" cy="80" r="17" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="350" y="85" font-size="13" text-anchor="middle" fill="var(--text)">3</text>
  <circle cx="450" cy="80" r="17" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="450" y="85" font-size="13" text-anchor="middle" fill="var(--text)">4</text>
  <circle cx="550" cy="80" r="17" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="550" y="85" font-size="13" text-anchor="middle" fill="var(--text)">5</text>

  <line x1="150" y1="99" x2="170" y2="184" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#boun-a6-guvercin-ok)" />
  <line x1="250" y1="99" x2="300" y2="184" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#boun-a6-guvercin-ok)" />
  <line x1="350" y1="99" x2="424" y2="184" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#boun-a6-guvercin-ok)" />
  <line x1="450" y1="99" x2="436" y2="184" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#boun-a6-guvercin-ok)" />
  <line x1="550" y1="99" x2="560" y2="184" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#boun-a6-guvercin-ok)" />

  <rect x="120" y="190" width="100" height="46" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="170" y="218" font-size="13" text-anchor="middle" fill="var(--text-muted)">kutu 1</text>
  <rect x="250" y="190" width="100" height="46" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="300" y="218" font-size="13" text-anchor="middle" fill="var(--text-muted)">kutu 2</text>
  <rect x="380" y="190" width="100" height="46" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="430" y="218" font-size="13" text-anchor="middle" fill="var(--text)">kutu 3</text>
  <rect x="510" y="190" width="100" height="46" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="560" y="218" font-size="13" text-anchor="middle" fill="var(--text-muted)">kutu 4</text>

  <text x="430" y="258" font-size="13" text-anchor="middle" fill="var(--accent)">en az iki nesne</text>

  <text x="360" y="296" font-size="13" text-anchor="middle" fill="var(--text)">Genel biçim: N nesne k kutuya konursa bir kutuda en az N/k üst tam sayısı kadar nesne olur</text>
  <text x="360" y="318" font-size="13" text-anchor="middle" fill="var(--text-muted)">Örnek: 100 kişi, 12 ay — en az dokuz kişi aynı ayda doğmuştur</text>
</svg>
