  </defs>

  <text x="120" y="32" font-size="13" text-anchor="middle" fill="var(--text)">eklemeden sonra: zikzak</text>
  <text x="360" y="32" font-size="13" text-anchor="middle" fill="var(--text)">1. adım: 1'de sola dönüş</text>
  <text x="600" y="32" font-size="13" text-anchor="middle" fill="var(--text)">2. adım: 3'te sağa dönüş</text>

  <line x1="140" y1="80" x2="90" y2="150" stroke="var(--border)" stroke-width="1.6" />
  <line x1="90" y1="150" x2="130" y2="220" stroke="var(--border)" stroke-width="1.6" />
  <circle cx="140" cy="80" r="20" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" />
  <circle cx="90" cy="150" r="20" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.6" />
  <circle cx="130" cy="220" r="20" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="140" y="85" font-size="14" text-anchor="middle" fill="var(--text)">3</text>
