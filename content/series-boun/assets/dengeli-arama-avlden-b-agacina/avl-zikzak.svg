  <text x="416" y="85" font-size="13" fill="var(--accent)">−2</text>
  <text x="366" y="155" font-size="13" fill="var(--text-muted)">−1</text>
  <text x="316" y="225" font-size="13" fill="var(--text-muted)">0</text>

  <line x1="450" y1="140" x2="505" y2="140" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#boun-a12-avl-ok)" />

