  <text x="550" y="155" font-size="14" text-anchor="middle" fill="var(--text)">1</text>
  <text x="650" y="155" font-size="14" text-anchor="middle" fill="var(--text)">3</text>
  <text x="626" y="85" font-size="13" fill="var(--text-muted)">0</text>
  <text x="576" y="155" font-size="13" fill="var(--text-muted)">0</text>
  <text x="676" y="155" font-size="13" fill="var(--text-muted)">0</text>

  <text x="20" y="268" font-size="13" fill="var(--text-muted)">düğüm yanındaki sayı: eğim = sağ alt ağacın yüksekliği − sol alt ağacın yüksekliği</text>
  <text x="20" y="292" font-size="13" fill="var(--text-muted)">zikzak: 3'ün eğimi −2, çocuğu 1'in eğimi +1; önce çocuk döndürülür, bozulma tek yöne iner</text>
  <text x="20" y="316" font-size="13" fill="var(--text)">sıralı dolaşma her adımda 1, 2, 3; yalnız 3'te sağa dönüş yetmez: 1 kök olur, eğimi +2 olur</text>
