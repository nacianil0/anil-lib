  <text x="270" y="282" font-size="13" text-anchor="middle" fill="var(--text-muted)">n yaprak</text>

  <text x="460" y="88" font-size="13" fill="var(--text)">2⁰ · n = n</text>
  <text x="460" y="136" font-size="13" fill="var(--text)">2¹ · (n/2) = n</text>
  <text x="460" y="184" font-size="13" fill="var(--text)">2² · (n/4) = n</text>
  <text x="460" y="224" font-size="13" fill="var(--text-muted)">…</text>
  <text x="460" y="264" font-size="13" fill="var(--text)">toplam = (log₂ n + 1) · n</text>
  <text x="460" y="286" font-size="13" fill="var(--accent)">= Θ(n log n)</text>

  <line x1="20" y1="308" x2="700" y2="308" stroke="var(--border)" stroke-width="1" />
  <text x="20" y="332" font-size="13" fill="var(--text)">seviye i: aⁱ alt problem, her biri n/bⁱ boyutunda</text>
  <text x="20" y="356" font-size="13" fill="var(--text)">derinlik = log_b n · yaprak sayısı = a^(log_b n) = n^(log_b a)</text>
</svg>
