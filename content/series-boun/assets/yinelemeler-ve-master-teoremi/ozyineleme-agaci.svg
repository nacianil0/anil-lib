  <text x="270" y="87" font-size="13" text-anchor="middle" fill="var(--text)">n</text>

  <rect x="110" y="118" width="156" height="24" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <rect x="274" y="118" width="156" height="24" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
