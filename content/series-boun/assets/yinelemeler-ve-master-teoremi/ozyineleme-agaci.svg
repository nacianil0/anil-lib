<svg viewBox="0 0 720 368" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="24" font-size="13" fill="var(--text-muted)">T(n) = 2T(n/2) + n: her seviyede aynı iş, log₂ n seviye</text>

