<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="24" font-size="13" fill="var(--text-muted)">aynı soru, üç cevap: özyineleme ağacında iş nerede birikiyor?</text>

  <text x="126" y="52" font-size="13" text-anchor="middle" fill="var(--text)">Durum 1 — yapraklar</text>
  <text x="359" y="52" font-size="13" text-anchor="middle" fill="var(--text)">Durum 2 — dengede</text>
  <text x="592" y="52" font-size="13" text-anchor="middle" fill="var(--text)">Durum 3 — kök</text>

  <polygon points="126,72 41,196 211,196" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <polygon points="61.6,166 190.4,166 211,196 41,196" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />

  <polygon points="359,72 274,196 444,196" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <line x1="342.6" y1="96" x2="375.4" y2="96" stroke="var(--accent)" stroke-width="3" />
  <line x1="325.4" y1="121" x2="392.6" y2="121" stroke="var(--accent)" stroke-width="3" />
  <line x1="308.3" y1="146" x2="409.7" y2="146" stroke="var(--accent)" stroke-width="3" />
  <line x1="291.1" y1="171" x2="426.9" y2="171" stroke="var(--accent)" stroke-width="3" />
  <line x1="277.4" y1="191" x2="440.6" y2="191" stroke="var(--accent)" stroke-width="3" />

  <polygon points="592,72 507,196 677,196" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <polygon points="592,72 613.9,104 570.1,104" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />

  <text x="126" y="222" font-size="13" text-anchor="middle" fill="var(--text)">T(n) = 4T(n/2) + Θ(n)</text>
  <text x="359" y="222" font-size="13" text-anchor="middle" fill="var(--text)">T(n) = 2T(n/2) + Θ(n)</text>
  <text x="592" y="222" font-size="13" text-anchor="middle" fill="var(--text)">T(n) = 2T(n/2) + Θ(n²)</text>

  <text x="126" y="246" font-size="13" text-anchor="middle" fill="var(--accent)">Θ(n²)</text>
  <text x="359" y="246" font-size="13" text-anchor="middle" fill="var(--accent)">Θ(n log n)</text>
  <text x="592" y="246" font-size="13" text-anchor="middle" fill="var(--accent)">Θ(n²)</text>

  <text x="126" y="270" font-size="13" text-anchor="middle" fill="var(--text-muted)">iş yapraklarda</text>
  <text x="359" y="270" font-size="13" text-anchor="middle" fill="var(--text-muted)">her seviyede eşit</text>
  <text x="592" y="270" font-size="13" text-anchor="middle" fill="var(--text-muted)">iş kökte</text>

  <line x1="20" y1="292" x2="700" y2="292" stroke="var(--border)" stroke-width="1" />
  <text x="20" y="316" font-size="13" fill="var(--text)">üç durumu ayıran ölçüt: g(n) ile n^(log_b a) karşılaştırması</text>
  <text x="20" y="340" font-size="13" fill="var(--text-muted)">Durum 3 ayrıca düzenlilik koşulunu ister: a · g(n/b) &lt; c · g(n), c &lt; 1</text>
</svg>
