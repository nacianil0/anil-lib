<svg viewBox="0 0 720 306" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a2-denk-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="30" y="26" font-size="13" fill="var(--text-muted)">Aynı satırdakiler denktir; farklı satırdakiler denk değildir</text>

  <rect x="40" y="52" width="270" height="76" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="175" y="82" font-size="14" text-anchor="middle" fill="var(--text)">Koşullu (conditional)</text>
  <text x="175" y="108" font-size="14" text-anchor="middle" fill="var(--text-muted)">p → q</text>

  <rect x="410" y="52" width="270" height="76" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="545" y="82" font-size="14" text-anchor="middle" fill="var(--text)">Karşıt ters (contrapositive)</text>
  <text x="545" y="108" font-size="14" text-anchor="middle" fill="var(--text-muted)">¬q → ¬p</text>

  <rect x="40" y="190" width="270" height="76" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="175" y="220" font-size="14" text-anchor="middle" fill="var(--text)">Karşıt (converse)</text>
  <text x="175" y="246" font-size="14" text-anchor="middle" fill="var(--text-muted)">q → p</text>

  <rect x="410" y="190" width="270" height="76" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="545" y="220" font-size="14" text-anchor="middle" fill="var(--text)">Ters (inverse)</text>
  <text x="545" y="246" font-size="14" text-anchor="middle" fill="var(--text-muted)">¬p → ¬q</text>

  <line x1="316" y1="94" x2="404" y2="94" stroke="var(--accent)" stroke-width="1.5" marker-start="url(#boun-a2-denk-ok)" marker-end="url(#boun-a2-denk-ok)" />
  <text x="360" y="84" font-size="13" text-anchor="middle" fill="var(--accent)">denk</text>

  <line x1="316" y1="232" x2="404" y2="232" stroke="var(--accent)" stroke-width="1.5" marker-start="url(#boun-a2-denk-ok)" marker-end="url(#boun-a2-denk-ok)" />
  <text x="360" y="222" font-size="13" text-anchor="middle" fill="var(--accent)">denk</text>

  <line x1="175" y1="132" x2="175" y2="186" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="186" y="163" font-size="13" fill="var(--text-faint)">denk değil</text>

  <line x1="545" y1="132" x2="545" y2="186" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="556" y="163" font-size="13" fill="var(--text-faint)">denk değil</text>

  <text x="360" y="292" font-size="13" text-anchor="middle" fill="var(--text-muted)">Bir iddiayı karşıt tersiyle ispatlamak, kendisini ispatlamaktır</text>
</svg>
