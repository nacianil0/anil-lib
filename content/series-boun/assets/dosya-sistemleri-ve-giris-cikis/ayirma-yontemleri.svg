  <rect x="360" y="222" width="30" height="30" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" />
  <text x="375" y="242" font-size="13" text-anchor="middle" fill="var(--text)">D3</text>
  <rect x="393" y="222" width="30" height="30" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <rect x="426" y="222" width="30" height="30" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <rect x="459" y="222" width="30" height="30" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <rect x="492" y="222" width="30" height="30" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" />
  <text x="507" y="242" font-size="13" text-anchor="middle" fill="var(--text)">D4</text>
  <text x="535" y="242" font-size="13" fill="var(--cool)">rastgele: ≤ 2 okuma</text>
  <text x="15" y="274" font-size="13" fill="var(--text-muted)">adresler tek yerde; büyük dosya dolaylı blok ister, bedeli dosya başına meta veridir</text>

  <text x="15" y="304" font-size="13" fill="var(--text-faint)">Üçü de dizi ile bağlı liste arasındaki eski takasın disk ölçeğindeki hâlidir.</text>
