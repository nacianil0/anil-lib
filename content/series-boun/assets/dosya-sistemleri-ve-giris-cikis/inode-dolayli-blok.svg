  <rect x="15" y="240" width="690" height="94" rx="6" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="30" y="262" font-size="13" fill="var(--text)">12 doğrudan × 4 KB = 48 KB</text>
  <text x="30" y="284" font-size="13" fill="var(--text)">+ tekli dolaylı: 1024 blok daha → toplam 4.144 KB</text>
  <text x="30" y="306" font-size="13" fill="var(--text)">+ çiftli dolaylı: 1024 × 1024 blok daha → toplam 4,004 GB</text>
  <text x="30" y="328" font-size="13" fill="var(--text)">+ üçlü dolaylı: 1024 × 1024 × 1024 blok daha → toplam ≈ 4 TB</text>

  <text x="15" y="358" font-size="13" fill="var(--text-muted)">Ağaç bilerek dengesizdir: ölçümlerde en yaygın dosya boyutu yaklaşık 2 KB'dır.</text>
  <text x="15" y="378" font-size="13" fill="var(--text-muted)">1 GB'lık bir dosyada dolaylı blokların maliyeti 257 blok — veri hacminin yaklaşık %0,1'i.</text>
