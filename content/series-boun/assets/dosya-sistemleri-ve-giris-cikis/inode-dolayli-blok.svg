  <text x="85" y="70" font-size="13" text-anchor="middle" fill="var(--text-muted)">inode</text>
  <text x="27" y="91" font-size="13" fill="var(--text)">12 doğrudan</text>
  <text x="27" y="139" font-size="13" fill="var(--text)">tekli dolaylı</text>
  <text x="27" y="187" font-size="13" fill="var(--text)">çiftli dolaylı</text>
  <text x="27" y="208" font-size="13" fill="var(--text-faint)">üçlü dolaylı</text>

