  <rect x="200" y="72" width="96" height="28" rx="5" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="248" y="90" font-size="13" text-anchor="middle" fill="var(--text)">veri bloğu</text>

  <text x="262" y="114" font-size="13" text-anchor="middle" fill="var(--text-faint)">her biri 1024 işaretçi taşır</text>

