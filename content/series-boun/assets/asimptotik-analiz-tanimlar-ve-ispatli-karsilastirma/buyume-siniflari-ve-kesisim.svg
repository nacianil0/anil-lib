  <text x="20" y="330" font-size="13" fill="var(--text)">a &lt; b iken nᵃ = o(nᵇ) · her ε &gt; 0 için log n = o(nᵋ) · a &gt; 1 iken nᵇ = o(aⁿ)</text>
  <text x="20" y="354" font-size="13" fill="var(--text)">n = 100 iken 1000n = 100.000 ama n² = 10.000; kesişim tam n = 1000 noktasındadır</text>
  <text x="20" y="378" font-size="13" fill="var(--text-muted)">log₂ n ile n^0,1 ise ancak n ≈ 10¹⁷·⁷ dolayında kesişir</text>
