<svg viewBox="0 0 720 344" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="24" font-size="13" fill="var(--text-muted)">f(n) = Θ(g(n)): iki sabit, bir eşik ve eşiğin solunda hiçbir iddia</text>

  <rect x="70" y="58" width="190" height="212" fill="var(--surface-muted)" stroke="none" />

  <polygon points="260,211.8 690,80 690,190 260,245.5" fill="var(--accent-soft)" stroke="none" />

  <line x1="70" y1="58" x2="70" y2="270" stroke="var(--border)" stroke-width="1.3" />
  <line x1="70" y1="270" x2="700" y2="270" stroke="var(--border)" stroke-width="1.3" />
  <text x="30" y="52" font-size="13" fill="var(--text-muted)">maliyet</text>
  <text x="704" y="274" font-size="13" fill="var(--text-muted)">n</text>

  <line x1="70" y1="270" x2="690" y2="80" stroke="var(--accent)" stroke-width="1.6" />
  <line x1="70" y1="270" x2="690" y2="190" stroke="var(--cool)" stroke-width="1.6" />

  <polyline points="70,256 120,226 163,222 206,224 244,222 260,218 318,206 411,182 504,165 597,135 690,110" fill="none" stroke="var(--text)" stroke-width="2" />

  <line x1="260" y1="58" x2="260" y2="270" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="5 4" />
  <text x="260" y="290" font-size="13" text-anchor="middle" fill="var(--text)">n₀</text>

  <text x="686" y="72" font-size="13" text-anchor="end" fill="var(--accent)">c₂ · g(n)</text>
  <text x="686" y="104" font-size="13" text-anchor="end" fill="var(--text)">f(n)</text>
  <text x="686" y="184" font-size="13" text-anchor="end" fill="var(--cool)">c₁ · g(n)</text>

  <text x="20" y="316" font-size="13" fill="var(--text)">eşiğin solunda f, üst sınırın üstüne çıkabilir — tanım orayı kapsamaz</text>
  <text x="20" y="338" font-size="13" fill="var(--text-muted)">üst eğri tek başına O · alt eğri tek başına Ω · ikisi birden Θ</text>
</svg>
