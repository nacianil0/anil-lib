  <text x="15" y="200" font-size="13" fill="var(--text-muted)">dolu kare = isabet, boş kare = ıska; erişim dizisi 0 1 2 0 1 3 0 3 1 2 1</text>

  <text x="15" y="230" font-size="13" fill="var(--text)">LRU bu dizide optimalle aynı sonucu veriyor; FIFO sık kullanılanı yalnızca eski diye atıyor.</text>
  <text x="15" y="252" font-size="13" fill="var(--text-muted)">Belady anomalisi: FIFO 1,2,3,4,1,2,5,1,2,3,4,5 dizisinde 3 çerçevede 9, 4 çerçevede 10 ıska yapar.</text>
  <text x="15" y="274" font-size="13" fill="var(--text-muted)">Aynı dizide LRU 3 çerçevede 10, 4 çerçevede 8 ıska yapar; kapsama özelliği anomaliyi engeller.</text>
  <text x="15" y="296" font-size="13" fill="var(--accent)">Sayılar kendi programımdan; kaynağın verdiği isabet oranlarıyla birebir uyuşuyor.</text>
