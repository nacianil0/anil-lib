<svg viewBox="0 0 720 285" xmlns="http://www.w3.org/2000/svg">
  <text x="15" y="22" font-size="13" fill="var(--text-muted)">Karar ağacı: iç düğüm bir karşılaştırma, yaprak bir çıktı</text>

  <line x1="190" y1="66" x2="100" y2="94" stroke="var(--border)" stroke-width="1.2" />
  <line x1="190" y1="66" x2="280" y2="94" stroke="var(--border)" stroke-width="1.2" />
  <line x1="100" y1="116" x2="45" y2="144" stroke="var(--border)" stroke-width="1.2" />
  <line x1="100" y1="116" x2="150" y2="144" stroke="var(--border)" stroke-width="1.2" />
  <line x1="280" y1="116" x2="225" y2="144" stroke="var(--border)" stroke-width="1.2" />
  <line x1="280" y1="116" x2="330" y2="144" stroke="var(--border)" stroke-width="1.2" />
  <line x1="150" y1="166" x2="115" y2="194" stroke="var(--border)" stroke-width="1.2" />
  <line x1="150" y1="166" x2="185" y2="194" stroke="var(--border)" stroke-width="1.2" />
  <line x1="330" y1="166" x2="295" y2="194" stroke="var(--border)" stroke-width="1.2" />
  <line x1="330" y1="166" x2="365" y2="194" stroke="var(--border)" stroke-width="1.2" />

  <text x="132" y="86" font-size="13" fill="var(--text-faint)">&lt;</text>
  <text x="240" y="86" font-size="13" fill="var(--text-faint)">≥</text>
  <text x="62" y="136" font-size="13" fill="var(--text-faint)">&lt;</text>
  <text x="132" y="136" font-size="13" fill="var(--text-faint)">≥</text>
  <text x="242" y="136" font-size="13" fill="var(--text-faint)">&lt;</text>
  <text x="312" y="136" font-size="13" fill="var(--text-faint)">≥</text>
  <text x="122" y="186" font-size="13" fill="var(--text-faint)">&lt;</text>
  <text x="172" y="186" font-size="13" fill="var(--text-faint)">≥</text>
  <text x="302" y="186" font-size="13" fill="var(--text-faint)">&lt;</text>
  <text x="352" y="186" font-size="13" fill="var(--text-faint)">≥</text>

  <rect x="166" y="44" width="48" height="22" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="190" y="60" font-size="13" text-anchor="middle" fill="var(--text)">a : b</text>
  <rect x="76" y="94" width="48" height="22" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="100" y="110" font-size="13" text-anchor="middle" fill="var(--text)">b : c</text>
  <rect x="256" y="94" width="48" height="22" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="280" y="110" font-size="13" text-anchor="middle" fill="var(--text)">a : c</text>
  <rect x="126" y="144" width="48" height="22" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="150" y="160" font-size="13" text-anchor="middle" fill="var(--text)">a : c</text>
  <rect x="306" y="144" width="48" height="22" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="330" y="160" font-size="13" text-anchor="middle" fill="var(--text)">b : c</text>

  <rect x="23" y="144" width="44" height="22" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3" />
  <text x="45" y="160" font-size="13" text-anchor="middle" fill="var(--text)">abc</text>
  <rect x="203" y="144" width="44" height="22" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3" />
  <text x="225" y="160" font-size="13" text-anchor="middle" fill="var(--text)">bac</text>
  <rect x="93" y="194" width="44" height="22" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3" />
  <text x="115" y="210" font-size="13" text-anchor="middle" fill="var(--text)">acb</text>
  <rect x="163" y="194" width="44" height="22" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3" />
  <text x="185" y="210" font-size="13" text-anchor="middle" fill="var(--text)">cab</text>
  <rect x="273" y="194" width="44" height="22" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3" />
  <text x="295" y="210" font-size="13" text-anchor="middle" fill="var(--text)">bca</text>
  <rect x="343" y="194" width="44" height="22" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3" />
  <text x="365" y="210" font-size="13" text-anchor="middle" fill="var(--text)">cba</text>

  <text x="15" y="238" font-size="13" fill="var(--text-faint)">a : b, a ile b karşılaştırılır · 6 yaprak · yükseklik 3</text>
  <text x="15" y="258" font-size="13" fill="var(--text-faint)">3! = 6 ve lg 6 ≈ 2,58 olduğundan en az 3 karşılaştırma</text>

  <line x1="390" y1="36" x2="390" y2="264" stroke="var(--border)" stroke-width="1" />

  <text x="405" y="22" font-size="13" fill="var(--text-muted)">Alt sınır: çıktıyı say, logaritmasını al</text>

  <rect x="405" y="38" width="300" height="66" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.3" />
  <text x="418" y="58" font-size="13" fill="var(--text)">yaprak sayısı L ≥ olası çıktı sayısı</text>
  <text x="418" y="78" font-size="13" fill="var(--text)">yüksekliği h olan ikili ağaçta L ≤ 2ʰ</text>
  <text x="418" y="98" font-size="13" fill="var(--text)">⇒ h ≥ lg L</text>

  <text x="425" y="130" font-size="13" text-anchor="middle" fill="var(--text-faint)">n</text>
  <text x="520" y="130" font-size="13" text-anchor="middle" fill="var(--text-faint)">n! (çıktı sayısı)</text>
  <text x="622" y="130" font-size="13" text-anchor="middle" fill="var(--text-faint)">lg n!</text>
  <text x="686" y="130" font-size="13" text-anchor="middle" fill="var(--text-faint)">en az</text>
  <line x1="405" y1="138" x2="705" y2="138" stroke="var(--border)" stroke-width="1" />

  <text x="425" y="160" font-size="13" text-anchor="middle" fill="var(--text)">3</text>
  <text x="520" y="160" font-size="13" text-anchor="middle" fill="var(--text)">6</text>
  <text x="622" y="160" font-size="13" text-anchor="middle" fill="var(--text)">2,58</text>
  <text x="686" y="160" font-size="13" text-anchor="middle" fill="var(--text)">3</text>

  <text x="425" y="184" font-size="13" text-anchor="middle" fill="var(--text)">10</text>
  <text x="520" y="184" font-size="13" text-anchor="middle" fill="var(--text)">3.628.800</text>
  <text x="622" y="184" font-size="13" text-anchor="middle" fill="var(--text)">21,79</text>
  <text x="686" y="184" font-size="13" text-anchor="middle" fill="var(--text)">22</text>

  <text x="425" y="208" font-size="13" text-anchor="middle" fill="var(--text)">20</text>
  <text x="520" y="208" font-size="13" text-anchor="middle" fill="var(--text)">≈ 2,4 · 10¹⁸</text>
  <text x="622" y="208" font-size="13" text-anchor="middle" fill="var(--text)">61,08</text>
  <text x="686" y="208" font-size="13" text-anchor="middle" fill="var(--text)">62</text>

  <text x="405" y="240" font-size="13" fill="var(--text-faint)">sıralamada çıktı sayısı n! ⇒ h = Ω(n log n)</text>
  <text x="405" y="260" font-size="13" fill="var(--text-faint)">aramada çıktı n + 1 ⇒ h ≥ lg(n + 1) − 1</text>

  <text x="15" y="280" font-size="13" fill="var(--text-muted)">Alt sınır modele aittir: sayma ve radix sıralamaları karşılaştırma yapmadıkları için altına iner.</text>
</svg>
