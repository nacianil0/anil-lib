  <text x="15" y="222" font-size="13" fill="var(--text-faint)">koyu yol = açıklık (en uzun bağımlılık zinciri)</text>
  <text x="15" y="244" font-size="13" fill="var(--text)">iş T₁ = 7 · açıklık T∞ = 3 · paralellik ≈ 2,3</text>
  <text x="15" y="264" font-size="13" fill="var(--text)">n = 10⁶: iş ≈ 10⁶ · açıklık 20 · paralellik 50.000</text>

  <line x1="360" y1="36" x2="360" y2="270" stroke="var(--border)" stroke-width="1" />

  <text x="378" y="22" font-size="13" fill="var(--text-muted)">İki yasa ve açgözlü çizelgeleyici</text>

  <rect x="378" y="36" width="320" height="30" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="390" y="56" font-size="13" fill="var(--text)">İŞ YASASI · T_P ≥ T₁ / P</text>

  <rect x="378" y="74" width="320" height="30" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="390" y="94" font-size="13" fill="var(--text)">AÇIKLIK YASASI · T_P ≥ T∞</text>

  <rect x="378" y="112" width="320" height="52" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="390" y="132" font-size="13" fill="var(--text)">Açgözlü çizelgeleyici: T_P ≤ T₁/P + T∞</text>
  <text x="390" y="154" font-size="13" fill="var(--text)">⇒ optimalin en fazla 2 katı</text>

  <text x="378" y="188" font-size="13" fill="var(--text)">paralellik = T₁ / T∞ = hızlanmanın tavanı</text>
  <text x="378" y="212" font-size="13" fill="var(--text-faint)">T₁ = 18, T∞ = 9, seri kesir 3/18 iken</text>
  <text x="378" y="232" font-size="13" fill="var(--text-faint)">Amdahl 6 kat der; gerçek paralellik yalnızca 2</text>
  <text x="378" y="256" font-size="13" fill="var(--text-faint)">birleştirmeli sıralama Θ(n lg n) / Θ(lg³n)</text>

  <text x="15" y="285" font-size="13" fill="var(--text-muted)">Yalnızca işe bakmak hatadır: hızlanmanın tavanını açıklık belirler.</text>
