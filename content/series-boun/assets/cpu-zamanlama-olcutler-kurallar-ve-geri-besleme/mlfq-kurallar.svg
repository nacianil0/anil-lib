<svg viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a28-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
    <marker id="boun-a28-ok-soluk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-faint)" />
    </marker>
  </defs>

  <text x="15" y="22" font-size="13" fill="var(--text-muted)">Çok seviyeli geri besleme kuyruğunun beş kuralı</text>

  <rect x="25" y="32" width="320" height="26" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="34" y="50" font-size="13" fill="var(--text)">1 · Önceliği yüksek olan çalışır</text>

  <rect x="25" y="62" width="320" height="26" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="34" y="80" font-size="13" fill="var(--text)">2 · Öncelikler eşitse round-robin</text>

  <rect x="25" y="92" width="320" height="40" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="34" y="110" font-size="13" fill="var(--text)">3 · Yeni iş en üst kuyruğa girer</text>
  <text x="34" y="127" font-size="13" fill="var(--text-muted)">iyimser varsayım: kısa iş olabilir</text>

  <rect x="25" y="136" width="320" height="40" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <text x="34" y="154" font-size="13" fill="var(--text)">4 · Tahsis tükenince bir alt kuyruğa iner</text>
  <text x="34" y="171" font-size="13" fill="var(--text-muted)">kaç kez bıraktığı önemsiz: oyunu engeller</text>

  <rect x="25" y="180" width="320" height="40" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="34" y="198" font-size="13" fill="var(--text)">5 · S süresinde bir herkes en üste taşınır</text>
  <text x="34" y="215" font-size="13" fill="var(--text-muted)">açlığı bu kural engeller</text>

  <line x1="362" y1="32" x2="362" y2="224" stroke="var(--border)" stroke-width="1" />

  <text x="378" y="22" font-size="13" fill="var(--text-muted)">İşlerin kuyruklar arasındaki yolculuğu</text>

  <text x="378" y="62" font-size="13" fill="var(--text)">Q2 yüksek</text>
  <rect x="460" y="44" width="190" height="26" rx="3" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="658" y="62" font-size="13" fill="var(--text-faint)">10 ms</text>

  <text x="378" y="108" font-size="13" fill="var(--text)">Q1 orta</text>
  <rect x="460" y="90" width="190" height="26" rx="3" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="658" y="108" font-size="13" fill="var(--text-faint)">20 ms</text>

  <text x="378" y="154" font-size="13" fill="var(--text)">Q0 düşük</text>
  <rect x="460" y="136" width="190" height="26" rx="3" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="658" y="154" font-size="13" fill="var(--text-faint)">40 ms</text>

  <rect x="465" y="48" width="35" height="18" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <line x1="500" y1="70" x2="500" y2="86" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#boun-a28-ok)" />
  <rect x="500" y="94" width="45" height="18" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
  <line x1="545" y1="116" x2="545" y2="132" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#boun-a28-ok)" />
  <rect x="545" y="140" width="80" height="18" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />

  <rect x="505" y="48" width="8" height="18" rx="2" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="1.1" />
  <rect x="525" y="48" width="8" height="18" rx="2" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="1.1" />
  <rect x="545" y="48" width="8" height="18" rx="2" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="1.1" />
  <rect x="565" y="48" width="8" height="18" rx="2" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="1.1" />
  <rect x="585" y="48" width="8" height="18" rx="2" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="1.1" />
  <rect x="605" y="48" width="8" height="18" rx="2" fill="var(--surface-muted)" stroke="var(--text-faint)" stroke-width="1.1" />

  <line x1="636" y1="40" x2="636" y2="166" stroke="var(--text-faint)" stroke-width="1.2" stroke-dasharray="4 3" />
  <path d="M 625 149 L 636 149 L 636 70" fill="none" stroke="var(--text-faint)" stroke-width="1.4" marker-end="url(#boun-a28-ok-soluk)" />

  <text x="378" y="186" font-size="13" fill="var(--text)">koyu iz: uzun iş — tahsisini bitirdikçe iner</text>
  <text x="378" y="204" font-size="13" fill="var(--text-muted)">soluk iz: etkileşimli iş, üstte kalır</text>
  <text x="378" y="222" font-size="13" fill="var(--text-faint)">kesik çizgi: S anında herkes en üste taşınır</text>

  <text x="15" y="248" font-size="13" fill="var(--text)">Dördüncü ve beşinci kural yamadır; ikisi de karşı örnekle doğdu.</text>
  <text x="15" y="266" font-size="13" fill="var(--text-muted)">S büyük seçilirse uzun işler aç kalır, küçük seçilirse etkileşimli işler payını alamaz.</text>
  <text x="15" y="282" font-size="13" fill="var(--text-faint)">Süreyi bilmeden, geçmişe bakarak en kısa iş kuralına benzer davranmak mümkündür.</text>
</svg>
