<svg viewBox="0 0 720 392" xmlns="http://www.w3.org/2000/svg">
  <line x1="410" y1="34" x2="410" y2="348" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4" />

  <text x="220" y="30" font-size="15" text-anchor="middle" fill="var(--text)">{a, b, c} kümesinin alt kümeleri, kapsama sırasıyla</text>

  <line x1="220" y1="80" x2="110" y2="142" stroke="var(--border)" stroke-width="1.4" />
  <line x1="220" y1="80" x2="220" y2="142" stroke="var(--border)" stroke-width="1.4" />
  <line x1="220" y1="80" x2="330" y2="142" stroke="var(--border)" stroke-width="1.4" />

  <line x1="110" y1="176" x2="110" y2="232" stroke="var(--accent)" stroke-width="1.8" />
  <line x1="110" y1="176" x2="220" y2="232" stroke="var(--accent)" stroke-width="1.8" />
  <line x1="220" y1="176" x2="110" y2="232" stroke="var(--border)" stroke-width="1.4" />
  <line x1="220" y1="176" x2="330" y2="232" stroke="var(--border)" stroke-width="1.4" />
  <line x1="330" y1="176" x2="220" y2="232" stroke="var(--border)" stroke-width="1.4" />
  <line x1="330" y1="176" x2="330" y2="232" stroke="var(--border)" stroke-width="1.4" />

  <line x1="110" y1="266" x2="220" y2="308" stroke="var(--accent)" stroke-width="1.8" />
  <line x1="220" y1="266" x2="220" y2="308" stroke="var(--accent)" stroke-width="1.8" />
  <line x1="330" y1="266" x2="220" y2="308" stroke="var(--border)" stroke-width="1.4" />

  <ellipse cx="220" cy="62" rx="42" ry="18" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.4" />
  <text x="220" y="67" font-size="13" text-anchor="middle" fill="var(--text)">{a, b, c}</text>

  <ellipse cx="110" cy="159" rx="38" ry="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.6" />
  <text x="110" y="164" font-size="13" text-anchor="middle" fill="var(--text)">{a, b}</text>
  <ellipse cx="220" cy="159" rx="38" ry="18" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.4" />
  <text x="220" y="164" font-size="13" text-anchor="middle" fill="var(--text)">{a, c}</text>
  <ellipse cx="330" cy="159" rx="38" ry="18" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.4" />
  <text x="330" y="164" font-size="13" text-anchor="middle" fill="var(--text)">{b, c}</text>

  <ellipse cx="110" cy="249" rx="34" ry="18" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" />
  <text x="110" y="254" font-size="13" text-anchor="middle" fill="var(--text)">{a}</text>
  <ellipse cx="220" cy="249" rx="34" ry="18" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" />
  <text x="220" y="254" font-size="13" text-anchor="middle" fill="var(--text)">{b}</text>
  <ellipse cx="330" cy="249" rx="34" ry="18" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.4" />
  <text x="330" y="254" font-size="13" text-anchor="middle" fill="var(--text)">{c}</text>

  <ellipse cx="220" cy="326" rx="42" ry="18" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.6" />
  <text x="220" y="331" font-size="13" text-anchor="middle" fill="var(--text)">boş küme</text>

  <text x="440" y="60" font-size="15" fill="var(--text)">{a} ile {b} ikilisi</text>

  <text x="440" y="96" font-size="13" fill="var(--text-muted)">en küçük üst sınır: {a, b}</text>
  <text x="440" y="118" font-size="13" fill="var(--text-muted)">en büyük alt sınır: boş küme</text>

  <rect x="434" y="140" width="266" height="64" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="567" y="166" font-size="13" text-anchor="middle" fill="var(--text)">üst sınır = birleşim</text>
  <text x="567" y="188" font-size="13" text-anchor="middle" fill="var(--text)">alt sınır = kesişim</text>

  <text x="440" y="240" font-size="13" fill="var(--text)">Tümleyen çifti: {a} ve {b, c}</text>
  <text x="440" y="262" font-size="13" fill="var(--text-muted)">üst sınırları en üstteki eleman,</text>
  <text x="440" y="284" font-size="13" fill="var(--text-muted)">alt sınırları en alttaki eleman.</text>
  <text x="440" y="316" font-size="13" fill="var(--text-muted)">Her eleman bir tümleyen bulduğu</text>
  <text x="440" y="338" font-size="13" fill="var(--text-muted)">için bu kafes Boolean cebiridir.</text>

  <text x="360" y="378" font-size="13" text-anchor="middle" fill="var(--text-muted)">Hasse diyagramı yalnızca örtme kenarlarını çizer; yansımalı ve geçişli kenarlar tanımdan bilinir</text>
</svg>
