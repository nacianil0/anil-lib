<svg viewBox="0 0 720 292" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a40-omurga-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
    <marker id="boun-a40-zincir-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cool)" />
    </marker>
    <marker id="boun-a40-tasima-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cool)" />
    </marker>
  </defs>

  <text x="21" y="24" font-size="13" fill="var(--text-muted)">Altmış-doksan saniyelik omurga: dört parça</text>

  <rect x="21" y="38" width="150" height="76" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="96" y="64" font-size="13" text-anchor="middle" fill="var(--text)">1 · İddia</text>
  <text x="96" y="86" font-size="13" text-anchor="middle" fill="var(--text-muted)">Tek cümlelik</text>
  <text x="96" y="104" font-size="13" text-anchor="middle" fill="var(--text-muted)">sonuç</text>

  <rect x="197" y="38" width="150" height="76" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="272" y="64" font-size="13" text-anchor="middle" fill="var(--text)">2 · Koşul</text>
  <text x="272" y="86" font-size="13" text-anchor="middle" fill="var(--text-muted)">Durum, model,</text>
  <text x="272" y="104" font-size="13" text-anchor="middle" fill="var(--text-muted)">varsayım</text>

  <rect x="373" y="38" width="150" height="76" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="448" y="64" font-size="13" text-anchor="middle" fill="var(--text)">3 · Mekanizma</text>
  <text x="448" y="86" font-size="13" text-anchor="middle" fill="var(--text-muted)">Maliyet nereden</text>
  <text x="448" y="104" font-size="13" text-anchor="middle" fill="var(--text-muted)">geliyor?</text>

  <rect x="549" y="38" width="150" height="76" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
  <text x="624" y="64" font-size="13" text-anchor="middle" fill="var(--text)">4 · Bozulma</text>
  <text x="624" y="86" font-size="13" text-anchor="middle" fill="var(--text-muted)">İddia nerede</text>
  <text x="624" y="104" font-size="13" text-anchor="middle" fill="var(--text-muted)">çöker?</text>

  <line x1="173" y1="76" x2="193" y2="76" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a40-omurga-ok)" />
  <line x1="349" y1="76" x2="369" y2="76" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a40-omurga-ok)" />
  <line x1="525" y1="76" x2="545" y2="76" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#boun-a40-omurga-ok)" />

  <text x="21" y="140" font-size="13" fill="var(--text-muted)">Takip zinciri: üç halka</text>
  <text x="606" y="140" font-size="13" text-anchor="end" fill="var(--text-faint)">ikinci halka cevabın içine taşınır</text>

  <path d="M 360 176 L 360 156 L 624 156 L 624 118" fill="none" stroke="var(--cool)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#boun-a40-tasima-ok)" />

  <rect x="21" y="176" width="196" height="70" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="119" y="208" font-size="13" text-anchor="middle" fill="var(--text)">1 · Tanım</text>
  <text x="119" y="230" font-size="13" text-anchor="middle" fill="var(--text-muted)">Bu tam olarak nedir?</text>

  <rect x="262" y="176" width="196" height="70" rx="6" fill="var(--cool-soft)" stroke="var(--cool)" />
  <text x="360" y="208" font-size="13" text-anchor="middle" fill="var(--text)">2 · Sınır durumu</text>
  <text x="360" y="230" font-size="13" text-anchor="middle" fill="var(--text-muted)">Ya en kötü durumda?</text>

  <rect x="503" y="176" width="196" height="70" rx="6" fill="var(--surface-muted)" stroke="var(--border)" />
  <text x="601" y="208" font-size="13" text-anchor="middle" fill="var(--text)">3 · Takas</text>
  <text x="601" y="230" font-size="13" text-anchor="middle" fill="var(--text-muted)">Neden başkası değil?</text>

  <line x1="219" y1="211" x2="258" y2="211" stroke="var(--cool)" stroke-width="1.5" marker-end="url(#boun-a40-zincir-ok)" />
  <line x1="460" y1="211" x2="499" y2="211" stroke="var(--cool)" stroke-width="1.5" marker-end="url(#boun-a40-zincir-ok)" />

  <text x="360" y="274" font-size="13" text-anchor="middle" fill="var(--text-faint)">Omurganın dördüncü parçası, zincirin ikinci halkasını cevabın içine taşır</text>
</svg>
