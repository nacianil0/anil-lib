<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="boun-a26b-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
    <marker id="boun-a26b-ok-geri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cool)" />
    </marker>
  </defs>

  <text x="15" y="22" font-size="13" fill="var(--text-muted)">Sistem çağrısının yaşam döngüsü</text>

  <rect x="16" y="52" width="167" height="242" rx="5" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <rect x="190" y="52" width="155" height="242" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="20" y="45" font-size="13" fill="var(--text-muted)">kullanıcı kipi</text>
  <text x="195" y="45" font-size="13" fill="var(--text-muted)">çekirdek kipi</text>

  <text x="26" y="76" font-size="13" fill="var(--text)">1 açma çağrısı</text>
  <text x="26" y="98" font-size="13" fill="var(--text-faint)">2 argüman + numara</text>
  <text x="26" y="118" font-size="13" fill="var(--text)">  tuzak komutu</text>

  <line x1="150" y1="126" x2="196" y2="140" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#boun-a26b-ok)" />

  <text x="200" y="152" font-size="13" fill="var(--text)">3 yazmaçlar yığına</text>
  <text x="200" y="174" font-size="13" fill="var(--text-faint)">4 kip ve işleyici</text>
  <text x="200" y="196" font-size="13" fill="var(--text-faint)">5 numara denetimi</text>
  <text x="200" y="218" font-size="13" fill="var(--text-faint)">6 argüman denetimi</text>
  <text x="200" y="240" font-size="13" fill="var(--text)">7 işi yap</text>
  <text x="200" y="262" font-size="13" fill="var(--text)">8 tuzaktan dönüş</text>

  <line x1="196" y1="270" x2="150" y2="282" stroke="var(--cool)" stroke-width="2.2" marker-end="url(#boun-a26b-ok-geri)" />

  <text x="26" y="270" font-size="13" fill="var(--text-faint)">9 yazmaçlar geri</text>
  <text x="26" y="290" font-size="13" fill="var(--text)">10 sonraki komut</text>

  <text x="15" y="322" font-size="13" fill="var(--text-faint)">iki geçiş de hem atlar hem ayrıcalık değiştirir</text>
  <text x="15" y="342" font-size="13" fill="var(--text)">hedefi çağıran değil, çekirdek belirler</text>

  <line x1="362" y1="36" x2="362" y2="330" stroke="var(--border)" stroke-width="1" />

  <text x="378" y="22" font-size="13" fill="var(--text-muted)">Zamanlayıcı kesmesiyle denetimi geri almak</text>

  <rect x="378" y="36" width="327" height="56" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="390" y="58" font-size="13" fill="var(--text)">AÇILIŞTA · ikisi de ayrıcalıklı</text>
  <text x="390" y="80" font-size="13" fill="var(--text-faint)">tuzak tablosunu kur · zamanlayıcıyı başlat</text>

  <rect x="379" y="126" width="164" height="164" rx="5" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <rect x="550" y="126" width="155" height="164" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="383" y="119" font-size="13" fill="var(--text-muted)">kullanıcı kipi</text>
  <text x="555" y="119" font-size="13" fill="var(--text-muted)">çekirdek kipi</text>

  <text x="389" y="150" font-size="13" fill="var(--text)">süreç çalışıyor</text>
  <text x="389" y="172" font-size="13" fill="var(--text-faint)">yasak bir şey</text>
  <text x="389" y="192" font-size="13" fill="var(--text-faint)">yapması gerekmez</text>

  <line x1="510" y1="200" x2="556" y2="214" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#boun-a26b-ok)" />

  <text x="560" y="150" font-size="13" fill="var(--text)">süre doldu</text>
  <text x="560" y="172" font-size="13" fill="var(--text-faint)">kesme geldi</text>
  <text x="560" y="196" font-size="13" fill="var(--text-faint)">yazmaçlar yığına</text>
  <text x="560" y="218" font-size="13" fill="var(--text-faint)">kip değişti</text>
  <text x="560" y="240" font-size="13" fill="var(--text-faint)">işleyici çalışır</text>
  <text x="560" y="262" font-size="13" fill="var(--text)">zamanlayıcı karar</text>

  <text x="378" y="322" font-size="13" fill="var(--text-faint)">10 ms'de bir kesme, saniyede 100 kesme</text>
  <text x="378" y="342" font-size="13" fill="var(--text)">işleyici 1 µs ise ek yük yaklaşık %0,01</text>
</svg>
