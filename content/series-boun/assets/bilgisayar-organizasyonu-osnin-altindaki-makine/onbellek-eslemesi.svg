<svg viewBox="0 0 720 474" xmlns="http://www.w3.org/2000/svg">
  <text x="15" y="22" font-size="13" fill="var(--text)">Sekiz yuvalı bir önbellek, üç eşleme düzeni; aynı iki blok yerleştiriliyor: blok 3 ve blok 11</text>

  <rect x="25" y="40" width="280" height="30" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="165" y="60" font-size="13" text-anchor="middle" fill="var(--text)">Etiket</text>
  <rect x="305" y="40" width="230" height="30" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="420" y="60" font-size="13" text-anchor="middle" fill="var(--text)">Küme indisi</text>
  <rect x="535" y="40" width="160" height="30" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="615" y="60" font-size="13" text-anchor="middle" fill="var(--text)">Konum</text>
  <text x="165" y="88" font-size="13" text-anchor="middle" fill="var(--text-faint)">hangi blok</text>
  <text x="420" y="88" font-size="13" text-anchor="middle" fill="var(--text-faint)">hangi küme</text>
  <text x="615" y="88" font-size="13" text-anchor="middle" fill="var(--text-faint)">satır içinde nerede</text>

  <text x="25" y="124" font-size="13" fill="var(--text)">Doğrudan eşlemeli — her bloğun gidebileceği tek bir yuva vardır</text>
  <text x="64" y="146" font-size="13" text-anchor="middle" fill="var(--text-faint)">0</text>
  <rect x="25" y="152" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="149" y="146" font-size="13" text-anchor="middle" fill="var(--text-faint)">1</text>
  <rect x="110" y="152" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="234" y="146" font-size="13" text-anchor="middle" fill="var(--text-faint)">2</text>
  <rect x="195" y="152" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="319" y="146" font-size="13" text-anchor="middle" fill="var(--accent)">3</text>
  <rect x="280" y="152" width="78" height="32" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8" />
  <text x="319" y="174" font-size="13" text-anchor="middle" fill="var(--text)">blok 11</text>
  <text x="404" y="146" font-size="13" text-anchor="middle" fill="var(--text-faint)">4</text>
  <rect x="365" y="152" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="489" y="146" font-size="13" text-anchor="middle" fill="var(--text-faint)">5</text>
  <rect x="450" y="152" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="574" y="146" font-size="13" text-anchor="middle" fill="var(--text-faint)">6</text>
  <rect x="535" y="152" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="659" y="146" font-size="13" text-anchor="middle" fill="var(--text-faint)">7</text>
  <rect x="620" y="152" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="25" y="206" font-size="13" fill="var(--text-muted)">3 mod 8 = 3 ve 11 mod 8 = 3 — blok 11 gelince blok 3 atılır, yedi yuva boş dursa bile</text>
  <text x="25" y="226" font-size="13" fill="var(--accent)">Bu bir çakışma ıskasıdır: yer vardır, ama eşleme izin vermez</text>

  <text x="25" y="266" font-size="13" fill="var(--text)">İki yollu kümeli çağrışımlı — dört küme, her kümede iki yuva</text>
  <text x="105" y="288" font-size="13" text-anchor="middle" fill="var(--text-faint)">küme 0</text>
  <rect x="25" y="294" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <rect x="107" y="294" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="277" y="288" font-size="13" text-anchor="middle" fill="var(--text-faint)">küme 1</text>
  <rect x="197" y="294" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <rect x="279" y="294" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="449" y="288" font-size="13" text-anchor="middle" fill="var(--text-faint)">küme 2</text>
  <rect x="369" y="294" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <rect x="451" y="294" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="621" y="288" font-size="13" text-anchor="middle" fill="var(--accent)">küme 3</text>
  <rect x="541" y="294" width="78" height="32" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8" />
  <text x="580" y="316" font-size="13" text-anchor="middle" fill="var(--text)">blok 3</text>
  <rect x="623" y="294" width="78" height="32" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8" />
  <text x="662" y="316" font-size="13" text-anchor="middle" fill="var(--text)">blok 11</text>
  <text x="25" y="348" font-size="13" fill="var(--text-muted)">3 mod 4 = 3 ve 11 mod 4 = 3 — aynı kümeye düşerler, ama küme iki yuvalı olduğu için</text>
  <text x="25" y="368" font-size="13" fill="var(--text-muted)">ikisi birden durabilir. Bedeli: küme içindeki iki etiketin paralel karşılaştırılması</text>

  <text x="25" y="406" font-size="13" fill="var(--text)">Tam çağrışımlı — tek küme; her blok herhangi bir yuvaya konabilir</text>
  <rect x="25" y="416" width="78" height="32" rx="4" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.8" />
  <text x="64" y="438" font-size="13" text-anchor="middle" fill="var(--text)">blok 3</text>
  <rect x="110" y="416" width="78" height="32" rx="4" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.8" />
  <text x="149" y="438" font-size="13" text-anchor="middle" fill="var(--text)">blok 11</text>
  <rect x="195" y="416" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <rect x="280" y="416" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <rect x="365" y="416" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <rect x="450" y="416" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <rect x="535" y="416" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <rect x="620" y="416" width="78" height="32" rx="4" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.3" />
  <text x="25" y="466" font-size="13" fill="var(--cool)">Çakışma ıskası yoktur; bedeli sekiz yuva için sekiz karşılaştırıcıdır</text>
</svg>
