  <text x="480" y="212" font-size="13" fill="var(--text-muted)">dizi kendisi sıralı değildir:</text>
  <text x="480" y="234" font-size="13" fill="var(--text-muted)">1, 3, 2, 7, 4, 9, 5</text>
  <text x="480" y="266" font-size="13" fill="var(--text-muted)">yükseklik = ⌊log₂ n⌋</text>

  <text x="40" y="312" font-size="13" fill="var(--text-muted)">her düğümün yanındaki i, o düğümün dizideki indisidir; işaretçi saklanmaz</text>
