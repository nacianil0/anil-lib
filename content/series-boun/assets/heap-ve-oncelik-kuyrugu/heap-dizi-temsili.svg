  <text x="496" y="56" font-size="13" fill="var(--text)">sol(i) = 2i + 1</text>
  <text x="496" y="80" font-size="13" fill="var(--text)">sağ(i) = 2i + 2</text>
  <text x="496" y="104" font-size="13" fill="var(--text)">ebeveyn(i) = ⌊(i − 1) / 2⌋</text>

