  <text x="586" y="200" font-size="13" fill="var(--text-muted)">9 &gt; 5: durur</text>
  <text x="380" y="250" font-size="13" fill="var(--text)">küçük olan çocukla takas etmek zorunludur:</text>
  <text x="380" y="272" font-size="13" fill="var(--text-muted)">büyükle takas edilirse değişmez onarılmaz</text>
  <text x="380" y="294" font-size="13" fill="var(--text-muted)">sonuç: 2, 3, 5, 7, 4, 9</text>

  <text x="20" y="342" font-size="13" fill="var(--text-muted)">her iki yordam da kökten yaprağa giden tek bir yol boyunca yürür; maliyet yüksekliğe eşittir</text>
