  <text x="470" y="145" font-size="14" text-anchor="middle" fill="var(--text)">3</text>
  <text x="590" y="145" font-size="14" text-anchor="middle" fill="var(--text)">2</text>
  <text x="440" y="200" font-size="14" text-anchor="middle" fill="var(--text)">7</text>
  <text x="500" y="200" font-size="14" text-anchor="middle" fill="var(--text)">4</text>
