<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-label="Önizleme özelliğinin ilk tasarımının veri akış diyagramı. Kullanıcı, internet sınırının dışında; yükleme API'si yalnızca beyanı görür. Kullanıcının seçtiği baytlar API'ye uğramadan nesne deposuna, oradan önizleme işçisine ve aynı süreçteki dönüştürücüye gider. İşçinin girişinde tasarım belgesinde olmayan ikinci bir sınır işaretli; işçiden kuyruğa noktalı bir hata kenarı sınırsız yeniden teslimi gösterir.">
  <defs>
    <marker id="tm1-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)" />
    </marker>
    <marker id="tm1-ok-vurgu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <line x1="168" y1="46" x2="168" y2="300" stroke="var(--text)" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="176" y="34" font-size="13" font-weight="bold" fill="var(--text)">güven sınırı: internet</text>

  <rect x="16" y="56" width="120" height="56" rx="2" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="1.4" />
  <text x="28" y="80" font-size="13" font-weight="bold" fill="var(--text)">Kullanıcı</text>
  <text x="28" y="100" font-size="13" fill="var(--text-muted)">her kiracıdan</text>

  <rect x="200" y="56" width="160" height="56" rx="24" fill="var(--surface)" stroke="var(--border)" stroke-width="1.4" />
  <text x="216" y="80" font-size="13" font-weight="bold" fill="var(--text)">Yükleme API'si</text>
  <text x="216" y="100" font-size="13" fill="var(--text-muted)">beyanı doğrular</text>

  <rect x="420" y="56" width="160" height="56" fill="var(--surface-muted)" stroke="none" />
  <line x1="420" y1="56" x2="580" y2="56" stroke="var(--text-muted)" stroke-width="1.4" />
  <line x1="420" y1="112" x2="580" y2="112" stroke="var(--text-muted)" stroke-width="1.4" />
  <line x1="420" y1="56" x2="420" y2="112" stroke="var(--text-muted)" stroke-width="1.4" />
  <text x="434" y="80" font-size="13" font-weight="bold" fill="var(--text)">Kuyruk</text>
  <text x="434" y="100" font-size="13" fill="var(--text-muted)">preview.requested</text>

  <rect x="200" y="196" width="160" height="76" fill="var(--surface-muted)" stroke="none" />
  <line x1="200" y1="196" x2="360" y2="196" stroke="var(--text-muted)" stroke-width="1.4" />
  <line x1="200" y1="272" x2="360" y2="272" stroke="var(--text-muted)" stroke-width="1.4" />
  <line x1="200" y1="196" x2="200" y2="272" stroke="var(--text-muted)" stroke-width="1.4" />
  <text x="214" y="220" font-size="13" font-weight="bold" fill="var(--text)">Nesne deposu</text>
  <text x="214" y="242" font-size="13" fill="var(--text-muted)">incoming/</text>
  <text x="214" y="262" font-size="13" fill="var(--text-muted)">previews/</text>

  <rect x="420" y="196" width="216" height="100" rx="20" fill="var(--surface)" stroke="var(--border)" stroke-width="1.4" />
  <text x="436" y="220" font-size="13" font-weight="bold" fill="var(--text)">Önizleme işçisi</text>
  <text x="436" y="240" font-size="13" fill="var(--text-muted)">geniş depolama yetkisi</text>
  <rect x="436" y="252" width="184" height="32" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" />
  <text x="448" y="273" font-size="13" fill="var(--text)">dönüştürücü: aynı süreç</text>

  <line x1="410" y1="184" x2="410" y2="306" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8 6" />
  <text x="300" y="324" font-size="13" font-weight="bold" fill="var(--accent)">tasarım belgesinde olmayan sınır</text>

  <line x1="136" y1="72" x2="196" y2="72" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#tm1-ok)" />
  <line x1="200" y1="96" x2="140" y2="96" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#tm1-ok)" />
  <path d="M76,112 L76,234 L196,234" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tm1-ok-vurgu)" />
  <line x1="360" y1="84" x2="416" y2="84" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#tm1-ok)" />
  <line x1="500" y1="112" x2="500" y2="192" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#tm1-ok)" />
  <line x1="360" y1="220" x2="416" y2="220" stroke="var(--accent)" stroke-width="2" marker-end="url(#tm1-ok-vurgu)" />
  <line x1="420" y1="256" x2="364" y2="256" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#tm1-ok)" />
  <path d="M610,196 L610,84 L586,84" fill="none" stroke="var(--text-muted)" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#tm1-ok)" />
  <text x="620" y="128" font-size="13" fill="var(--text-muted)">hata:</text>
  <text x="620" y="146" font-size="13" fill="var(--text-muted)">sınırsız</text>
  <text x="620" y="164" font-size="13" fill="var(--text-muted)">yeniden</text>
  <text x="620" y="182" font-size="13" fill="var(--text-muted)">teslim</text>

  <circle cx="152" cy="72" r="9" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.2" />
  <text x="152" y="76.5" font-size="13" text-anchor="middle" fill="var(--text)">1</text>
  <circle cx="184" cy="96" r="9" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.2" />
  <text x="184" y="100.5" font-size="13" text-anchor="middle" fill="var(--text)">2</text>
  <circle cx="76" cy="172" r="9" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="76" y="176.5" font-size="13" text-anchor="middle" fill="var(--text)">3</text>
  <circle cx="388" cy="84" r="9" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.2" />
  <text x="388" y="88.5" font-size="13" text-anchor="middle" fill="var(--text)">4</text>
  <circle cx="500" cy="152" r="9" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.2" />
  <text x="500" y="156.5" font-size="13" text-anchor="middle" fill="var(--text)">5</text>
  <circle cx="388" cy="220" r="9" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="388" y="224.5" font-size="13" text-anchor="middle" fill="var(--text)">6</text>
  <circle cx="388" cy="256" r="9" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1.2" />
  <text x="388" y="260.5" font-size="13" text-anchor="middle" fill="var(--text)">7</text>

  <text x="16" y="356" font-size="13" fill="var(--text)">1 beyan: ad, tür, boyut · 2 imzalı yükleme adresi · 3 baytlar, API'ye uğramadan</text>
  <text x="16" y="376" font-size="13" fill="var(--text)">4 önizleme isteği · 5 teslim · 6 ham baytlar · 7 önizleme PNG'si depoya</text>
  <text x="16" y="396" font-size="13" fill="var(--text-muted)">vurgulu yol: kullanıcının seçtiği baytlar · noktalı ok: hata kenarı</text>
  <text x="16" y="416" font-size="13" fill="var(--text-muted)">kesikli çizgi: güven sınırı · vurgulu kesikli çizgi: tasarım belgesinde olmayan sınır</text>
  <text x="16" y="436" font-size="13" fill="var(--text-muted)">dikdörtgen: dış varlık · yuvarlak köşe: süreç · açık uçlu kutu: veri deposu</text>
</svg>
