<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-label="Dört kutu soldan sağa: çalışma ağacı, diskteki dosyalar, pdf.ts +2 satır, Git'te kayıt yok; hazırlık alanı, index, pdf.ts +1 satır, sonraki commit; depo (.git), commit ve ref'ler, HEAD: f8db4cb, pdf.ts eski hâl; imaj, temiz klondan, revision, commit kimliği. Üstte git add çalışma ağacından hazırlık alanına, git commit hazırlık alanından depoya. Depodan imaja yapı oku. Altta depodan iki alana dönen ok: git switch dal, iki alanı o commit'in anlık görüntüsüyle doldurur, HEAD'i taşır. En altta git status --short çıktısı: MM fatura/pdf.ts; 1. harf hazırlık alanı ile HEAD'in commit'i farkı, 2. harf çalışma ağacı ile hazırlık alanı farkı.">
