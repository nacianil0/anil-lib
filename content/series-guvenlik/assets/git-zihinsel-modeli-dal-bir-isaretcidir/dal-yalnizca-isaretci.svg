<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" role="img" aria-label="İki panel, aynı commit konumları. Oklar Git'in yönünde, her commit ebeveynini gösterir. Üst panel önce: HEAD main'de, yama commit edilmeden hemen önce. Ana çizgide 825fed9 XML ucu, 8a819d8 noent: true, 31ad836 1.4.0 adayı; üst sırada f8db4cb PDF şablonu, ebeveyni 31ad836. feature/fatura-pdf f8db4cb'yi, main 31ad836'yı gösteriyor; HEAD main'i gösteriyor. Sol üstte imaj 1.4.0-rc.1, revision: 31ad836; noktalı ok 31ad836'ya. Alt panel sonra: vurgulu yeni commit 85fdda1 XXE yaması, ebeveyni 31ad836; vurgulu main artık 85fdda1'i gösteriyor, HEAD yine main'de. feature/fatura-pdf değişmedi: f8db4cb; imaj kaydı değişmez.">
