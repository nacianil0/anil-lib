<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" role="img" aria-label="Yapılandırmanın iki yolu. Üstte incelenen yol: geliştirici inceleme ister, değişiklik inceleme sınırını geçerek kod deposuna, incelenmiş kaynağa girer; oradan yapı ve dağıtım aynı yapıyı hazırlık ve üretim ortamlarına taşır. Kayma denetimi kod deposundaki beklenen değerle üretimin çalışan değerini karşılaştırır. Altta incelemesiz yol: operatör konsoldan üretimi doğrudan değiştirir; kod deposunda iz kalmaz ve kayma doğar.">
  <defs>
    <marker id="gv2-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)" />
    </marker>
    <marker id="gv2-ok-vurgu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)" />
    </marker>
  </defs>

  <line x1="180" y1="40" x2="180" y2="132" stroke="var(--text)" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="188" y="30" font-size="13" font-weight="bold" fill="var(--text)">inceleme sınırı</text>

  <rect x="16" y="56" width="128" height="48" rx="2" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="1.4" />
  <text x="28" y="76" font-size="13" font-weight="bold" fill="var(--text)">Geliştirici</text>
  <text x="28" y="96" font-size="13" fill="var(--text-muted)">inceleme ister</text>
  <line x1="144" y1="80" x2="228" y2="80" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#gv2-ok)" />

  <rect x="232" y="44" width="160" height="72" fill="var(--surface-muted)" stroke="none" />
  <line x1="232" y1="44" x2="392" y2="44" stroke="var(--text-muted)" stroke-width="1.4" />
  <line x1="232" y1="116" x2="392" y2="116" stroke="var(--text-muted)" stroke-width="1.4" />
  <line x1="232" y1="44" x2="232" y2="116" stroke="var(--text-muted)" stroke-width="1.4" />
  <text x="246" y="66" font-size="13" font-weight="bold" fill="var(--text)">Kod deposu</text>
  <text x="246" y="86" font-size="13" fill="var(--text)">incelenmiş kaynak</text>
  <text x="246" y="106" font-size="13" fill="var(--text-muted)">config/, policy/</text>

  <line x1="392" y1="80" x2="444" y2="80" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#gv2-ok)" />
  <rect x="448" y="56" width="224" height="48" rx="22" fill="var(--surface)" stroke="var(--border)" stroke-width="1.4" />
  <text x="464" y="76" font-size="13" font-weight="bold" fill="var(--text)">Yapı ve dağıtım</text>
  <text x="464" y="96" font-size="13" fill="var(--text-muted)">aynı yapı, iki ortam</text>

  <line x1="488" y1="104" x2="488" y2="176" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#gv2-ok)" />
  <line x1="640" y1="104" x2="640" y2="176" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#gv2-ok)" />
  <rect x="424" y="180" width="128" height="48" rx="22" fill="var(--surface)" stroke="var(--border)" stroke-width="1.4" />
  <text x="440" y="200" font-size="13" font-weight="bold" fill="var(--text)">Hazırlık</text>
  <text x="440" y="220" font-size="13" fill="var(--text-muted)">etkin değer</text>
  <rect x="576" y="180" width="128" height="48" rx="22" fill="var(--surface)" stroke="var(--border)" stroke-width="1.4" />
  <text x="592" y="200" font-size="13" font-weight="bold" fill="var(--text)">Üretim</text>
  <text x="592" y="220" font-size="13" fill="var(--text-muted)">etkin değer</text>

  <rect x="160" y="168" width="232" height="72" rx="22" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4" />
  <text x="176" y="190" font-size="13" font-weight="bold" fill="var(--text)">Kayma denetimi</text>
  <text x="176" y="210" font-size="13" fill="var(--text)">beklenen ile çalışanı</text>
  <text x="176" y="228" font-size="13" fill="var(--text)">karşılaştırır</text>
  <line x1="312" y1="116" x2="312" y2="164" stroke="var(--text-muted)" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#gv2-ok)" />
  <text x="320" y="146" font-size="13" fill="var(--text-muted)">beklenen</text>
  <path d="M616,228 L616,268 L276,268 L276,244" fill="none" stroke="var(--text-muted)" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#gv2-ok)" />
  <text x="440" y="262" font-size="13" fill="var(--text-muted)">çalışan değer</text>

  <rect x="16" y="300" width="128" height="48" rx="2" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="1.4" />
  <text x="28" y="320" font-size="13" font-weight="bold" fill="var(--text)">Operatör</text>
  <text x="28" y="340" font-size="13" fill="var(--text-muted)">konsol</text>
  <path d="M144,324 L660,324 L660,232" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#gv2-ok-vurgu)" />
  <text x="160" y="316" font-size="13" fill="var(--accent)">incelemesiz yol: konsoldan elle değişiklik</text>
  <text x="160" y="344" font-size="13" fill="var(--text-muted)">kod deposunda iz yok, kayma doğar</text>

  <text x="16" y="376" font-size="13" fill="var(--text-muted)">noktalı ok: karşılaştırma · vurgulu ok: incelemeden geçmeyen değişiklik</text>
</svg>
