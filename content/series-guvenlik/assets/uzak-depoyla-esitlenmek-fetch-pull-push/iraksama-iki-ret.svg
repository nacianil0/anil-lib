  <text x="16" y="312" font-size="13" fill="var(--text-muted)">ileri sarma ancak dalın şu anki commit'i yenisinin atasıysa mümkün; ıraksamada ikisi de değil</text>
  <text x="16" y="332" font-size="13" fill="var(--text-muted)">oklar Git'in yönünde · kesikli çerçeve: uzak izleme dalı · koyu kutu: HEAD</text>
</svg>
