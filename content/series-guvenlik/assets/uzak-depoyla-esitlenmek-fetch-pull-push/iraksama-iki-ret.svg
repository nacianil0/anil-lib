  <text x="396" y="100" font-size="13" fill="var(--text-muted)">uzak depoda yok</text>

  <rect x="396" y="171" width="104" height="26" rx="13" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="5 3" />
  <text x="410" y="189" font-size="13" fill="var(--text)">origin/main</text>
  <line x1="394" y1="184" x2="380" y2="184" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ue2-ok)" />
