  <text x="156" y="137" font-size="13" fill="var(--text-muted)">XXE yaması</text>
  <line x1="142" y1="124" x2="116" y2="124" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ue2-ok)" />

  <rect x="280" y="44" width="96" height="40" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" />
