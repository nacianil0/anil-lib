  <line x1="286" y1="164" x2="242" y2="147" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ue2-ok)" />

  <rect x="396" y="51" width="56" height="26" rx="13" fill="var(--surface-muted)" stroke="var(--text-muted)" stroke-width="1.2" />
  <text x="410" y="69" font-size="13" fill="var(--text)">main</text>
  <line x1="394" y1="64" x2="380" y2="64" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ue2-ok)" />
