  <text x="66" y="256" font-size="13" fill="var(--text)">git push: uzaktaki main'i eacea0f'e taşımak 120d7b5'i düşürürdü (fetch first)</text>
  <rect x="16" y="268" width="40" height="22" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="25" y="284" font-size="13" font-weight="bold" fill="var(--accent)">ret</text>
