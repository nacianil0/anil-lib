<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" role="img" aria-label="a klonu, git fetch sonrası: main ile origin/main ıraksadı. Oklar Git'in yönünde. 31ad836 1.4.0 adayı ve 85fdda1 XXE yaması ortak geçmiş; 85fdda1'in iki çocuğu var. Üstte eacea0f fatura notu: main ve HEAD onu gösteriyor, uzak depoda yok. Altta 120d7b5 1.4.0-rc.2: kesikli origin/main onu gösteriyor, a'nın main'inde yok. Sağda sayım: main...origin/main, sol 1 · sağ 1. Altta iki ret: git push, uzaktaki main'i eacea0f'e taşımak 120d7b5'i düşürürdü (fetch first); git pull (--ff-only), main'i 120d7b5'e taşımak eacea0f'i düşürürdü (çıkış 128). Son satır: ileri sarma ancak dalın şu anki commit'i yenisinin atasıysa mümkün; ıraksamada ikisi de değil.">
  <defs>
    <marker id="ue2-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)" />
    </marker>
  </defs>

  <text x="16" y="24" font-size="13" font-weight="bold" fill="var(--text)">a klonu, git fetch sonrası: main ile origin/main ıraksadı</text>

