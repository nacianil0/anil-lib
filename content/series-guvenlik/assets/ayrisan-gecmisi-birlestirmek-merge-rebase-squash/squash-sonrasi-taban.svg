<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="İki panel; oklar Git'in yönünde, her commit ebeveynini gösterir. Panel 1, y klonunda squash'tan sonra: üst çizgide f8db4cb, ad2634c, 3bfd1a1 ve vurgulu devam commit'i ec788df; kesikli origin/feature/fatura-pdf ec788df'i gösteriyor. Alt çizgide birleştirme tabanı 66098e2 ve vurgulu squash commit'i ac8d84d; kesikli origin/main ac8d84d'yi gösteriyor. 3bfd1a1'in ikinci ebeveyni 66098e2. Notlar: squash dalın commit'lerini kaydetmedi, ortak ata hâlâ 66098e2; fatura/pdf.ts tabanda yok, main kdv toplam, dal kdv oran-bazinda ekledi; aynı alanda iki farklı ekleme, add/add çatışması, merge-tree çıkışı 1. Panel 2, düzeltme: ac8d84d'nin üstünde vurgulu b2dff87, feature/fatura-kdv-oran onu gösteriyor; eski dal ec788df'de, kapanacak; git rebase --onto origin/main 3bfd1a1 yalnızca 3bfd1a1'den sonraki commit'i taşıdı.">
