<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" role="img" aria-label="Politika servisinin üç cevabı: izin, ret ve karar alınamadı. Kırılgan kod yalnızca açık reddi durdurur ve karar alınamadığında paylaşım oluşur, yani fail-open. Düzeltilmiş kod yalnızca açık izni geçirir: izin durumunda 201 ve denetim kaydı, ret durumunda 403, karar alınamadığında 503 ve yan etki yok.">
  <defs>
    <marker id="o2-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)" />
    </marker>
  </defs>

  <rect x="230" y="12" width="260" height="40" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="360" y="37" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">politika servisinin cevabı</text>

  <line x1="330" y1="52" x2="140" y2="80" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#o2-ok)" />
  <line x1="360" y1="52" x2="360" y2="80" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#o2-ok)" />
  <line x1="390" y1="52" x2="580" y2="80" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#o2-ok)" />

  <rect x="24" y="84" width="208" height="96" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="128" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">izin</text>
  <text x="128" y="134" font-size="13" text-anchor="middle" fill="var(--text-muted)">{ allowed: true }</text>

  <rect x="256" y="84" width="208" height="96" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="360" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">ret</text>
  <text x="360" y="134" font-size="13" text-anchor="middle" fill="var(--text-muted)">{ allowed: false }</text>

  <rect x="488" y="84" width="208" height="96" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2" />
  <text x="592" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">karar alınamadı</text>
  <text x="592" y="128" font-size="13" text-anchor="middle" fill="var(--text-muted)">zaman aşımı, 5xx,</text>
  <text x="592" y="148" font-size="13" text-anchor="middle" fill="var(--text-muted)">bozuk ya da eksik gövde,</text>
  <text x="592" y="168" font-size="13" text-anchor="middle" fill="var(--text-muted)">eski şema</text>

  <text x="24" y="206" font-size="13" font-weight="bold" fill="var(--text)">kırılgan kod: yalnızca açık ret durdurur</text>
  <rect x="24" y="216" width="208" height="44" rx="7" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="128" y="243" font-size="13" text-anchor="middle" fill="var(--text)">paylaşım oluşur</text>
  <rect x="256" y="216" width="208" height="44" rx="7" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="360" y="243" font-size="13" text-anchor="middle" fill="var(--text)">403</text>
  <rect x="488" y="216" width="208" height="44" rx="7" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" />
  <text x="592" y="243" font-size="13" font-weight="bold" text-anchor="middle" fill="var(--text)">paylaşım oluşur: fail-open</text>

  <text x="24" y="288" font-size="13" font-weight="bold" fill="var(--text)">düzeltilmiş kod: yalnızca açık izin geçer</text>
  <rect x="24" y="298" width="208" height="60" rx="7" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="128" y="333" font-size="13" text-anchor="middle" fill="var(--text)">201 + denetim kaydı</text>
  <rect x="256" y="298" width="208" height="60" rx="7" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.2" />
  <text x="360" y="333" font-size="13" text-anchor="middle" fill="var(--text)">403 + ret sayacı</text>
  <rect x="488" y="298" width="208" height="60" rx="7" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.6" />
  <text x="592" y="322" font-size="13" text-anchor="middle" fill="var(--text)">503, yan etki yok</text>
  <text x="592" y="342" font-size="13" text-anchor="middle" fill="var(--text)">karar alınamadı sayacı</text>
</svg>
